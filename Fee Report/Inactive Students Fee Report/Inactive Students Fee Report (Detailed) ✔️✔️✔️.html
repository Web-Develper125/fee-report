<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Inactive Students Fee Report (Detailed)</title>
</head>
<body>
<script>
    /* ================= DUMMY DATA (same shape as the page's allStudentData: one row per student with unpaidFees[] + totalDues) ================= */
    var systemSettings = { school_name: "Dummy Public School", school_logo: "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2271%22%20height%3D%2271%22%3E%3Ccircle%20cx%3D%2235.5%22%20cy%3D%2235.5%22%20r%3D%2233%22%20fill%3D%22%23f0f0f0%22%20stroke%3D%22%23999%22%20stroke-width%3D%222%22%2F%3E%3Ctext%20x%3D%2235.5%22%20y%3D%2243%22%20font-size%3D%2222%22%20font-weight%3D%22700%22%20text-anchor%3D%22middle%22%20fill%3D%22%23333%22%20font-family%3D%22Arial%22%3EAI%3C%2Ftext%3E%3C%2Fsvg%3E" };
    var type_name = "All", fee_month = "", fee_year = 2026, custom_fee_name = "";
    var fee_status = "All", student_status = ["All"];
    var campus_name = "All", class_name = "All", section_name = "All";
    var start_date = "2026-01-01", end_date = "2026-11-02";

    var names = [["Ali Raza", "Raza Khan"], ["Ayesha Noor", "Noor Ahmed"], ["Hamza Tariq", "Tariq Mehmood"], ["Fatima Zahra", "Zahid Hussain"], ["Usman Ghani", "Abdul Ghani"], ["Bilal Ahmed", "Ahmed Siddique"], ["Sana Malik", "Malik Aslam"], ["Zain Abbas", "Abbas Ali"], ["Hira Fatima", "Shahid Iqbal"], ["Omar Farooq", "Farooq Hassan"]];
    var classes = ["Class 5", "Class 6", "Class 7", "Class 8", "Class 9"], sections = ["A", "B", "C"];
    var feeTitles = ["March 2026", "April 2026", "May 2026", "June 2026", "Transport April 2026", "Annual Fund", "Trip Fee", "July 2026", "August 2026", "September 2026"];
    var allStudentData = [];
    for (var i = 0; i < 28; i++) {
        var count = (i % 9 === 4) ? 10 : 1 + (i % 4), fees = [], total = 0; // every 9th student has 10 unpaid fees
        for (var k = 0; k < count; k++) {
            var dues = 1200 + ((i * 3 + k * 5) % 8) * 450;
            fees.push({ title: feeTitles[(i + k) % feeTitles.length], dues: dues, fee_status: k % 2 ? "Clear" : "Unpaid" });
            total += dues;
        }
        var d = new Date(2026, (i % 10), 1 + (i % 27));
        allStudentData.push({
            general_registration_code: "DPS-STD-" + String(i + 1).padStart(3, "0"),
            student_name: names[i % names.length][0], student_father_name: names[i % names.length][1],
            class_name: classes[i % classes.length], section_name: sections[i % sections.length],
            student_father_phone: "03" + (10 + (i % 5)) + String(1000000 + i * 37311).slice(0, 7),
            inactiveDate: d.toLocaleDateString("pt-PT"), unpaidFees: fees, totalDues: total
        });
    }
    var totalStudent = allStudentData.length;
    var totalInvoiceCount = allStudentData.reduce(function (s, r) { return s + r.unpaidFees.length; }, 0);
    var totalDues = allStudentData.reduce(function (s, r) { return s + r.totalDues; }, 0);

    var n = function (v) { return (Number(v) || 0).toLocaleString(); };
    function fmtDate(v) { return v ? new Date(v).toLocaleDateString("pt-PT") : "-"; }
    // Reg # as the last number of the code, zeros kept (DPS-STD-001 -> 001)
    var grNumber = function (code) { var m = String(code == null ? "" : code).match(/\d+(?!.*\d)/); return m ? m[0] : "-"; };

    /* ================= PRINT TEMPLATE (portrait, fixed column widths so long Fee Details wrap inside their own column) ================= */
    var filtersRow1 = [["Fee Type", type_name]];
    if (type_name === "Monthly Fee" || type_name === "Transport Fee") { filtersRow1.push(["Month", fee_month], ["Year", fee_year]); }
    else if (type_name === "Custom Fee") filtersRow1.push(["Fee Name", custom_fee_name]);
    filtersRow1.push(["Fee Status", fee_status], ["Student Status", student_status.indexOf("All") !== -1 ? "All" : (student_status.join(", ") || "-")]);
    var filtersRow2 = [["Campus", campus_name || "All"], ["Class", class_name || "All"], ["Section", section_name || "All"]];
    var filtersRow3 = [["Status Date", fmtDate(start_date) + " to " + fmtDate(end_date)]];
    var filtersHtml = function (arr) {
        return '<div class="filters-row">' + arr.map(function (f) { return f[0] + ': <b>' + f[1] + '</b>'; }).join(' <span class="sep">||</span> ') + '</div>';
    };

    var tableRowsHtml = allStudentData.length > 0 ? allStudentData.map(function (i, index) {
        var fees = (i.unpaidFees || []).filter(function (f) { return f.title; }).map(function (f) {
            return '<span class="fee-chip">' + f.title + ' = <b>' + n(f.dues) + '</b></span>';
        });
        return '<tr>' +
            '<td class="table-cell center">' + (index + 1) + '</td>' +
            '<td class="table-cell center">' + grNumber(i.general_registration_code) + '</td>' +
            '<td class="table-cell center nowrap">' + (i.class_name || '-') + '/' + (i.section_name || '-') + '</td>' +
            '<td class="table-cell"><span class="student-name">' + i.student_name + '</span> <span class="student-father">' + (i.student_father_name || '') + '</span></td>' +
            '<td class="table-cell center nowrap">' + (i.student_father_phone || '-') + '</td>' +
            '<td class="table-cell center nowrap">' + (i.inactiveDate || '-') + '</td>' +
            '<td class="table-cell center">' + (i.unpaidFees ? i.unpaidFees.length : 0) + '</td>' +
            '<td class="table-cell fee-details">' + (fees.length ? '<div class="fee-chips">' + fees.join('') + '</div>' : '-') + '</td>' +
            '<td class="table-cell right strong">' + n(i.totalDues) + '</td>' +
            '</tr>';
    }).join('') + '<tr class="grand-total-row"><td class="grand-total-label" colspan="6">Grand Total:</td><td class="grand-total-cell">' + n(totalInvoiceCount) + '</td><td class="grand-total-cell"></td><td class="grand-total-cell right">' + n(totalDues) + '</td></tr>'
        : '<tr><td class="no-records" colspan="9">No Records Found!</td></tr>';

    var reportContent = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>Inactive Students Fee Report (Detailed)</title>
                <style>
                @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
                * { margin:0; padding:0; box-sizing:border-box; font-family:"Poppins",Arial,sans-serif !important; }
                @page { size: A4 portrait; margin: 6mm; }
                html, body { background:#fff; color:#000; font-size:9.5px; line-height:1.2; padding:3px; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
                /* Header: logo | school name, title and filters | spacer, one black line under it (compact) */
                .header-section { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; border-bottom:1px solid #000; padding:0 0 5px; }
                .header-section h1 { font-size:15px; font-weight:700; margin-bottom:1px; color:#000; }
                .header-section h2 { font-size:11px; font-weight:700; margin-bottom:2px; color:#000; }
                .header-side { flex:0 0 40px; }
                .header-logo { width:40px; height:40px; object-fit:contain; border-radius:4px; }
                .filters { font-size:9px; font-weight:600; line-height:1.3; color:#444; }
                .filters-row { display:flex; justify-content:center; flex-wrap:wrap; gap:0 5px; }
                .filters b { font-weight:700; color:#000; }
                .filters .sep { color:#999; }
                /* Stats: one horizontal strip under the header, Total Dues in a grey box */
                .stats-strip { display:grid; grid-template-columns:repeat(3,1fr); border:1.5px solid #000; margin-bottom:5px; }
                .stat { padding:2px 6px; text-align:center; border-right:1px solid #000; }
                .stat:last-child { border-right:none; }
                .stat.net { background:#d9d9d9 !important; }
                .stat-label { font-size:8px; font-weight:600; text-transform:uppercase; letter-spacing:.2px; color:#000; }
                .stat-value { font-size:13px; font-weight:800; color:#000; }
                .section-title { font-size:11px; font-weight:700; color:#000; text-transform:uppercase; margin-bottom:3px; }
                /* Table: black outer lines, grey header, no stripes (compact rows) */
                table { width:100%; border-collapse:collapse; font-size:9.5px; font-variant-numeric:tabular-nums; }
                thead { display:table-header-group; }
                tr { page-break-inside:avoid; }
                thead tr.table-head-row { background:#c4c4c4; }
                .table-head-cell { padding:2px 4px; text-align:center; color:#000; background-color:#c4c4c4 !important; font-weight:700; font-size:8.5px; text-transform:uppercase; border:1px solid #000; }
                .table-head-cell.right { text-align:right; }
                .table-cell { white-space:nowrap; padding:3px 4px; vertical-align:middle; font-size:9.5px; border:1px solid #999; font-weight:500; color:#000; }
                .table-cell.right { text-align:right; }
                .table-cell.center { text-align:center; }
                .table-cell.strong { font-weight:700; }
                .nowrap { white-space:nowrap; }
                .table-cell.fee-details { white-space:normal; width:100%; padding:3px 4px; }   /* the only column that grows: it takes all the space the other columns do not need */
                .fee-chips { display:flex; flex-wrap:wrap; gap:3px 4px; }
                .fee-chip { display:inline-block; border:1px solid #b5b5b5; border-radius:2px; background:#f6f6f6 !important; padding:1px 4px; font-size:8.5px; line-height:1.3; font-weight:500; white-space:nowrap; }
                .fee-chip b { font-weight:800; margin-left:1px; }
                .student-name { font-weight:700; font-size:10px; }
                .student-father { display:block; font-weight:500; font-size:9px; color:#555; }   /* the father name sits under the student name, in the same column */
                .no-records { text-align:center; padding:12px; font-size:9px; border:1px solid #999; }
                .grand-total-row { background:#f0f0f0; }
                .grand-total-label { padding:2px 4px; text-align:right; color:#000; background-color:#f0f0f0 !important; font-weight:700; font-size:10px; text-transform:uppercase; border:1px solid #999; border-top:2px solid #999; }
                .grand-total-cell { padding:2px 4px; font-weight:700; font-size:10px; color:#000; background-color:#f0f0f0 !important; text-align:center; border:1px solid #999; border-top:2px solid #999; }
                .grand-total-cell.right { text-align:right; }
                .print-footer { margin-top:6px; padding-top:3px; font-size:9px; color:#000; text-align:center; font-weight:700; }
                @media print { html, body { padding:0 !important; } }
                </style>
            </head>
            <body>
                <div class="page">
                    <div class="header-section">
                        <div class="header-side">
                            ${systemSettings?.school_logo ? `<img src="${systemSettings.school_logo}" class="header-logo" alt="Logo" />` : ''}
                        </div>
                        <div style="text-align: center; flex: 1;">
                            <h1>${systemSettings?.school_name || 'School Management System'}</h1>
                            <h2>Inactive Students Fee Report (Detailed)</h2>
                            <div class="filters">
                                ${filtersHtml(filtersRow1)}
                                ${filtersHtml(filtersRow2)}
                                ${filtersHtml(filtersRow3)}
                            </div>
                        </div>
                        <div class="header-side"></div>
                    </div>

                    <div class="stats-strip">
                        <div class="stat"><div class="stat-label">Total Students</div><div class="stat-value">${n(totalStudent)}</div></div>
                        <div class="stat"><div class="stat-label">Number Of Invoices</div><div class="stat-value">${n(totalInvoiceCount)}</div></div>
                        <div class="stat net"><div class="stat-label">Total Dues</div><div class="stat-value">Rs. ${n(totalDues)}</div></div>
                    </div>

                    <div class="section-title">Inactive Students Dues Breakdown</div>
                    <table>
                        <thead>
                            <tr class="table-head-row">
                                <th class="table-head-cell">Sr #</th>
                                <th class="table-head-cell">Reg #</th>
                                <th class="table-head-cell">Class/Section</th>
                                <th class="table-head-cell">Student Name</th>
                                <th class="table-head-cell">Phone</th>
                                <th class="table-head-cell">Inactive Date</th>
                                <th class="table-head-cell"># Of Invoices</th>
                                <th class="table-head-cell" style="width:100%;">Fee Details</th>
                                <th class="table-head-cell right">Total Dues</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRowsHtml}
                        </tbody>
                    </table>

                    <div class="print-footer">
                        Generated on: ${new Date().toLocaleDateString("pt-PT")} | Powered by Ai Schooling System.com
                    </div>
                </div>
            </body>
            </html>
        `;

    /* ================= RENDER: the report is written as the whole page ================= */
    window.addEventListener("load", function () {
        document.open();
        document.write(reportContent);
        document.close();
        // preview only
        var st = document.createElement("style");
        st.textContent = ".print-btn { position: fixed; top: 12px; right: 16px; z-index: 10; background: #000; color: #fff; border: 1px solid #000; padding: 7px 16px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: Poppins, sans-serif; } @media print { .print-btn { display: none !important; } }";
        document.head.appendChild(st);
        var b = document.createElement("button");
        b.className = "print-btn"; b.textContent = "Print"; b.onclick = function () { window.print(); };
        document.body.appendChild(b);
    });
</script>
</body>
</html>
