<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payment Channel Wise Fee Collection Report</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; font-family:"Poppins",Arial,sans-serif !important; }
@page { size: A4 portrait; margin: 7mm; }
html, body { background:#fff; color:#000; font-size:9px; line-height:1.2; padding:5px; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
/* Header: logo | school name, title and filters | stat box, one black line under it (same as the Detailed report) */
.header-section { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid #000; padding:0 0 8px; }
.header-section h1 { font-size:17px; font-weight:700; margin-bottom:2px; color:#000; }
.header-section h2 { font-size:12px; font-weight:700; margin-bottom:4px; color:#000; }
.header-side { flex:0 0 190px; }
.header-logo { width:56px; height:56px; object-fit:contain; border-radius:5px; }
.filters { font-size:9px; font-weight:600; line-height:1.5; color:#444; }
.filters-row { display:flex; justify-content:center; flex-wrap:wrap; gap:0 6px; }
.filters b { font-weight:700; color:#000; }
.filters .sep { color:#999; }
/* Stats: one horizontal strip under the header, Net Receiving in a grey box */
.stats-strip { display:grid; grid-template-columns:repeat(5,1fr); border:1.5px solid #000; margin-bottom:8px; }
.stat { padding:5px 6px; text-align:center; border-right:1px solid #000; }
.stat:last-child { border-right:none; }
.stat.net { background:#d9d9d9 !important; }
.stat-label { font-size:7.6px; font-weight:600; text-transform:uppercase; letter-spacing:.2px; color:#000; }
.stat-value { font-size:14px; font-weight:800; margin-top:1px; color:#000; }
.section-title { font-size:12px; font-weight:700; color:#000; text-transform:uppercase; margin-bottom:4px; }
/* Tables: black outer lines, grey header, no stripes */
table { width:100%; border-collapse:collapse; font-size:10.5px; font-variant-numeric:tabular-nums; }
thead { display:table-header-group; }
tr { page-break-inside:avoid; }
thead tr.table-head-row { background:#c4c4c4; }
.table-head-cell { padding:3px 5px; text-align:center; color:#000; background-color:#c4c4c4 !important; font-weight:700; font-size:9.5px; text-transform:uppercase; border:1px solid #000; }
.table-head-cell.right { text-align:right; font-size:9.5px; }
.table-cell { padding:3px 6px; font-size:10.5px; border:1px solid #999; font-weight:500; color:#000; }
.table-cell.right { text-align:right; }
.table-cell.center { text-align:center; }
.table-cell.strong { font-weight:700; }
.date-cell { text-align:center; font-weight:600; white-space:nowrap; }
.zero-dash { color:#888; font-weight:400; }
.no-records { text-align:center; padding:17px; font-size:9px; border:1px solid #999; }
.grand-total-row { background:#f0f0f0; }
.grand-total-label { padding:3px 6px; text-align:right; color:#000; background-color:#f0f0f0 !important; font-weight:700; font-size:10.5px; text-transform:uppercase; border:1px solid #999; border-top:2px solid #999; }
.grand-total-cell { padding:3px 6px; font-weight:700; font-size:10.5px; color:#000; background-color:#f0f0f0 !important; text-align:center; border:1px solid #999; border-top:2px solid #999; }
.grand-total-cell.right { text-align:right; }
.print-footer { margin-top:11px; padding-top:7px; font-size:9px; color:#000; text-align:center; font-weight:700; }
/* preview only */
.print-btn { position:fixed; top:12px; right:16px; background:#000; color:#fff; border:1px solid #000; padding:7px 16px; font-size:11px; font-weight:600; cursor:pointer; }
@media print { .print-btn { display:none !important; } }
/* User Wise Breakdown + footer always at the end of the LAST page: a spacer (set by the script below) fills the gap above it */
.bottom { break-inside:avoid; page-break-inside:avoid; margin-top:10px; }
#pageSpacer { height:0; }
.page-measure { position:absolute; visibility:hidden; left:0; top:0; width:1px; height:281mm; }
/* same layout the printer uses, applied only while measuring */
body.measuring { padding:0 !important; }
body.measuring .page { width:196mm !important; margin:0 !important; }
@media print { html, body { padding:0 !important; } }
.mode-merge { vertical-align:middle; font-weight:700; text-transform:uppercase; }
.mode-total { vertical-align:middle; font-weight:700; }
</style>
</head>
<body>
<script>


/* ===== DUMMY DATA (same names and shapes as the page's state in Payment Channel Wise Fee Report.jsx) ===== */
var systemSetting = {
    school_name: 'Ai Model School System',
    school_logo: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="71" height="71"><circle cx="35.5" cy="35.5" r="33" fill="#f0f0f0" stroke="#999" stroke-width="2"/><text x="35.5" y="43" font-size="22" font-weight="700" text-anchor="middle" fill="#333" font-family="Arial">AI</text></svg>')
};
var session_id = 'All';
var campus_name = 'All', class_name = 'All', section_name = 'All';
var type_name = 'Monthly Fee', fee_month = 'October', fee_year = 2026, custom_fee_name = '';
var start_date_incomePageFilter = '2026-10-01';
var end_date_incomePageFilter = '2026-10-19';
var payment_mode_id = ['All'], payment_mode_source_id = ['All'];
var selectedUsers = ['All'];
var activeSessions = [{ _id: 's-2026', session_name: '2026-2027' }];

var MODES = { m1: 'Cash', m2: 'Bank Transfer', m3: 'Easypaisa', m4: 'Cheque' };
var SOURCES = { s1: 'General', s5: 'Front Desk', s2: 'Meezan Bank', s6: 'HBL', s3: 'Office Wallet' };
var SOURCES_BY_MODE = { m1: ['s1', 's5'], m2: ['s2', 's6'], m3: ['s3'], m4: [] };
var getModeName = function (id) { return MODES[String((id && id._id) || id)] || ''; };
var getSourceName = function (id) { return SOURCES[String((id && id._id) || id)] || ''; };
var getSourceByMode = function (modeId) { return (SOURCES_BY_MODE[String(modeId)] || []).map(function (sid) { return { _id: sid, source: SOURCES[sid] }; }); };
var paymentMethods = Object.keys(MODES).map(function (id) { return { _id: id, mode_name: MODES[id] }; });

var inv = function (o) {
    return Object.assign({ campus_name: 'Main Campus', fee_status: 'Paid', late_fine: 0, fee_discount: 0, clear_fee_date: null, payment_mode_id: null, payment_mode_source_id: null, payment_recieved_by: '', partial_payment_history: [], further_discount_history: [], late_fee_fine_discount_history: [] }, o);
};
var totalData = [
    inv({ _id: 'p1', general_registration_code: 'BSS-STD-12',  student_family_code: '1001', student_name: 'Ali Raza',        student_father_name: 'Raza Khan',        class_name: 'Class 5', section_name: 'A', title: 'Fee Of October 2026',   due_date: '2026-10-10T00:00:00.000Z', paying_date: '2026-10-02T09:10:00.000Z', actual_fee: 6000, fee_after_discount: 5400, paid_amount: 5400, payment_mode_id: 'm1', payment_mode_source_id: 's1', payment_recieved_by: 'ali',
          further_discount_history: [{ amount: 600, date: '2026-10-02T09:05:00.000Z', discount_by: 'admin' }] }),
    inv({ _id: 'p2', general_registration_code: 'BSS-STD-25',  student_family_code: '1002', student_name: 'Saad Ali',        student_father_name: 'Muhammad Naeem',   class_name: 'Class 5', section_name: 'A', title: 'Fee Of October 2026',   due_date: '2026-10-10T00:00:00.000Z', paying_date: '2026-10-03T10:30:00.000Z', actual_fee: 2850, fee_after_discount: 2850, paid_amount: 2850, payment_mode_id: 'm2', payment_mode_source_id: 's2', payment_recieved_by: 'usman' }),
    inv({ _id: 'p3', general_registration_code: 'BSS-STD-130', student_family_code: '1003', student_name: 'Hamza Tariq',     student_father_name: 'Tariq Mehmood',    class_name: 'Class 7', section_name: 'B', title: 'Fee Of October 2026',   due_date: '2026-10-10T00:00:00.000Z', paying_date: '2026-10-05T12:20:00.000Z', actual_fee: 8000, fee_after_discount: 8000, paid_amount: 8000, payment_mode_id: 'm3', payment_mode_source_id: 's3', payment_recieved_by: 'ali',
          partial_payment_history: [
              { amount: 3000, date: '2026-10-01T09:40:00.000Z', payment_mode_id: 'm1', payment_mode_source_id: 's1', payment_recieved_by: 'ali' },
              { amount: 2000, date: '2026-10-04T12:10:00.000Z', payment_mode_id: 'm2', payment_mode_source_id: 's6', payment_recieved_by: 'usman' }
          ] }),
    inv({ _id: 'p4', general_registration_code: 'BSS-STD-209', student_family_code: '1004', student_name: 'Zainab Fatima',   student_father_name: 'Ahmed Fatima',     class_name: 'Class 3', section_name: 'C', title: 'Fee Of September 2026', due_date: '2026-09-10T00:00:00.000Z', paying_date: null, fee_status: 'Unpaid', actual_fee: 3000, fee_after_discount: 3000, late_fine: 300, paid_amount: 1500,
          partial_payment_history: [{ amount: 1500, date: '2026-10-06T14:05:00.000Z', payment_mode_id: 'm1', payment_mode_source_id: 's5', payment_recieved_by: 'usman' }] }),
    inv({ _id: 'p5', general_registration_code: 'BSS-STD-787', student_family_code: '1005', student_name: 'Zayan Ali',       student_father_name: 'Muhammad Yousaf',  class_name: 'Class 8', section_name: 'A', title: 'Fee Of September 2026', due_date: '2026-09-10T00:00:00.000Z', paying_date: '2026-10-07T11:15:00.000Z', actual_fee: 2850, fee_after_discount: 2700, late_fine: 300, paid_amount: 3000, payment_mode_id: 'm2', payment_mode_source_id: 's2', payment_recieved_by: 'usman',
          further_discount_history: [{ amount: 150, date: '2026-10-07T11:10:00.000Z', discount_by: 'admin' }],
          late_fee_fine_discount_history: [{ amount: 100, date: '2026-10-07T11:12:00.000Z', discount_by: 'usman' }] }),
    inv({ _id: 'p6', general_registration_code: 'BSS-STD-870', student_family_code: '1006', student_name: 'Zain Hassan',     student_father_name: 'Muhammad Ayub',    class_name: 'Class 8', section_name: 'A', title: 'Fee Of August 2026',    due_date: '2026-08-10T00:00:00.000Z', paying_date: '2026-10-08T11:50:00.000Z', actual_fee: 3000, fee_after_discount: 3000, late_fine: 200, paid_amount: 3200, payment_mode_id: 'm1', payment_mode_source_id: 's1', payment_recieved_by: 'sara' }),
    inv({ _id: 'p7', general_registration_code: 'BSS-STD-1212', student_family_code: '1007', student_name: 'Rehan Ali',      student_father_name: 'Muhammad Danish',  class_name: 'Class 6', section_name: 'B', title: 'Fee Of October 2026',   due_date: '2026-10-10T00:00:00.000Z', paying_date: '2026-10-09T12:35:00.000Z', actual_fee: 2750, fee_after_discount: 2750, paid_amount: 2750, payment_mode_id: 'm3', payment_mode_source_id: 's3', payment_recieved_by: 'usman' }),
    inv({ _id: 'p8', general_registration_code: 'BSS-STD-1440', student_family_code: '1008', student_name: 'Ismail Ahmed',   student_father_name: 'Muhammad Anwar',   class_name: 'Class 9', section_name: 'B', title: 'Fee Of October 2026',   due_date: '2026-10-10T00:00:00.000Z', paying_date: '2026-10-10T13:05:00.000Z', actual_fee: 3100, fee_after_discount: 3100, paid_amount: 3100, payment_mode_id: 'm4', payment_mode_source_id: null, payment_recieved_by: 'sara' }),
    inv({ _id: 'p9', general_registration_code: 'BSS-STD-2536', student_family_code: '1009', student_name: 'Maryam Noor',    student_father_name: 'Noor Hussain',     class_name: 'Class 4', section_name: 'A', title: 'Transport Fee October 2026', due_date: '2026-10-10T00:00:00.000Z', paying_date: '2026-10-12T13:40:00.000Z', actual_fee: 2500, fee_after_discount: 2300, paid_amount: 2300, payment_mode_id: 'm1', payment_mode_source_id: 's5', payment_recieved_by: '',
          further_discount_history: [{ amount: 200, date: '2026-10-12T13:35:00.000Z', discount_by: 'sara' }] })
];
var allStudentData = totalData.slice();
var sortByFamilyCode = function (a, b) { return String((a && a.student_family_code) || '').localeCompare(String((b && b.student_family_code) || ''), undefined, { numeric: true, sensitivity: 'base' }); };

/* ===== SAME CODE AS Payment Channel Wise Fee Report.jsx ===== */
const normalizeName = (value) => String(value ?? "").trim().replace(/\s+/g, " ").toLowerCase();
const formatDateTime = (value) => {
    if (!value) return null;
    const date = new Date(value);
    if (isNaN(date.getTime())) return null;
    const dateString = date.toLocaleDateString("pt-PT");
    if (date.getUTCHours() === 0 && date.getUTCMinutes() === 0 && date.getUTCSeconds() === 0) {
        return dateString;
    }
    const timeString = date.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: true });
    return `${dateString} ${timeString}`;
};

    const hasSpecificModes = Array.isArray(payment_mode_id) && !payment_mode_id.includes('All') && payment_mode_id.length > 0;
    const normalizeId = (val) => val ? String(val?._id || val) : '';
    // Check if a partial payment entry matches the currently selected modes
    const isPartialMatchingMode = (p) => {
        if (!hasSpecificModes) return true;
        const partialModeId = normalizeId(p.payment_mode_id);
        return payment_mode_id.some(mId => normalizeId(mId) === partialModeId);
    };

    const getRangeBounds = () => ({
        start_date: new Date(`${start_date_incomePageFilter}T00:00:00.000+05:00`),
        end_date: new Date(`${end_date_incomePageFilter}T23:59:59.999+05:00`),
    });

    const isDateInRange = (value, start_date, end_date) => {
        if (!value) return false;
        const date = value instanceof Date ? value : new Date(value);
        if (isNaN(date.getTime())) return false;
        return date >= start_date && date <= end_date;
    };

    const getPaymentSegments = (row) => {
        const segments = [];
        const history = row?.partial_payment_history || [];

        history.forEach((payment) => {
            const amount = Number(payment?.amount) || 0;
            if (amount <= 0) return;
            segments.push({
                amount,
                receivedBy: String(payment?.payment_recieved_by || payment?.paymentRecievedBy || "").trim(),
                date: payment?.date ? new Date(payment.date) : null,
                payment_mode_id: payment?.payment_mode_id,
                payment_mode_source_id: payment?.payment_mode_source_id,
                type: "partial",
            });
        });

        const partialSum = history.reduce((sum, p) => sum + (Number(p?.amount) || 0), 0);
        const quickPayAmount = (Number(row?.paid_amount) || 0) - partialSum;
        if (quickPayAmount > 0) {
            segments.push({
                amount: quickPayAmount,
                receivedBy: String(row?.payment_recieved_by || row?.paymentRecievedBy || "").trim(),
                date: row?.paying_date ? new Date(row.paying_date) : null,
                payment_mode_id: row?.payment_mode_id,
                payment_mode_source_id: row?.payment_mode_source_id,
                type: "quick",
            });
        }

        return segments;
    };

    const getUserSegmentsInRange = (row) => {
        const { start_date, end_date } = getRangeBounds();
        return getPaymentSegments(row).filter(
            (segment) => isDateInRange(segment.date, start_date, end_date) && isPartialMatchingMode(segment)
        );
    };

    const getDiscountBy = (entry) => String(
        entry?.discount_by
        || entry?.further_discount_discount_by
        || entry?.late_fee_fine_discount_discount_by
        || entry?.by
        || ""
    ).trim();

    const isSelectedReceiver = (receivedBy) => {
        if (!selectedUsers?.length || selectedUsers.includes("All")) return true;
        const raw = String(receivedBy || "").trim();
        if (!raw) return selectedUsers.includes("Unknown");
        const norm = normalizeName(raw);
        return selectedUsers.some((u) => u !== "All" && u !== "Unknown" && normalizeName(u) === norm);
    };

    const selectedUsersLabel = (!selectedUsers?.length || selectedUsers.includes("All"))
        ? "All"
        : selectedUsers.join(", ");

/* ===== totals (same as the useEffect of the page) ===== */
var totalStudent = 0, totalAmount = 0, totalFeeDiscount = 0, totalFineDiscount = 0, totalUnpaidCount = allStudentData.length;
(function () {
    var start_date = new Date(start_date_incomePageFilter + 'T00:00:00.000+05:00');
    var end_date = new Date(end_date_incomePageFilter + 'T23:59:59.999+05:00');
    var students = [];
    allStudentData.forEach(function (item) {
        if (students.indexOf(item.general_registration_code) < 0) students.push(item.general_registration_code);
        getUserSegmentsInRange(item).forEach(function (segment) { if (isSelectedReceiver(segment.receivedBy)) totalAmount += segment.amount; });
        (item.further_discount_history || []).forEach(function (d) { if (new Date(d.date) >= start_date && new Date(d.date) <= end_date && isSelectedReceiver(getDiscountBy(d))) totalFeeDiscount += Number(d.amount || 0); });
        (item.late_fee_fine_discount_history || []).forEach(function (d) { if (new Date(d.date) >= start_date && new Date(d.date) <= end_date && isSelectedReceiver(getDiscountBy(d))) totalFineDiscount += Number(d.amount || 0); });
    });
    totalStudent = students.length;
})();

/* ===== User Wise Collection (same as the useMemo of the page) ===== */
var userCollectedRows = (function () {
    var buckets = new Map();
    (totalData || []).forEach(function (row) {
        getUserSegmentsInRange(row).forEach(function (segment) {
            var raw = String(segment.receivedBy || '').trim();
            var key = raw ? normalizeName(raw) : '__unknown__';
            if (!buckets.has(key)) buckets.set(key, { username: raw || 'Unknown', paid: 0 });
            buckets.get(key).paid += segment.amount;
        });
    });
    return [...buckets.values()].sort(function (a, b) { return b.paid - a.paid || String(a.username).localeCompare(String(b.username)); });
})();
var filteredUserCollectedRows = userCollectedRows;

/* family advance deposits of the period (dummy: in the app these come from the family advance API) */
var familyAdvanceTransactions = [
    { date: '2026-10-02T10:40:00+05:00', amount: 2000, mode: 'm1', source: 's1', by: 'ali' },
    { date: '2026-10-04T12:15:00+05:00', amount: 1500, mode: 'm2', source: 's2', by: 'usman' },
    { date: '2026-10-05T09:50:00+05:00', amount: 1500, mode: 'm3', source: 's3', by: 'ali' }
];
var advInRange = familyAdvanceTransactions.filter(function (t) {
    var b = getRangeBounds();
    return isDateInRange(t.date, b.start_date, b.end_date) && isSelectedReceiver(t.by);
});
var familyAdvanceReceived = advInRange.reduce(function (s, t) { return s + t.amount; }, 0);
var netReceiving = totalAmount + familyAdvanceReceived;   /* Fee Receiving + Advance Receiving */

/* zero shows nothing (no dash), same as the Date Wise Fee Transaction report */
var amountOrDash = function (value) { return Number(value || 0) !== 0 ? Number(value).toLocaleString() : ''; };

/* ===== Payment Channel Breakdown: Mode (merged) > Source, Fee Receiving + Advance Received + Net Receiving ===== */
var channelMap = {};
(function () {
    var modesToShow = hasSpecificModes ? paymentMethods.filter(function (mode) { return payment_mode_id.includes(String(mode._id)); }) : paymentMethods;
    modesToShow.forEach(function (mode) {
        var modeKey = String(mode._id);
        channelMap[modeKey] = { modeName: mode.mode_name, sources: {} };
        var sources = getSourceByMode(mode._id) || [];
        if (sources.length > 0) sources.forEach(function (src) { channelMap[modeKey].sources[String(src._id)] = { sourceName: src.source, fee: 0, adv: 0 }; });
        else channelMap[modeKey].sources['direct'] = { sourceName: 'Direct', fee: 0, adv: 0 };
    });
    var slot = function (modeId, sourceId) {
        var modeKey = String(modeId || 'unknown'), sourceKey = String(sourceId || 'direct');
        if (!channelMap[modeKey]) channelMap[modeKey] = { modeName: getModeName(modeId) || 'Unknown', sources: {} };
        if (!channelMap[modeKey].sources[sourceKey]) channelMap[modeKey].sources[sourceKey] = { sourceName: sourceId ? (getSourceName(sourceId) || 'Direct') : 'Direct', fee: 0, adv: 0 };
        return channelMap[modeKey].sources[sourceKey];
    };
    totalData.forEach(function (item) {
        getUserSegmentsInRange(item).forEach(function (segment) {
            if (!isSelectedReceiver(segment.receivedBy)) return;
            slot(segment.payment_mode_id, segment.payment_mode_source_id).fee += segment.amount;
        });
    });
    advInRange.forEach(function (t) { slot(t.mode, t.source).adv += t.amount; });
})();

var channelRowsHtml = '';
var gFee = 0, gAdv = 0;
Object.keys(channelMap).forEach(function (modeKey) {
    var m = channelMap[modeKey];
    var entries = Object.keys(m.sources).map(function (k) { return m.sources[k]; });
    var modeNet = entries.reduce(function (s, e) { return s + e.fee + e.adv; }, 0);
    entries.forEach(function (e, idx) {
        gFee += e.fee; gAdv += e.adv;
        channelRowsHtml += '<tr>'
            + (idx === 0 ? '<td class="table-cell mode-merge" rowspan="' + entries.length + '">' + m.modeName + '</td>' : '')
            + '<td class="table-cell">' + e.sourceName + '</td>'
            + '<td class="table-cell right">' + amountOrDash(e.adv) + '</td>'
            + '<td class="table-cell right">' + amountOrDash(e.fee) + '</td>'
            + '<td class="table-cell right strong">' + amountOrDash(e.fee + e.adv) + '</td>'
            + (idx === 0 ? '<td class="table-cell right mode-total" rowspan="' + entries.length + '">' + amountOrDash(modeNet) + '</td>' : '')
            + '</tr>';
    });
});
var channelGrandHtml = '<tr class="grand-total-row"><td class="grand-total-label" colspan="2">Grand Total:</td>'
    + '<td class="grand-total-cell right">' + amountOrDash(gAdv) + '</td>'
    + '<td class="grand-total-cell right">' + amountOrDash(gFee) + '</td>'
    + '<td class="grand-total-cell right">' + amountOrDash(gFee + gAdv) + '</td>'
    + '<td class="grand-total-cell right">' + amountOrDash(gFee + gAdv) + '</td></tr>';

/* ===== User Wise Breakdown: discounts + advance received + fee receiving + net receiving per user ===== */
var userWiseRows = (function () {
    var map = new Map();
    var bucket = function (raw) {
        raw = String(raw || '').trim();
        var key = raw ? normalizeName(raw) : '__unknown__';
        if (!map.has(key)) map.set(key, { username: raw || 'Unknown', further: 0, fine: 0, adv: 0, fee: 0 });
        return map.get(key);
    };
    var b = getRangeBounds();
    totalData.forEach(function (row) {
        getUserSegmentsInRange(row).forEach(function (s) { bucket(s.receivedBy).fee += s.amount; });
        (row.further_discount_history || []).forEach(function (d) { if (isDateInRange(d.date, b.start_date, b.end_date)) bucket(getDiscountBy(d)).further += Number(d.amount || 0); });
        (row.late_fee_fine_discount_history || []).forEach(function (d) { if (isDateInRange(d.date, b.start_date, b.end_date)) bucket(getDiscountBy(d)).fine += Number(d.amount || 0); });
    });
    advInRange.forEach(function (t) { bucket(t.by).adv += t.amount; });

/* PIN THE USER WISE BREAKDOWN TO THE BOTTOM OF THE LAST PRINTED PAGE (same method as the Family Advance Ledger report) */
function fitBottomBlock() {
    var spacer = document.getElementById("pageSpacer");
    var block = document.getElementById("bottomBlock");
    var table = document.getElementById("mainTable");
    var page = document.querySelector(".page");
    spacer.style.height = "0px";
    document.body.classList.add("measuring");
    var pageH = document.getElementById("pageMeasure").getBoundingClientRect().height;
    var pageTop = page.getBoundingClientRect().top;
    var theadH = table.querySelector("thead").getBoundingClientRect().height;
    var rows = table.querySelectorAll("tbody tr");
    var shift = 0;
    for (var i = 0; i < rows.length; i++) {
        var rect = rows[i].getBoundingClientRect();
        var top = rect.top - pageTop + shift;
        var bottom = rect.bottom - pageTop + shift;
        var pg = Math.floor(top / pageH);
        if (bottom > (pg + 1) * pageH) { shift += (pg + 1) * pageH + theadH - top; }
    }
    var contentEnd = spacer.getBoundingClientRect().top - pageTop + shift;
    var blockH = block.getBoundingClientRect().height;
    var pages = Math.max(1, Math.ceil((contentEnd + blockH) / pageH));
    var spare = pages * pageH - contentEnd - blockH - 20;   // 20px safety
    spacer.style.height = Math.max(0, spare) + "px";
    document.body.classList.remove("measuring");
}
function clearBottomBlock() { document.getElementById("pageSpacer").style.height = "0px"; }
window.addEventListener("beforeprint", fitBottomBlock);
window.addEventListener("afterprint", clearBottomBlock);
