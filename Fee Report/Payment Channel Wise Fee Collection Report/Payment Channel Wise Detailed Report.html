/* ---- numbers: a zero is a light grey dash; a number too wide for its narrow column gets a slightly smaller font ---- */
const dash = '<span class="zero-dash">-</span>';
const amountOrDash = (value) => (Number(value || 0) !== 0 ? Number(value).toLocaleString() : dash);
// width of a number in em (digits 0.64, comma / dot 0.32)
const fitAmount = (value, basePx, contentPx) => {
    const n = Number(value || 0);
    if (n === 0) return dash;
    const s = n.toLocaleString();
    let units = 0;
    for (let k = 0; k < s.length; k++) units += (s[k] === ',' || s[k] === '.') ? 0.32 : 0.64;
    const size = Math.min(basePx, Math.max(7, Math.floor(contentPx / units * 10) / 10));
    return size < basePx ? `<span style="font-size:${size}px">${s}</span>` : s;
};

/* ---- dates and times (12-hour time with AM / PM, dates like 01 Oct 2026) ---- */
const parseDate = (value) => {
    const d = value ? new Date(value) : null;
    return d && !isNaN(d.getTime()) ? d : null;
};
const hasTimeStored = (d) => !(d.getUTCHours() === 0 && d.getUTCMinutes() === 0 && d.getUTCSeconds() === 0);
const formatTime12 = (value) => {
    const d = parseDate(value);
    return d && hasTimeStored(d) ? d.toLocaleTimeString("en-US", { hour: 'numeric', minute: '2-digit', hour12: true }) : '';
};
const formatShortDate = (value) => {
    const d = parseDate(value);
    return d ? d.toLocaleDateString("en-GB", { day: '2-digit', month: 'short' }) : '';
};
const formatLedgerDate = (value) => {
    const d = parseDate(value);
    return d ? d.toLocaleDateString("en-GB", { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
};
// Paying Date: the date, then the time under it when the cell is narrow
const formatPayingDate = (value) => {
    const d = parseDate(value);
    if (!d) return dash;
    const time = formatTime12(value);
    return `<span class="dt"><span>${formatLedgerDate(value)}</span>${time ? `<span>${time}</span>` : ''}</span>`;
};

/* ---- history: small date, dot and line. Payments and discounts: the amount line first (500 = General / General, dis = 500), then time | user under it.
   old: payments had time | user on the first line and the amount line under it (amountFirst = false) ---- */
const renderHistoryItem = (date, sub, text, amountFirst = false) =>
    `<div class="hist-item"><span class="hist-date">${formatShortDate(date)}</span><span class="hist-dot"></span><span>${amountFirst ? `${text}${sub ? `<br/><small class="hist-sub">${sub}</small>` : ''}` : `${sub ? `<small class="hist-sub">${sub}</small><br/>` : ''}${text}`}</span></div>`;

// Further Fee Disc / Fine discounts: "dis = 200"
const renderDiscountHistory = (history) => history.map((entry) => {
    const by = String(entry.discount_by || entry.by || '').trim();
    const sub = [formatTime12(entry.date), by].filter(Boolean).join(' | ');
    return renderHistoryItem(entry.date, sub, `dis = ${entry.amount}`, true);
}).join('');

// Fine: a fine without a discount is just the amount. A fine with discounts shows the discounts, with the fine that is left in the top right corner. (The old -> new block was removed.)

    .fine-pair span { font-size: 7px; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid #999; padding: 1px 2px; background: #e6e6e6; }
    .fine-pair b { font-size: 9px; font-weight: 400; padding: 2px; white-space: nowrap; }

    /* ===== History (Mode / Source, Further Fee Disc, Fine): small date, dot, line; time | user first, then the amount line ===== */
    .hist-item { position: relative; display: flex; gap: 4px; align-items: flex-start; padding-bottom: 6px; }
    .hist-item:last-child { padding-bottom: 0; }
    .hist-date { flex: none; width: 32px; white-space: nowrap; font-size: 8px; font-weight: 700; line-height: 11px; text-align: right; }
    .hist-dot { flex: none; width: 5px; height: 5px; border-radius: 50%; background: #000; margin-top: 3px; position: relative; z-index: 1; }
    .hist-item:not(:last-child)::after { content: ""; position: absolute; left: 38px; top: 10px; bottom: -3px; width: 1px; background: #000; }   /* line joining the dots */
    .hist-sub { font-size: 8px; font-weight: 600; white-space: nowrap; }
    /* Fine cell: before -> after (old fine struck through at the left, arrow in the center, current fine at the right) */
    /* Fine cell with discounts: the fine that is left is only the amount, pinned to the top right corner of the cell (not part of the history lines) */
    td.fine-top { vertical-align: top; position: relative; }
    .fine-corner { position: absolute; top: 2px; right: 4px; font-size: 9px; font-weight: 700; line-height: 1; }

    /* ===== User Wise Breakdown: a small table, not stretched over the whole page ===== */
    .breakdown-title { margin-top: 14px; margin-bottom: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .breakdown-table { width: 70%; }
    .breakdown-block { break-inside: avoid; page-break-inside: avoid; }   /* the title never stays alone at the bottom of a page */
    .breakdown-title { break-after: avoid; page-break-after: avoid; }

    .print-footer { margin-top: 11px; padding-top: 7px; font-size: 9px; color: #000; text-align: center; font-weight: 600; }

`;

// Shared Date Wise Fee Transaction Report (Detailed).
// Fee Income Report and Payment Channel Wise Fee Report both print this.

const modeSourceText = (modeId, sourceId, getModeName, getSourceName) => {
    const mode = modeId ? getModeName(modeId) : '-';
    const source = sourceId ? getSourceName(sourceId) : '';
    return `${mode}${source ? ` / ${source}` : ''}`;
};

const userWiseTableHtml = (userRows) => {
    const receivingOf = (row) => Number(row.paid || 0) - Number(row.advanceSpent || 0);
    const netOf = (row) => receivingOf(row) + Number(row.advanceReceived || 0);
    const totals = (userRows || []).reduce((a, r) => ({
        furtherDiscount: a.furtherDiscount + Number(r.furtherDiscount || 0),
        fineDiscount: a.fineDiscount + Number(r.fineDiscount || 0),
        advanceReceived: a.advanceReceived + Number(r.advanceReceived || 0),
        paid: a.paid + receivingOf(r),
        advanceSpent: a.advanceSpent + Number(r.advanceSpent || 0),
        net: a.net + netOf(r),
    }), { furtherDiscount: 0, fineDiscount: 0, advanceReceived: 0, paid: 0, advanceSpent: 0, net: 0 });
    const rows = userRows || [];
    return `
        <div class="breakdown-block">

                    <td class="align-right">${amountOrDash(row.advanceSpent)}</td>
                    <td class="align-right"><b>${amountOrDash(netOf(row))}</b></td>
                </tr>`).join('') : `<tr><td colspan="7" class="align-center">No Records Found!</td></tr>`}

function buildDetailedFeeTransactionReportHtml({

    getFamilyBalance,

            if (emptyModeAsDash) return dash;
            const who = String(row?.payment_recieved_by || row?.paymentRecievedBy || '').trim();
            return `${modeSourceText(row?.payment_mode_id, row?.payment_mode_source_id, getModeName, getSourceName)} ${who ? `(${who})` : ''}`.trim();
        }
        if (segments.length === 1 && segments[0].type === 'quick') {
            const seg = segments[0];
            return `${modeSourceText(seg.modeId, seg.sourceId, getModeName, getSourceName)} ${seg.receivedBy ? `(${seg.receivedBy})` : ''}`.trim();
        }
        return segments.map((seg) => {
            const sub = [formatTime12(seg.date), seg.receivedBy].filter(Boolean).join(' | ');

    /* ================= SAME CODE AS Payment Channel Wise Fee Report.jsx (page functions, copied as they are) ================= */
    const normalizeName = (value) => String(value ?? "").trim().replace(/\s+/g, " ").toLowerCase();
    const hasSpecificModes = Array.isArray(payment_mode_id) && !payment_mode_id.includes('All') && payment_mode_id.length > 0;
    const normalizeId = (val) => val ? String(val?._id || val) : '';
    const isPartialMatchingMode = (p) => {
        if (!hasSpecificModes) return true;
        const partialModeId = normalizeId(p.payment_mode_id);
        return payment_mode_id.some(mId => normalizeId(mId) === partialModeId);
    };
    const getRangeBounds = () => ({
        start_date: new Date(`${start_date_incomePageFilter}T00:00:00.000+05:00`),
        end_date: new Date(`${end_date_incomePageFilter}T23:59:59.999+05:00`),
    });
    const isDateInRange = (value, start_date, end_date) => {
        if (!value) return false;
        const date = value instanceof Date ? value : new Date(value);
        if (isNaN(date.getTime())) return false;
        return date >= start_date && date <= end_date;
    };
    const getPaymentSegments = (row) => {
        const segments = [];
        const history = row?.partial_payment_history || [];
        history.forEach((payment) => {
            const amount = Number(payment?.amount) || 0;
            if (amount <= 0) return;
            segments.push({
                amount,
                receivedBy: String(payment?.payment_recieved_by || payment?.paymentRecievedBy || "").trim(),
                date: payment?.date ? new Date(payment.date) : null,
                payment_mode_id: payment?.payment_mode_id,
                payment_mode_source_id: payment?.payment_mode_source_id,
                type: "partial",
            });
        });
        const partialSum = history.reduce((sum, p) => sum + (Number(p?.amount) || 0), 0);
        const quickPayAmount = (Number(row?.paid_amount) || 0) - partialSum;
        if (quickPayAmount > 0) {
            segments.push({
                amount: quickPayAmount,
                receivedBy: String(row?.payment_recieved_by || row?.paymentRecievedBy || "").trim(),
                date: row?.paying_date ? new Date(row.paying_date) : null,
                payment_mode_id: row?.payment_mode_id,
                payment_mode_source_id: row?.payment_mode_source_id,
                type: "quick",
            });
        }
        return segments;
    };
    const getUserSegmentsInRange = (row) => {
        const { start_date, end_date } = getRangeBounds();
        return getPaymentSegments(row).filter(
            (segment) => isDateInRange(segment.date, start_date, end_date) && isPartialMatchingMode(segment)
        );
    };
    const getDiscountBy = (entry) => String(
        entry?.discount_by
        || entry?.further_discount_discount_by
        || entry?.late_fee_fine_discount_discount_by
        || entry?.by
        || ""
    ).trim();
    const isSelectedReceiver = (receivedBy) => {
        if (!selectedUsers?.length || selectedUsers.includes("All")) return true;
        const raw = String(receivedBy || "").trim();
        if (!raw) return selectedUsers.includes("Unknown");
        const norm = normalizeName(raw);
        return selectedUsers.some((u) => u !== "All" && u !== "Unknown" && normalizeName(u) === norm);
    };
    const selectedUsersLabel = (!selectedUsers?.length || selectedUsers.includes("All")) ? "All" : selectedUsers.join(", ");

    const getAdvanceDate = (t) => t?.date || t?.createdAt || t?.created_at || t?.transaction_date || null;
    const getAdvanceAmount = (t) => Number(t?.amount) || 0;
    const getAdvanceBy = (t) => String(t?.received_by || t?.recieved_by || t?.payment_recieved_by || t?.createdBy || t?.by || "").trim();
    const hasSpecificSources = Array.isArray(payment_mode_source_id) && payment_mode_source_id.length > 0 && !payment_mode_source_id.includes('All');
    const advanceMatchesChannel = (t) => {
        if (hasSpecificModes && !payment_mode_id.some((id) => normalizeId(id) === normalizeId(t?.payment_mode_id))) return false;
        if (hasSpecificSources && !payment_mode_source_id.some((id) => normalizeId(id) === normalizeId(t?.payment_mode_source_id))) return false;
        return true;
    };
    const isFamilyCreditPayment = (modeId) => {
        const mode = modeId ? String(modeId?._id || modeId) : '';
        if (!mode) return false;
        return (paymentMethods || []).some((item) => item?.type === 'family_credit' && String(item._id) === mode);
    };
    const channelAdvances = () => {
        const { start_date, end_date } = getRangeBounds();
        return (feeDefaulterDataFilter?.familyAdvanceTransactions || []).filter((t) =>
            isDateInRange(getAdvanceDate(t), start_date, end_date) && advanceMatchesChannel(t)
        );
    };
    const getFamilyAdvance = (familyCode) => channelAdvances()
        .filter((t) => familyCode && String(t?.family_code || '') === String(familyCode) && isSelectedReceiver(getAdvanceBy(t)))
        .map((t) => ({ amount: getAdvanceAmount(t), date: getAdvanceDate(t), by: getAdvanceBy(t), modeId: t?.payment_mode_id, sourceId: t?.payment_mode_source_id }));
    const getFamilyBalance = (familyCode) => {
        const code = String(familyCode || '').trim().toUpperCase();
        const row = (feeDefaulterDataFilter?.familyCreditReportRows || []).find((r) => String(r?.family_code || '').trim().toUpperCase() === code);
        return Number(row?.available_family_credit_amount) || 0;
    };
    const getFamilyFatherName = (familyCode) => {
        const code = String(familyCode || '').trim().toUpperCase();
        const row = (feeDefaulterDataFilter?.familyCreditReportRows || []).find((r) => String(r?.family_code || '').trim().toUpperCase() === code);
        return String(row?.family_name || '').trim();
    };
    const getDepositFamilyCodes = () => [...new Set(channelAdvances()
        .filter((t) => t?.family_code && isSelectedReceiver(getAdvanceBy(t)))
        .map((t) => String(t.family_code)))];
    const getDiscountsInRange = (row) => {
        const { start_date, end_date } = getRangeBounds();
        const collect = (list) => (list || [])
            .filter((entry) => isDateInRange(entry?.date, start_date, end_date))
            .map((entry) => ({ amount: Number(entry?.amount) || 0, by: getDiscountBy(entry) }));
        return { further: collect(row?.further_discount_history), fine: collect(row?.late_fee_fine_discount_history) };
    };
    const getPaidInRange = (row) =>
        getUserSegmentsInRange(row).reduce(
            (sum, segment) => (isSelectedReceiver(segment.receivedBy) ? sum + segment.amount : sum),
            0
        );
    const getPrintSegments = (row) => getPaymentSegments(row)
        .filter((segment) => {
            const matchesMode = !hasSpecificModes || isPartialMatchingMode({ payment_mode_id: segment.payment_mode_id });
            return matchesMode && isSelectedReceiver(segment.receivedBy);
        })
        .map((segment) => ({
            amount: segment.amount,
            receivedBy: segment.receivedBy,
            date: segment.date,
            modeId: segment.payment_mode_id,
            sourceId: segment.payment_mode_source_id,
            type: segment.type,
        }));

    /* ----- the useEffect that processes the data (type "All", every user) ----- */
    allStudentData = totalData.slice().sort(sortByFamilyCode);
    totalData = allStudentData;
    var totalStudent = 0, totalAmount = 0, totalFeeDiscount = 0, totalFineDiscount = 0, totalUnpaidCount = allStudentData.length;
    (function () {
        const studentsArray = [];
        allStudentData.forEach((item) => {
            if (!studentsArray.includes(item.general_registration_code)) studentsArray.push(item.general_registration_code);
            getUserSegmentsInRange(item).forEach((segment) => {
                if (!isSelectedReceiver(segment.receivedBy)) return;
                totalAmount += segment.amount;
            });
            const { further, fine } = getDiscountsInRange(item);
            further.forEach((d) => { if (isSelectedReceiver(d.by)) totalFeeDiscount += d.amount; });
            fine.forEach((d) => { if (isSelectedReceiver(d.by)) totalFineDiscount += d.amount; });
        });
        totalStudent = studentsArray.length;
    })();

    const buildDetailedUserRows = () => {
        const buckets = new Map();
        const ensure = (key, label) => {
            if (!buckets.has(key)) {
                buckets.set(key, { key, label, furtherDiscount: 0, fineDiscount: 0, paid: 0, advanceReceived: 0, advanceSpent: 0 });
            }
            return buckets.get(key);
        };
        const bucketFor = (receivedBy) => {
            const raw = String(receivedBy || "").trim();
            if (!raw) return ensure("__unknown__", "Unknown");
            return ensure(normalizeName(raw), raw);
        };
        (totalData || []).forEach((row) => {
            getUserSegmentsInRange(row).forEach((segment) => {
                const bucket = bucketFor(segment.receivedBy);
                bucket.paid += segment.amount;
                if (isFamilyCreditPayment(segment.payment_mode_id)) bucket.advanceSpent += segment.amount;
            });
            const { further, fine } = getDiscountsInRange(row);
            further.forEach((entry) => { bucketFor(entry.by).furtherDiscount += entry.amount; });
            fine.forEach((entry) => { bucketFor(entry.by).fineDiscount += entry.amount; });
        });
        channelAdvances().forEach((t) => {
            bucketFor(getAdvanceBy(t)).advanceReceived += getAdvanceAmount(t);
        });
        const rows = [...buckets.values()]
            .map((bucket) => ({
                username: bucket.label,
                furtherDiscount: bucket.furtherDiscount,
                fineDiscount: bucket.fineDiscount,
                paid: bucket.paid,
                advanceReceived: bucket.advanceReceived,
                advanceSpent: bucket.advanceSpent,
            }))
            .sort((a, b) => b.paid - a.paid || String(a.username).localeCompare(String(b.username)));
        if (!selectedUsers?.length || selectedUsers.includes("All")) return rows;
        return rows.filter((row) => {
            if (row.username === "Unknown") return selectedUsers.includes("Unknown");
            const norm = normalizeName(row.username);
            return selectedUsers.some((u) => u !== "All" && u !== "Unknown" && normalizeName(u) === norm);
        });
    };

    /* (util below) ================= SAME CODE AS handlePrintReport of Payment Channel Wise Fee Report.jsx ================= */
    const buildReportHtml = () => {
        const formatPaymentLabel = (value, getFn) => {
            if (Array.isArray(value)) {
                if (value.includes('All') || value.length === 0) return 'All';
                return value.map((id) => getFn(id)).filter(Boolean).join(', ');
            }
            return value === 'All' ? 'All' : (getFn(value) || 'All');
        };
        const modeName = formatPaymentLabel(payment_mode_id, getModeName);
        const sourceName = formatPaymentLabel(payment_mode_source_id, getSourceName);
        const sessionName = session_id === 'All' ? 'All' : (activeSessions?.find((s) => s._id === session_id)?.session_name || session_id);

        let familyCreditUsed = 0;
        (allStudentData || []).forEach((row) => {
            getUserSegmentsInRange(row).forEach((segment) => {
                if (!isSelectedReceiver(segment.receivedBy)) return;
                if (isFamilyCreditPayment(segment.payment_mode_id)) familyCreditUsed += segment.amount;
            });
        });
        const listedAdvance = channelAdvances().reduce((sum, t) => sum + getAdvanceAmount(t), 0);
        const familyAdvanceReceived = (!hasSpecificModes && !hasSpecificSources)
            ? (Number(feeDefaulterDataFilter?.familyAdvanceTotal) || listedAdvance)
            : listedAdvance;
        const feeReceiving = totalAmount - familyCreditUsed;
        const netReceiving = feeReceiving + familyAdvanceReceived;

        return buildDetailedFeeTransactionReportHtml({
            systemSetting,
            sessionName,
            campusName: campus_name || 'All',
            className: class_name || 'All',
            sectionName: section_name || 'All',
            typeName: type_name || 'All',
            feeMonth: fee_month,
            feeYear: fee_year,
            customFeeName: custom_fee_name,
            startDate: start_date_incomePageFilter,
            endDate: end_date_incomePageFilter,
            receivedByLabel: selectedUsersLabel,
            extraFilters: [
                ['Payment Mode', modeName],
                ...(sourceName !== 'All' ? [['Source', sourceName]] : []),
            ],
            rows: allStudentData,
            getPaidInRange,
            getPrintSegments,
            getModeName,
            getSourceName,
            emptyModeAsDash: true,
            getFamilyAdvance,
            getFamilyBalance,
            getFamilyFatherName,
            getDepositFamilyCodes,
            userRows: buildDetailedUserRows(),
            totalStudent,
            totalUnpaidCount,
            familyAdvanceReceived,
            totalFeeDiscount,
            totalFineDiscount,
            feeReceiving,
            familyCreditUsed,
            netReceiving,
        });
    };


    /* ================= RENDER: the report is written as the whole page ================= */
    window.addEventListener("load", function () {
        var html = buildReportHtml();
        document.open();
        document.write(html);
        document.close();
        // preview only
        var st = document.createElement("style");
        st.textContent = ".print-btn { position: fixed; top: 12px; right: 16px; z-index: 10; background: #000; color: #fff; border: 1px solid #000; padding: 7px 16px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: Poppins, sans-serif; } @media print { .print-btn { display: none !important; } }";
        document.head.appendChild(st);
        var b = document.createElement("button");
        b.className = "print-btn"; b.textContent = "Print"; b.onclick = function () { window.print(); };
        document.body.appendChild(b);
    });
</script>
</body>
</html>
