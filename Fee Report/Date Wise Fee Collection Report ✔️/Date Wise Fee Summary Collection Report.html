        const [startY, startM, startD] = start_date_incomePageFilter.split("-").map(Number);
        const [endY, endM, endD] = end_date_incomePageFilter.split("-").map(Number);
        const cursor = new Date(startY, startM - 1, startD);
        const rangeEnd = new Date(endY, endM - 1, endD);
        const allDateKeys = [];

        while (cursor <= rangeEnd) {
            allDateKeys.push(cursor.toLocaleDateString("en-CA"));
            cursor.setDate(cursor.getDate() + 1);
        }

        return allDateKeys.map((dateKey) => {
            const day = dateMap[dateKey];
            if (!day) {
                return {
                    date: dateKey,
                    invoiceCount: 0,
                    furtherDiscount: 0,
                    fineDiscount: 0,
                    total: 0,
                    paid: 0,
                    due: 0,
                };
            }
            const due = Math.max(0, day.total - day.paid);
            return {
                date: dateKey,
                invoiceCount: day.invoiceIds.size,
                furtherDiscount: day.furtherDiscount,
                fineDiscount: day.fineDiscount,
                total: day.total,
                paid: day.paid,
                due,
            };
        });
    };

    const getUserWisePrintTableHtml = () => {
        // a person with no name on the payment ("Unknown") is not listed in this print
        const rows = (filteredUserCollectedRows || []).filter((row) => row.username !== "Unknown");
        // Fee Receiving of a person = what he received - the part paid from the family advance. Net Receiving = Fee Receiving + advance received.
        const receivingOf = (row) => Number(row.paid || 0) - Number(row.advanceSpent || 0);
        const netOf = (row) => receivingOf(row) + Number(row.advanceReceived || 0);
        const grandTotals = rows.reduce(
            (acc, row) => ({
                furtherDiscount: acc.furtherDiscount + Number(row.furtherDiscount || 0),
                fineDiscount: acc.fineDiscount + Number(row.fineDiscount || 0),
                advanceReceived: acc.advanceReceived + Number(row.advanceReceived || 0),
                paid: acc.paid + receivingOf(row),
                net: acc.net + netOf(row),
            }),
            { furtherDiscount: 0, fineDiscount: 0, advanceReceived: 0, paid: 0, net: 0 }
        );

        const tableRowsHtml =
            rows.length > 0
                ? rows
                    .map(
                        (row) => `
                    <tr>
                        <td class="table-cell date-cell" style="text-align:left;">${row.username || '-'}</td>
                        <td class="table-cell right">${amountBlank(row.furtherDiscount)}</td>
                        <td class="table-cell right">${amountBlank(row.fineDiscount)}</td>
                        <td class="table-cell right">${amountBlank(row.advanceReceived)}</td>
                        <td class="table-cell right">${amountBlank(receivingOf(row))}</td>
                        <td class="table-cell right strong">${amountBlank(netOf(row))}</td>
                    </tr>`
                    )
                    .join("")
                : `<tr><td colspan="6" class="no-records">No Records Found!</td></tr>`;

        return `
            <div class="section-title" style="margin-top: 14px;">User Wise Breakdown</div>
            <table>
                <thead>
                    <tr class="table-head-row">
                        <th class="table-head-cell">User</th>
                        <th class="table-head-cell right">Further Fee Discount</th>
                        <th class="table-head-cell right">Fine Discount</th>
                        <th class="table-head-cell right">Advance Received</th>
                        <th class="table-head-cell right">Fee Receiving</th>
                        <th class="table-head-cell right">Net Receiving</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRowsHtml}
                    ${rows.length > 0 ? `
                    <tr class="grand-total-row">
                        <td class="grand-total-label">Grand Total:</td>
                        <td class="grand-total-cell right">${amountBlank(grandTotals.furtherDiscount)}</td>
                        <td class="grand-total-cell right">${amountBlank(grandTotals.fineDiscount)}</td>
                        <td class="grand-total-cell right">${amountBlank(grandTotals.advanceReceived)}</td>
                        <td class="grand-total-cell right">${amountBlank(grandTotals.paid)}</td>
                        <td class="grand-total-cell right">${amountBlank(grandTotals.net)}</td>
                    </tr>` : ""}
                </tbody>
            </table>
        `;
    };

    const buildReportHtml = () => {
        const summaryRows = buildDateWiseSummaryRows();

        // ── Family advance per day ─────────────────────────────────────────────
        // received = advance deposits (family advance transactions), spent = fee paid out of the family advance
        const dayKey = (value) => {
            const d = value instanceof Date ? value : new Date(value);
            return isNaN(d.getTime()) ? null : d.toLocaleDateString("en-CA");
        };
        const advanceReceivedByDate = {};
        (feeDefaulterDataFilter?.familyAdvanceTransactions || []).forEach((t) => {
            const key = dayKey(getAdvanceDate(t));
            if (!key || !isSelectedReceiver(getAdvanceBy(t))) return;
            advanceReceivedByDate[key] = (advanceReceivedByDate[key] || 0) + getAdvanceAmount(t);
        });
        const advanceSpentByDate = {};
        (totalData || []).forEach((item) => {
            getSegmentsInRange(item).forEach((segment) => {
                if (!segment.date || !isSelectedReceiver(segment.receivedBy) || !isFamilyCreditPayment(segment.modeId)) return;
                const key = dayKey(segment.date);
                advanceSpentByDate[key] = (advanceSpentByDate[key] || 0) + segment.amount;
            });
        });
        summaryRows.forEach((row) => {
            row.advanceReceived = advanceReceivedByDate[row.date] || 0;
            row.advanceSpent = advanceSpentByDate[row.date] || 0;
            // Fee Receiving = paid in the day - paid from the family advance; Net Receiving = Fee Receiving + advance received (same as the page's netReceiving)
            row.receiving = row.paid - row.advanceSpent;
            row.net = row.receiving + row.advanceReceived;
        });
        const grandTotals = summaryRows.reduce(
            (acc, row) => ({
                furtherDiscount: acc.furtherDiscount + row.furtherDiscount,
                fineDiscount: acc.fineDiscount + row.fineDiscount,
                advanceReceived: acc.advanceReceived + row.advanceReceived,
                advanceSpent: acc.advanceSpent + row.advanceSpent,
                paid: acc.paid + row.paid,
                receiving: acc.receiving + row.receiving,
                net: acc.net + row.net,
            }),
            { furtherDiscount: 0, fineDiscount: 0, advanceReceived: 0, advanceSpent: 0, paid: 0, receiving: 0, net: 0 }
        );

        // Family Advance cell: Received at the left, Spent at the right, nothing for a zero
        const advanceCellHtml = (received, spent) =>
            `<div class="adv-row"><span>${amountBlank(received)}</span><span>${amountBlank(spent)}</span></div>`;

        const tableRowsHtml =
            summaryRows.length > 0
                ? summaryRows
                    .map(
                        (row) => `
                    <tr>
                        <td class="table-cell date-cell"><div class="date-day"><span>${new Date(row.date).toLocaleDateString("pt-PT")}</span><span class="day-name">${new Date(`${row.date}T00:00:00`).toLocaleDateString("en-US", { weekday: "short" })}</span></div></td>
                        <td class="table-cell right">${amountBlank(row.furtherDiscount)}</td>
                        <td class="table-cell right">${amountBlank(row.fineDiscount)}</td>
                        <td class="table-cell">${advanceCellHtml(row.advanceReceived, row.advanceSpent)}</td>
                        <td class="table-cell right">${amountBlank(row.receiving)}</td>
                        <td class="table-cell right strong">${amountBlank(row.net)}</td>
                    </tr>`
                    )
                    .join("")
                : `<tr><td colspan="6" class="no-records">No Records Found!</td></tr>`;

        const sessionName =
            session_id === "All"
                ? "All"
                : getSessionName(session_id);

        // header filters: two short lines, same as the Detailed report
        const rangeDate = (value) => new Date(value).toLocaleDateString("pt-PT");
        const filtersRow1 = [['Session', sessionName], ['Campus', campus_name || "All"], ['Class', class_name || "All"], ['Section', section_name || "All"], ['Fee Type', type_name || "All"]];
        if (type_name === "Monthly Fee" || type_name === "Transport Fee") filtersRow1.push(['Month / Year', `${fee_month || '-'} / ${fee_year}`]);
        if (type_name === "Custom Fee") filtersRow1.push(['Fee Name', custom_fee_name || '-']);
        const filtersRow2 = [['Date Range', `${rangeDate(start_date_incomePageFilter)} to ${rangeDate(end_date_incomePageFilter)}`], ['Received By', selectedUsersLabel]];
        const filtersHtml = (list) => `<div class="filters-row">${list.map(([label, value]) => `<span>${label}: <b>${value}</b></span>`).join('<span class="sep">&middot;</span>')}</div>`;

        const reportContent = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>Date Wise Fee Transaction Report - Summary</title>
                <style>
                @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
                * { margin:0; padding:0; box-sizing:border-box; font-family:"Poppins",Arial,sans-serif !important; }
                @page { size: A4 portrait; margin: 7mm; }
                html, body { background:#fff; color:#000; font-size:9px; line-height:1.2; padding:5px; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
                /* Header: logo | school name, title and filters | stat box, one black line under it (same as the Detailed report) */
                .header-section { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid #000; padding:0 0 8px; }
                .header-section h1 { font-size:17px; font-weight:700; margin-bottom:2px; color:#000; }
                .header-section h2 { font-size:12px; font-weight:700; margin-bottom:4px; color:#000; }
                /*.header-side { flex:0 0 190px; }*/
                .header-logo { width:56px; height:56px; object-fit:contain; border-radius:5px; }
                .filters { font-size:9px; font-weight:600; line-height:1.5; color:#444; }
                .filters-row { display:flex; justify-content:center; flex-wrap:wrap; gap:0 6px; }
                .filters b { font-weight:700; color:#000; }
                .filters .sep { color:#999; }
                /* Stats: one horizontal strip under the header, Net Receiving in a grey box */
                .stats-strip { display:grid; grid-template-columns:repeat(5,1fr); border:1.5px solid #000; margin-bottom:8px; }
                .stat { padding:5px 6px; text-align:center; border-right:1px solid #000; }
                .stat:last-child { border-right:none; }
                .stat.net { background:#d9d9d9 !important; }
                .stat-label { font-size:7.6px; font-weight:600; text-transform:uppercase; letter-spacing:.2px; color:#000; }
                .stat-value { font-size:14px; font-weight:800; margin-top:1px; color:#000; }
                .section-title { font-size:12px; font-weight:700; color:#000; text-transform:uppercase; margin-bottom:4px; }
                /* Tables: black outer lines, grey header, no stripes */
                table { width:100%; border-collapse:collapse; font-size:10.5px; font-variant-numeric:tabular-nums; }
                thead { display:table-header-group; }
                tr { page-break-inside:avoid; }
                thead tr.table-head-row { background:#c4c4c4; }
                .table-head-cell { padding:3px 5px; text-align:center; color:#000; background-color:#c4c4c4 !important; font-weight:700; font-size:9.5px; text-transform:uppercase; border:1px solid #000; }
                .table-head-cell.right { text-align:right; font-size:9.5px; }
                .table-cell { padding:3px 6px; font-size:10.5px; border:1px solid #999; font-weight:500; color:#000; }
                .table-cell.right { text-align:right; }
                .table-cell.center { text-align:center; }
                .table-cell.strong { font-weight:700; }
                .date-cell { text-align:center; font-weight:600; white-space:nowrap; }
                .date-day { display:flex; justify-content:space-between; gap:12px; }
                .day-name { color:#555; font-weight:500; }
                .zero-dash { color:#888; font-weight:400; }
                .no-records { text-align:center; padding:17px; font-size:9px; border:1px solid #999; }
                .grand-total-row { background:#f0f0f0; }
                .grand-total-label { padding:3px 6px; text-align:right; color:#000; background-color:#f0f0f0 !important; font-weight:700; font-size:10.5px; text-transform:uppercase; border:1px solid #999; border-top:2px solid #999; }
                .grand-total-cell { padding:3px 6px; font-weight:700; font-size:10.5px; color:#000; background-color:#f0f0f0 !important; text-align:center; border:1px solid #999; border-top:2px solid #999; }
                .grand-total-cell.right { text-align:right; }
                /* Family Advance column: one plain column, Received / Spent in the same cell */
                .adv-row { display:flex; justify-content:space-between; gap:14px; }
                .print-footer { margin-top:11px; padding-top:7px; font-size:9px; color:#000; text-align:center; font-weight:700; }
                /* preview only */
                .print-btn { position:fixed; top:12px; right:16px; background:#000; color:#fff; border:1px solid #000; padding:7px 16px; font-size:11px; font-weight:600; cursor:pointer; }
                @media print { .print-btn { display:none !important; } }
                /* User Wise Breakdown + footer always at the end of the LAST page: a spacer (set by the script below) fills the gap above it */
                .bottom { break-inside:avoid; page-break-inside:avoid; margin-top:10px; }
                #pageSpacer { height:0; }
                .page-measure { position:absolute; visibility:hidden; left:0; top:0; width:1px; height:281mm; }
                /* same layout the printer uses, applied only while measuring */
                body.measuring { padding:0 !important; }
                body.measuring .page { width:196mm !important; margin:0 !important; }
                @media print { html, body { padding:0 !important; } }
                </style>
            </head>
            <body>
                <div class="page-measure" id="pageMeasure"></div>
                <div class="page">
                    <div class="header-section">
                        <div class="header-side">
                            ${systemSetting?.school_logo ? `<img src="${systemSetting.school_logo}" class="header-logo" alt="Logo" />` : ''}
                        </div>
                        <div style="text-align: center; flex: 1;">
                            <h1>${systemSetting?.school_name || ''}</h1>
                            <h2>Date Wise Fee Transaction Report</h2>
                            <div class="filters">
                                ${filtersHtml(filtersRow1)}
                                ${filtersHtml(filtersRow2)}
                            </div>
                        </div>
                        <div class="header-side" style="opacity: 0;">
                            ${systemSetting?.school_logo ? `<img src="${systemSetting.school_logo}" class="header-logo" alt="Logo" />` : ''}
                        </div>
                    </div>

                    <div class="stats-strip">
                        <div class="stat"><div class="stat-label">Students</div><div class="stat-value">${totalStudent}</div></div>
                        <div class="stat"><div class="stat-label">Number Of Invoices</div><div class="stat-value">${totalUnpaidCount.toLocaleString()}</div></div>
                        <div class="stat"><div class="stat-label">Advance Receiving</div><div class="stat-value">Rs. ${familyAdvanceReceived.toLocaleString()}</div></div>
                        <div class="stat"><div class="stat-label">Fee Receiving</div><div class="stat-value">Rs. ${feeReceiving.toLocaleString()}</div></div>
                        <div class="stat net"><div class="stat-label">Net Receiving</div><div class="stat-value">Rs. ${netReceiving.toLocaleString()}</div></div>
                    </div>

                    <div class="section-title">Date Wise Breakdown</div>
                    <table id="dateTable">
                        <thead>
                            <tr class="table-head-row">
                                <th class="table-head-cell">Date</th>
                                <th class="table-head-cell right">Further Fee Discount</th>
                                <th class="table-head-cell right">Fine Discount</th>
                                <th class="table-head-cell">Family Advance<div class="adv-row"><span>Received</span><span>Spent</span></div></th>
                                <th class="table-head-cell right">Fee Receiving</th>
                                <th class="table-head-cell right">Net Receiving</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRowsHtml}
                            ${summaryRows.length > 0 ? `
                            <tr class="grand-total-row">
                                <td class="grand-total-label">Grand Total:</td>
                                <td class="grand-total-cell right">${amountBlank(grandTotals.furtherDiscount)}</td>
                                <td class="grand-total-cell right">${amountBlank(grandTotals.fineDiscount)}</td>
                                <td class="grand-total-cell">${advanceCellHtml(grandTotals.advanceReceived, grandTotals.advanceSpent)}</td>
                                <td class="grand-total-cell right">${amountBlank(grandTotals.receiving)}</td>
                                <td class="grand-total-cell right">${amountBlank(grandTotals.net)}</td>
                            </tr>` : ""}
                        </tbody>
                    </table>

                    <div id="pageSpacer"></div>
                    <div class="bottom" id="bottomBlock">
                        ${getUserWisePrintTableHtml()}
                        <div class="print-footer">
                            Generated on: ${new Date().toLocaleDateString("pt-PT")} | Powered by Ai Schooling System.com
                        </div>
                    </div>
                </div>

                <script>
                    // Pin the User Wise Breakdown + footer to the bottom of the LAST printed page (same method as the Family Advance Ledger report)
                    function fitBottomBlock() {
                        var spacer = document.getElementById("pageSpacer");
                        var block = document.getElementById("bottomBlock");
                        var table = document.getElementById("dateTable");
                        var page = document.querySelector(".page");
                        spacer.style.height = "0px";
                        document.body.classList.add("measuring");
                        var pageH = document.getElementById("pageMeasure").getBoundingClientRect().height;
                        var pageTop = page.getBoundingClientRect().top;
                        var theadH = table.querySelector("thead").getBoundingClientRect().height;
                        var rows = table.querySelectorAll("tbody tr");
                        // walk the rows like the printer does: a row that does not fit moves to the next page,
                        // and the table header is repeated at the top of that page
                        var shift = 0;
                        for (var i = 0; i < rows.length; i++) {
                            var rect = rows[i].getBoundingClientRect();
                            var top = rect.top - pageTop + shift;
                            var bottom = rect.bottom - pageTop + shift;
                            var pg = Math.floor(top / pageH);
                            if (bottom > (pg + 1) * pageH) { shift += (pg + 1) * pageH + theadH - top; }
                        }
                        var contentEnd = spacer.getBoundingClientRect().top - pageTop + shift;
                        var blockH = block.getBoundingClientRect().height;
                        var pages = Math.max(1, Math.ceil((contentEnd + blockH) / pageH));
                        var spare = pages * pageH - contentEnd - blockH - 20;   // 20px safety
                        spacer.style.height = Math.max(0, spare) + "px";
                        document.body.classList.remove("measuring");
                    }
                    function clearBottomBlock() { document.getElementById("pageSpacer").style.height = "0px"; }
                    window.addEventListener("beforeprint", fitBottomBlock);
                    window.addEventListener("afterprint", clearBottomBlock);
                <\/script>
            </body>
            </html>
        `;
        return reportContent;
    };

    /* ================= RENDER: the report is written as the whole page ================= */
    window.addEventListener("load", function () {
        var html = buildReportHtml();
        document.open();
        document.write(html);
        document.close();
        // preview only
        var st = document.createElement("style");
        st.textContent = ".print-btn { position: fixed; top: 12px; right: 16px; z-index: 10; background: #000; color: #fff; border: 1px solid #000; padding: 7px 16px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: Poppins, sans-serif; } @media print { .print-btn { display: none !important; } }";
        document.head.appendChild(st);
        var b = document.createElement("button");
        b.className = "print-btn"; b.textContent = "Print"; b.onclick = function () { window.print(); };
        document.body.appendChild(b);
    });
</script>
</body>
</html>
