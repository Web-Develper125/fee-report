<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Date Wise Fee Transaction Report (Detailed)</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif !important; }
    @page { size: A4 landscape; margin: 7mm; }
    html { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body { background: white; font-size: 9px; line-height: 1.2; padding: 5px; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    /* ===== Header: logo | school name, title and filters | stat box, one black line under it ===== */
    .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #000; padding: 0 0 8px; }
    .header-section h1 { font-size: 17px; font-weight: 700; margin-bottom: 2px; color: #000; }
    .header-section h2 { font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #000; }
    .header-side { flex: 0 0 190px; }
    .header-logo { width: 56px; height: 56px; object-fit: contain; border-radius: 5px; }
    /* filters: two short lines, label grey, value bold, small dots between */
    .filters { font-size: 9px; font-weight: 600; line-height: 1.5; color: #444; }
    .filters-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 0 6px; }
    .filters b { font-weight: 700; color: #000; }
    .filters .sep { color: #999; }

    /* ===== Stat box (same style as the Fee Payment Simple Ledger Report): label left, value right ===== */
    .summary-grid { display: flex; flex-direction: column; border: 1px solid #000; }
    .summary-card { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 8px; border-top: 1px dotted #999; }
    .summary-card:first-child { border-top: none; }
    .summary-card.dues { background-color: #e6e6e6 !important; border-top: 2px solid #000; }
    .summary-label { font-size: 8px; font-weight: 600; color: #000; text-transform: uppercase; }
    .summary-card.dues .summary-label { font-weight: 700; }
    .summary-value { font-size: 12px; font-weight: 400; color: #000; }
    .summary-card.dues .summary-value { font-size: 15px; font-weight: 700; }

    /* ===== Tables: plain bordered, grey header, no stripes (same as the Fee Payment reports) ===== */
    table { width: 100%; border-collapse: collapse; font-size: 9px; }
    th, td { border: 1px solid #999; padding: 4px; text-align: left; font-weight: 600; color: #000; vertical-align: middle; }
    th { font-size: 9px; background-color: #f0f0f0 !important; font-weight: 700; text-transform: uppercase; }
    td { font-size: 9px; }
    thead { display: table-header-group; }
    tr { page-break-inside: avoid; }
    tr.row td { border-top: 1px solid #d4d4d4; border-bottom: 1px solid #d4d4d4; padding-top: 3px; padding-bottom: 3px; }
    .align-right { text-align: right; }
    .align-left { text-align: left; }
    .align-center { text-align: center; }
    .nowrap { white-space: nowrap; }
    .zero-dash { color: #999; font-size: 9px; font-weight: 400; }
    .student-sub { font-size: 7px; color: #666; font-weight: 600; }

    /* heading with a small second part: (History) at the right of the heading, (in range) under it */
    .th-row { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
    .th-row > span:first-child { white-space: nowrap; }
    .th-sub { font-size: 7px; font-weight: 500; color: #3d3d3d; text-transform: none; }
    .th-below { display: block; font-size: 7px; font-weight: 500; color: #3d3d3d; text-transform: none; margin-top: 1px; }

    /* ===== Main table: column widths (see the colgroup), Student Name and Fee Title take the free space ===== */
    .ledger-table { table-layout: auto; }
    .ledger-table thead th:nth-child(-n+2), .ledger-table tr.row td:nth-child(-n+2) { padding-left: 3px; padding-right: 3px; }   /* Sr and Reg # stay narrow */
    .ledger-table .col-num { padding-left: 3px; padding-right: 3px; }   /* amount columns stay narrow */
    .ledger-table thead th:nth-child(3), .ledger-table tr.row td:nth-child(3) { min-width: 95px; }   /* Student Name (a minimum, not a fixed width) */
    .ledger-table thead th:nth-child(4), .ledger-table tr.row td:nth-child(4) { min-width: 75px; }   /* Fee Title (a minimum, not a fixed width) */
    th.col-total, th.col-paid, th.col-due { font-size: 10px; }
    td.col-total, td.col-paid, td.col-due { font-size: 11px; font-weight: 700; }
    .dt span { display: inline-block; white-space: nowrap; }   /* date and time stay whole, the time moves under the date when the cell is narrow */
    .dt span + span { margin-right: 8px; }

    /* Grand Total row */
    tr.grand-total td { background-color: #f0f0f0 !important; font-weight: 700; border-top: 2px solid #999; }
    tr.grand-total td:first-child { text-align: right; text-transform: uppercase; }
    tr.grand-total td.col-total, tr.grand-total td.col-paid, tr.grand-total td.col-due { font-size: 11px; }
    tr.grand-total td.col-due { font-size: 13px; border-bottom: 3px double #000; }
    .ledger-table tr.grand-total td.align-right:not(.col-total):not(.col-paid):not(.col-due) { font-weight: 400; }
    /* Grand Total, Fine cell: two small boxes, DISC (fine discount) and APL (fine applied) */
    td.fine-pair-cell { padding: 0 !important; }
    .fine-pair { display: flex; }
    .fine-pair > div { flex: 1; display: flex; flex-direction: column; align-items: stretch; text-align: center; }
    .fine-pair > div + div { border-left: 1px solid #999; }
    .fine-pair span { font-size: 7px; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid #999; padding: 1px 2px; background: #e6e6e6; }
    .fine-pair b { font-size: 9px; font-weight: 400; padding: 2px; white-space: nowrap; }

    /* ===== History (Mode / Source, Further Fee Disc, Fine): small date, dot, line; time | user first, then the amount line ===== */
    .hist-item { position: relative; display: flex; gap: 4px; align-items: flex-start; padding-bottom: 6px; }
    .hist-item:last-child { padding-bottom: 0; }
    .hist-date { flex: none; width: 32px; white-space: nowrap; font-size: 8px; font-weight: 700; line-height: 11px; text-align: right; }
    .hist-dot { flex: none; width: 5px; height: 5px; border-radius: 50%; background: #000; margin-top: 3px; position: relative; z-index: 1; }
    .hist-item:not(:last-child)::after { content: ""; position: absolute; left: 38px; top: 10px; bottom: -3px; width: 1px; background: #000; }   /* line joining the dots */
    .hist-sub { font-size: 8px; font-weight: 600; white-space: nowrap; }
    /* Fine cell: before -> after (old fine struck through at the left, arrow in the center, current fine at the right) */
    .fine-ba { display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline; gap: 5px; padding-bottom: 3px; margin-bottom: 4px; border-bottom: 1px dotted #999; }
    .fine-ba s { justify-self: start; text-decoration: none; position: relative; font-weight: 400; color: #444; }
    .fine-ba s::after { content: ""; position: absolute; left: 0; right: 0; top: 1.5px; bottom: 1px; background: linear-gradient(to bottom right, transparent calc(50% - 0.35px), #000 calc(50% - 0.35px), #000 calc(50% + 0.35px), transparent calc(50% + 0.35px)); }
    .fine-ba .fine-arrow { font-size: 9px; font-weight: 400; }
    .fine-ba .fine-after { justify-self: end; font-size: 11px; font-weight: 700; }

    /* ===== User Wise Breakdown: a small table, not stretched over the whole page ===== */
    .breakdown-title { margin-top: 14px; margin-bottom: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .breakdown-table { width: 45%; }

    .print-footer { margin-top: 11px; padding-top: 7px; font-size: 9px; color: #000; text-align: center; font-weight: 600; }

    .print-btn { position: fixed; bottom: 12px; right: 16px; background: #000; color: #fff; border: 1px solid #000; padding: 7px 16px; font-size: 11px; font-weight: 600; cursor: pointer; }
    @media print { .print-btn { display: none !important; } }
</style>

var session_id = "All";
var sessionName = "All";
var campus_name = "All";
var class_name = "All";
var section_name = "All";
var type_name = "All";
var fee_month = "";
var fee_year = 2026;
var custom_fee_name = "";
var start_date_incomePageFilter = "2026-10-01";
var end_date_incomePageFilter = "2026-10-06";
var selectedUsers = ["All"];
var selectedUsersLabel = selectedUsers.indexOf("All") > -1 ? "All" : selectedUsers.join(", ");
var allStudentData = totalData.slice();


/* =====================================================================================================================
   B. HELPERS (copy into the page)
   ===================================================================================================================== */
const INCLUDE_DATELESS_PAYMENTS = true;
const normalizeName = (value) => String(value == null ? "" : value).trim().replace(/\s+/g, " ").toLowerCase();

/* ---- numbers: a zero is a light grey dash; a number too wide for its narrow column gets a slightly smaller font ---- */
const dash = '<span class="zero-dash">-</span>';
const amountOrDash = (value) => (Number(value || 0) !== 0 ? Number(value).toLocaleString() : dash);
// width of a number in em (digits 0.64, comma / dot 0.32)
const fitAmount = (value, basePx, contentPx) => {
    const n = Number(value || 0);
    if (n === 0) return dash;
    const s = n.toLocaleString();
    let units = 0;
    for (let k = 0; k < s.length; k++) units += (s[k] === ',' || s[k] === '.') ? 0.32 : 0.64;
    const size = Math.min(basePx, Math.max(7, Math.floor(contentPx / units * 10) / 10));
    return size < basePx ? `<span style="font-size:${size}px">${s}</span>` : s;
};

/* ---- dates and times (12-hour time with AM / PM, dates like 01 Oct 2026) ---- */
const parseDate = (value) => {
    const d = value ? new Date(value) : null;
    return d && !isNaN(d.getTime()) ? d : null;
};
const hasTimeStored = (d) => !(d.getUTCHours() === 0 && d.getUTCMinutes() === 0 && d.getUTCSeconds() === 0);
const formatTime12 = (value) => {
    const d = parseDate(value);
    return d && hasTimeStored(d) ? d.toLocaleTimeString("en-US", { hour: 'numeric', minute: '2-digit', hour12: true }) : '';
};
const formatShortDate = (value) => {
    const d = parseDate(value);
    return d ? d.toLocaleDateString("en-GB", { day: '2-digit', month: 'short' }) : '';
};
const formatLedgerDate = (value) => {
    const d = parseDate(value);
    return d ? d.toLocaleDateString("en-GB", { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
};
// Paying Date: the date, then the time under it when the cell is narrow
const formatPayingDate = (value) => {
    const d = parseDate(value);
    if (!d) return dash;
    const time = formatTime12(value);
    return `<span class="dt"><span>${formatLedgerDate(value)}</span>${time ? `<span>${time}</span>` : ''}</span>`;
};

/* ---- history: small date, dot and line. Payments and discounts: the amount line first (500 = General / General, dis = 500), then time | user under it.
   old: payments had time | user on the first line and the amount line under it (amountFirst = false) ---- */
const renderHistoryItem = (date, sub, text, amountFirst = false) =>
    `<div class="hist-item"><span class="hist-date">${formatShortDate(date)}</span><span class="hist-dot"></span><span>${amountFirst ? `${text}${sub ? `<br/><small class="hist-sub">${sub}</small>` : ''}` : `${sub ? `<small class="hist-sub">${sub}</small><br/>` : ''}${text}`}</span></div>`;

// Further Fee Disc / Fine discounts: "dis = 200"
const renderDiscountHistory = (history) => history.map((entry) => {
    const by = String(entry.discount_by || entry.by || '').trim();
    const sub = [formatTime12(entry.date), by].filter(Boolean).join(' | ');
    return renderHistoryItem(entry.date, sub, `dis = ${entry.amount}`, true);
}).join('');

// Fine: before -> after (old fine struck through, current fine bold), then the discounts. A fine without a discount is just the amount.
const getFinePrintStr = (item) => {
    const fineHistory = item.late_fee_fine_discount_history || [];
    const currentFine = Number(item.late_fine || 0);
    if (fineHistory.length === 0) return currentFine.toLocaleString();
    const initial = currentFine + fineHistory.reduce((sum, e) => sum + Number(e.amount || 0), 0);
    return `<div class="fine-ba"><s>${initial.toLocaleString()}</s><span class="fine-arrow">&rarr;</span><span class="fine-after">${currentFine.toLocaleString()}</span></div>${renderDiscountHistory(fineHistory)}`;
};

/* ---- payments (inside the component: they use getModeName / getSourceName) ---- */
// every partial payment + the quick payment (what is left of paid_amount)
const getPaymentSegments = (row) => {
    const segments = [];
    const history = (row && row.partial_payment_history) || [];
    history.forEach((payment) => {
        const amount = Number(payment && payment.amount) || 0;
        if (amount <= 0) return;
        segments.push({
            amount,
            receivedBy: String((payment && (payment.payment_recieved_by || payment.paymentRecievedBy)) || "").trim(),
            date: payment && payment.date ? new Date(payment.date) : null,
            modeId: payment && payment.payment_mode_id,
            sourceId: payment && payment.payment_mode_source_id,
            type: "partial",
        });
    });
    const partialSum = history.reduce((sum, payment) => sum + (Number(payment && payment.amount) || 0), 0);
    const quickPayAmount = (Number(row && row.paid_amount) || 0) - partialSum;
    if (quickPayAmount > 0) {
        segments.push({
            amount: quickPayAmount,
            receivedBy: String((row && (row.payment_recieved_by || row.paymentRecievedBy)) || "").trim(),
            date: row && row.paying_date ? new Date(row.paying_date) : null,
            modeId: row && row.payment_mode_id,
            sourceId: row && row.payment_mode_source_id,
            type: "quick",
        });
    }
    return segments;
};

const getModeSourceText = (modeId, sourceId) => {
    const mode = modeId ? getModeName(modeId) : '-';
    const source = sourceId ? getSourceName(sourceId) : '';
    return `${mode}${source ? ` / ${source}` : ''}`;
};

// Mode / Source (User): a fee paid in one go = one plain line. Partial payments = one history item per payment.
const getModeSourcePrintString = (row) => {
    const segments = getPaymentSegments(row);
    if (segments.length === 0) {
        return `${getModeSourceText(row.payment_mode_id, row.payment_mode_source_id)} ${row.payment_recieved_by ? `(${row.payment_recieved_by})` : ''}`.trim();
    }
    if (segments.length === 1 && segments[0].type === 'quick') {
        const seg = segments[0];
        return `${getModeSourceText(seg.modeId, seg.sourceId)} ${seg.receivedBy ? `(${seg.receivedBy})` : ''}`.trim();
    }
    return segments.map((seg) => {
        const sub = [formatTime12(seg.date), seg.receivedBy].filter(Boolean).join(' | ');
        return renderHistoryItem(seg.date, sub, `${seg.amount} = ${getModeSourceText(seg.modeId, seg.sourceId)}`, true);   // old: no 4th argument (time | user first, amount under it)
    }).join('');
};

/* ---- date range / user filters (already in the page) ---- */
const getRangeBounds = () => ({
    start_date: new Date(`${start_date_incomePageFilter}T00:00:00.000+05:00`),
    end_date: new Date(`${end_date_incomePageFilter}T23:59:59.999+05:00`),
});
const isDateInRange = (value, start_date, end_date) => {
    if (!value) return INCLUDE_DATELESS_PAYMENTS;
    const date = value instanceof Date ? value : new Date(value);
    if (isNaN(date.getTime())) return INCLUDE_DATELESS_PAYMENTS;
    return date >= start_date && date <= end_date;
};
const getSegmentsInRange = (row) => {
    const { start_date, end_date } = getRangeBounds();
    return getPaymentSegments(row).filter((segment) => isDateInRange(segment.date, start_date, end_date));
};
const getDiscountBy = (entry) => String(entry?.discount_by || entry?.further_discount_discount_by || entry?.late_fee_fine_discount_discount_by || entry?.by || "").trim();
const getDiscountsInRange = (row) => {
    const { start_date, end_date } = getRangeBounds();
    const collect = (list) => (list || [])
        .filter((entry) => isDateInRange(entry?.date, start_date, end_date))
        .map((entry) => ({ amount: Number(entry?.amount) || 0, by: getDiscountBy(entry), date: entry?.date ? new Date(entry.date) : null }));
    return { further: collect(row?.further_discount_history), fine: collect(row?.late_fee_fine_discount_history) };
};
const isSelectedReceiver = (receivedBy) => {
    if (!selectedUsers?.length || selectedUsers.includes("All")) return true;
    const raw = String(receivedBy || "").trim();
    if (!raw) return selectedUsers.includes("Unknown");
    const norm = normalizeName(raw);
    return selectedUsers.some((u) => u !== "All" && u !== "Unknown" && normalizeName(u) === norm);
};
// Paid column: only the payments inside the date range, for the selected users
const getPaidInRange = (row) => getSegmentsInRange(row).reduce((sum, segment) => (isSelectedReceiver(segment.receivedBy) ? sum + segment.amount : sum), 0);


/* =====================================================================================================================
   C. TOTALS (inside the component)
   ===================================================================================================================== */
/* stat box numbers (same as the useEffect of the page) */
let totalStudent = 0, totalAmount = 0, totalFeeDiscount = 0, totalFineDiscount = 0;
const totalUnpaidCount = allStudentData.length;
(() => {
    const students = [];
    allStudentData.forEach((item) => {
        if (!students.includes(item.general_registration_code)) students.push(item.general_registration_code);
        getSegmentsInRange(item).forEach((segment) => { if (isSelectedReceiver(segment.receivedBy)) totalAmount += segment.amount; });
        const { further, fine } = getDiscountsInRange(item);
        further.forEach((entry) => { if (isSelectedReceiver(entry.by)) totalFeeDiscount += entry.amount; });
        fine.forEach((entry) => { if (isSelectedReceiver(entry.by)) totalFineDiscount += entry.amount; });
    });
    totalStudent = students.length;
})();

/* User Wise Breakdown rows (same as the useMemo of the page) */
const userCollectedRows = (() => {
    const buckets = new Map();
    const bucketFor = (receivedBy) => {
        const raw = String(receivedBy || "").trim();
        const key = raw ? normalizeName(raw) : "__unknown__";
        if (!buckets.has(key)) buckets.set(key, { label: raw || "Unknown", furtherDiscount: 0, fineDiscount: 0, paid: 0 });
        return buckets.get(key);
    };
    totalData.forEach((row) => {
        getSegmentsInRange(row).forEach((segment) => { bucketFor(segment.receivedBy).paid += segment.amount; });
        const { further, fine } = getDiscountsInRange(row);
        further.forEach((entry) => { bucketFor(entry.by).furtherDiscount += entry.amount; });
        fine.forEach((entry) => { bucketFor(entry.by).fineDiscount += entry.amount; });
    });
    return [...buckets.values()]
        .map((b) => ({ username: b.label, furtherDiscount: b.furtherDiscount, fineDiscount: b.fineDiscount, paid: b.paid }))
        .sort((a, b) => b.paid - a.paid || String(a.username).localeCompare(String(b.username)));
})();

/* one row of the main table: overdue rule, Total, Fee Dues, discounts */
const buildTableRows = (rows) => rows.map((i) => {
    const today = new Date().toLocaleDateString("en-CA");
    const dueDate = new Date(i.due_date).toLocaleDateString('en-CA');
    const isOverdue = i.fee_status === "Paid"
        ? new Date(i.paying_date).toLocaleDateString('en-CA') > dueDate
        : i.fee_status === "Clear"
            ? new Date(i.clear_fee_date).toLocaleDateString('en-CA') > dueDate
            : today > dueDate;
    const total = !isOverdue ? i.fee_after_discount : i.fee_after_discount + i.late_fine;
    const further = (i.further_discount_history || []).reduce((sum, d) => sum + Number(d.amount || 0), 0);
    const fineDiscount = (i.late_fee_fine_discount_history || []).reduce((sum, d) => sum + Number(d.amount || 0), 0);
    return {
        item: i,
        isOverdue,
        total,
        paid: getPaidInRange(i),
        dues: i.fee_status === "Clear" ? 0 : total - (Number(i.paid_amount) || 0),
        feeAfterDiscount: (Number(i.fee_after_discount) || 0) + further,
        further,
        fine: isOverdue ? Number(i.late_fine || 0) : 0,
        fineDiscount: isOverdue ? fineDiscount : 0,
    };
});
const getTableTotals = (tableRows) => tableRows.reduce((a, r) => ({
    actual: a.actual + Number(r.item.actual_fee || 0),
    feeAfterDiscount: a.feeAfterDiscount + r.feeAfterDiscount,
    further: a.further + r.further,
    fine: a.fine + r.fine,
    fineDiscount: a.fineDiscount + r.fineDiscount,
    total: a.total + Number(r.total || 0),
    paid: a.paid + r.paid,
    dues: a.dues + r.dues,
}), { actual: 0, feeAfterDiscount: 0, further: 0, fine: 0, fineDiscount: 0, total: 0, paid: 0, dues: 0 });

/* User Wise Breakdown table */
const getUserWisePrintTableHtml = (rows) => {
    const totals = rows.reduce((a, r) => ({ furtherDiscount: a.furtherDiscount + r.furtherDiscount, fineDiscount: a.fineDiscount + r.fineDiscount, paid: a.paid + r.paid }), { furtherDiscount: 0, fineDiscount: 0, paid: 0 });
    return `
        <div class="breakdown-title">User Wise Breakdown</div>
        <table class="breakdown-table">
            <thead>
                <tr>
                    <th>User</th>
                    <th class="align-right">Further Fee Discount</th>
                    <th class="align-right">Fine Discount</th>
                    <th class="align-right">Receiving</th>
                </tr>
            </thead>
            <tbody>
                ${rows.length > 0 ? rows.map((row) => `
                <tr class="row">
                    <td>${row.username || dash}</td>
                    <td class="align-right">${amountOrDash(row.furtherDiscount)}</td>
                    <td class="align-right">${amountOrDash(row.fineDiscount)}</td>
                    <td class="align-right">${amountOrDash(row.paid)}</td>
                </tr>`).join('') : `<tr><td colspan="4" class="align-center">No Records Found!</td></tr>`}
                ${rows.length > 0 ? `
                <tr class="grand-total">
                    <td>Grand Total</td>
                    <td class="align-right">${amountOrDash(totals.furtherDiscount)}</td>
                    <td class="align-right">${amountOrDash(totals.fineDiscount)}</td>
                    <td class="align-right">${amountOrDash(totals.paid)}</td>
                </tr>` : ''}
            </tbody>
        </table>`;
};


/* =====================================================================================================================
   D. REPORT HTML (the body of the print window)
   ===================================================================================================================== */
const buildReportBodyHtml = () => {
    const tableRows = buildTableRows(allStudentData);
    const rowTotals = getTableTotals(tableRows);
    // the date range uses the same date format as the table (01 Oct 2026)
    const rangeDate = (value) => formatLedgerDate(`${value}T12:00:00`);

    const filtersRow1 = [['Fee Type', type_name]];
    if (type_name === "Monthly Fee" || type_name === "Transport Fee") filtersRow1.push(['Month / Year', `${fee_month || '-'} / ${fee_year}`]);
    if (type_name === "Custom Fee") filtersRow1.push(['Fee Name', custom_fee_name || '-']);
    filtersRow1.push(['Session', sessionName], ['Campus', campus_name], ['Class', class_name], ['Section', section_name]);
    const filtersRow2 = [['Date Range', `${rangeDate(start_date_incomePageFilter)} to ${rangeDate(end_date_incomePageFilter)}`], ['Received By', selectedUsersLabel]];
    const filtersHtml = (list) => `<div class="filters-row">${list.map(([label, value]) => `<span>${label}: <b>${value}</b></span>`).join('<span class="sep">&middot;</span>')}</div>`;

    const renderRow = (r, index) => {
        const i = r.item;
        const modeSourceHtml = getModeSourcePrintString(i);
        const hasFineHistory = (i.late_fee_fine_discount_history || []).length > 0;
        const fineHtml = (!r.isOverdue || (Number(i.late_fine || 0) === 0 && !hasFineHistory)) ? dash : getFinePrintStr(i);
        const fdHistory = i.further_discount_history || [];
        const furtherDiscountHtml = fdHistory.length > 0 ? renderDiscountHistory(fdHistory) : dash;
        const gr = i.general_registration_code?.replace(/\D/g, "");
        return `
                <tr class="row">
                    <td class="align-center">${index + 1}</td>
                    <td>${gr}</td>
                    <td>
                        <div>${i.student_name}</div>
                        <div class="student-sub">S/O ${i.student_father_name}</div>
                    </td>
                    <td>${i.title}</td>
                    <td class="nowrap">${i.due_date ? (r.isOverdue ? `<u>${formatLedgerDate(i.due_date)}</u>` : formatLedgerDate(i.due_date)) : dash}</td>
                    <td>${formatPayingDate(i.paying_date)}</td>
                    <td>${modeSourceHtml === '-' || modeSourceHtml === '' ? dash : modeSourceHtml}</td>
                    <td class="align-right col-num">${fitAmount(i.actual_fee, 9, 38)}</td>
                    <td class="align-right col-num">${fitAmount(r.feeAfterDiscount, 9, 45)}</td>
                    <td class="${fdHistory.length > 0 ? 'align-left' : 'align-right'}">${furtherDiscountHtml}</td>
                    <td class="${(r.isOverdue && hasFineHistory) ? 'align-left' : 'align-right'}">${fineHtml}</td>
                    <td class="align-right col-total col-num">${fitAmount(r.total, 11, 40)}</td>
                    <td class="align-right col-paid col-num">${fitAmount(r.paid, 11, 40)}</td>
                    <td class="align-right col-due col-num">${fitAmount(r.dues, 11, 40)}</td>
                </tr>`;
    };

    return `
        <div class="header-section">
            <div class="header-side">
                ${systemSetting?.school_logo ? `<img src="${systemSetting.school_logo}" class="header-logo" alt="Logo" />` : ''}
            </div>
            <div style="text-align: center; flex: 1;">
                <h1>${systemSetting?.school_name || 'School Management System'}</h1>
                <h2>Date Wise Fee Transaction Report (Detailed)</h2>
                <div class="filters">
                    ${filtersHtml(filtersRow1)}
                    ${filtersHtml(filtersRow2)}
                </div>
            </div>
            <div class="header-side">
                <div class="summary-grid">
                    <div class="summary-card"><span class="summary-label">Total Students</span><span class="summary-value">${amountOrDash(totalStudent)}</span></div>
                    <div class="summary-card"><span class="summary-label">Number Of Invoices</span><span class="summary-value">${amountOrDash(totalUnpaidCount)}</span></div>
                    <div class="summary-card"><span class="summary-label">Disc (Further Fee + Fine)</span><span class="summary-value">${amountOrDash(totalFeeDiscount + totalFineDiscount)}</span></div>
                    <div class="summary-card dues"><span class="summary-label">Net Receiving</span><span class="summary-value">${amountOrDash(totalAmount)}</span></div>
                </div>
            </div>
        </div>

        <div style="overflow: auto; margin-bottom: 11px;">
            <table class="ledger-table">
                <colgroup>${[2.5, 3.5, null, null, null, 6.5, 17, 4.4, 5.2, 11, 11, null, null, null].map(w => w === null ? `<col>` : `<col style="width:${w}%">`).join('')}</colgroup>
                <thead>
                    <tr>
                        <th class="align-center">Sr</th>
                        <th>Reg #</th>
                        <th>Student Name</th>
                        <th>Fee Title</th>
                        <th>Due Date</th>
                        <th>Paying Date</th>
                        <th><span class="th-row"><span>Mode / Source (User)</span><span class="th-sub">(History)</span></span></th>
                        <th class="align-right col-num">Actual Class Fee</th>
                        <th class="align-right col-num">Fee After DISC</th>
                        <th class="align-right">Further Fee Disc</th>
                        <th class="align-right">Fine</th>
                        <th class="align-right col-total col-num">Total</th>
                        <th class="align-right col-paid col-num">Paid<span class="th-below">(in range)</span></th>
                        <th class="align-right col-due col-num">Fee Dues</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows.length > 0 ? tableRows.map(renderRow).join('') : `<tr><td colspan="14" class="align-center" style="padding: 17px;">No Records Found!</td></tr>`}
                </tbody>
                ${tableRows.length > 0 ? `
                <tbody>
                    <tr class="grand-total">
                        <td colspan="7">Grand Total</td>
                        <td class="align-right col-num">${fitAmount(rowTotals.actual, 9, 38)}</td>
                        <td class="align-right col-num">${fitAmount(rowTotals.feeAfterDiscount, 9, 45)}</td>
                        <td class="align-right">${amountOrDash(rowTotals.further)}</td>
                        <td class="fine-pair-cell"><div class="fine-pair"><div><span>Disc</span><b>${amountOrDash(rowTotals.fineDiscount)}</b></div><div><span>Apl</span><b>${amountOrDash(rowTotals.fine)}</b></div></div></td>
                        <td class="align-right col-total col-num">${fitAmount(rowTotals.total, 11, 40)}</td>
                        <td class="align-right col-paid col-num">${fitAmount(rowTotals.paid, 11, 40)}</td>
                        <td class="align-right col-due col-num">${fitAmount(rowTotals.dues, 13, 40)}</td>
                    </tr>
                </tbody>` : ''}
            </table>
        </div>
        ${getUserWisePrintTableHtml(userCollectedRows)}
        <div class="print-footer">
            Generated on: ${formatLedgerDate(new Date())} | Powered by Ai Schooling System.com
        </div>`;
};


/* =====================================================================================================================
   PREVIEW ONLY: show the report and the Print button

document.body.innerHTML = '<button class="print-btn" onclick="window.print()">Print</button>' + buildReportBodyHtml();
</script>
</body>
