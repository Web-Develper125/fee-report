        const studentIdStr = String(item.student_id);
        if (item.fee_status === "Unpaid") {
            const remaining = Math.max(0, calculateRowTotal(item) - (Number(item.paid_amount) || 0));
            duesMap.set(studentIdStr, (duesMap.get(studentIdStr) || 0) + remaining);
        }
        const segments = getSegmentsInRange(item);
        const { further, fine } = getDiscountsInRange(item);
        const hasTodayActivity = segments.length > 0 || further.length > 0 || fine.length > 0;
        if (!hasTodayActivity) return;
        const group = ensureGroup(item);
        segments.forEach((segment) => {
            if (!isSelectedReceiver(segment.receivedBy)) return;
            if (!isSelectedModeSourceSeg(segment)) return;
            group.paid += segment.amount;
            group.userLines.push({ amount: segment.amount, by: segment.receivedBy || "Unknown", date: segment.date });
            const key = modeSourceKey(segment.mode_id, segment.source_id);
            const label = `${segment.mode_id ? getModeName(segment.mode_id) : '-'}${segment.source_id ? ` / ${getSourceName(segment.source_id)}` : ''}`;
            if (!group.modeLines.has(key)) group.modeLines.set(key, { label, amount: 0 });
            group.modeLines.get(key).amount += segment.amount;
            group.paymenthistoryLine.set(`${group.paymenthistoryLine.size}`, { amount: segment.amount, label, user: segment.receivedBy || "Unknown", date: segment.date });
            if (segment.date && (!group.latestDate || segment.date > group.latestDate)) group.latestDate = segment.date;
        });
        [...further, ...fine].forEach((entry) => {
            if (!isSelectedReceiver(entry.by)) return;
            group.discount += entry.amount;
            group.discountLines.push({ amount: entry.amount, by: entry.by || "Unknown", date: entry.date });
            if (entry.date && (!group.latestDate || entry.date > group.latestDate)) group.latestDate = entry.date;
        });
    });
    const isFilterActive = selectedUser !== FILTER_ALL || selectedModeSourceKey !== FILTER_ALL;
    let rows = [...groups.values()].filter((g) => !isFilterActive || g.paid > 0 || g.discount > 0);
    rows.forEach((g) => { g.dues = duesMap.get(g.student_id) || 0; g.payable = g.dues + g.paid + g.discount; });
    rows.sort((a, b) => (b.latestDate ? b.latestDate.getTime() : -Infinity) - (a.latestDate ? a.latestDate.getTime() : -Infinity) || GR_COLLATOR_SORT(a, b)); // newest paying date first
    rows = rows.map((g, index) => ({ ...g, sr: index + 1 }));
    studentRows = rows;
    totalStudents = rows.length;
    totalPayable = rows.reduce((s, r) => s + r.payable, 0);
    totalPaid = rows.reduce((s, r) => s + r.paid, 0);
    totalDiscount = rows.reduce((s, r) => s + r.discount, 0);
    totalDues = rows.reduce((s, r) => s + r.dues, 0);
})();
var showPayableDues = start_date === todayStr() && end_date === todayStr() && selectedUser === FILTER_ALL && selectedModeSourceKey === FILTER_ALL;

const getAdvanceDate = (t) => t?.date || t?.createdAt || t?.created_at || t?.transaction_date || null;
const getAdvanceAmount = (t) => Number(t?.amount) || 0;
const getAdvanceBy = (t) => String(t?.received_by || t?.recieved_by || t?.payment_recieved_by || t?.createdBy || t?.by || "").trim();

const buildUserBreakdownRows = () => {
    const buckets = new Map();
    const ensureBucket = (key, label) => {
        if (!buckets.has(key)) buckets.set(key, { label, furtherDiscount: 0, fineDiscount: 0, paid: 0, advanceReceived: 0, advanceSpent: 0 });
        return buckets.get(key);
    };
    const bucketFor = (receivedBy) => {
        const raw = String(receivedBy || "").trim();
        if (!raw) return ensureBucket("__unknown__", "Unknown");
        return ensureBucket(normalizeName(raw), raw);
    };
    (rawItems || []).forEach((row) => {
        getSegmentsInRange(row).forEach((segment) => {
            if (!isSelectedModeSourceSeg(segment)) return;
            const bucket = bucketFor(segment.receivedBy);
            bucket.paid += segment.amount;
            if (isFamilyCreditPayment(segment.mode_id)) bucket.advanceSpent += segment.amount;
        });
        const { further, fine } = getDiscountsInRange(row);
        further.forEach((entry) => { bucketFor(entry.by).furtherDiscount += entry.amount; });
        fine.forEach((entry) => { bucketFor(entry.by).fineDiscount += entry.amount; });
    });
    (feeDefaulterDataFilter?.familyAdvanceTransactions || []).forEach((t) => {
        if (!isDateInRange(getAdvanceDate(t))) return;
        bucketFor(getAdvanceBy(t)).advanceReceived += getAdvanceAmount(t);
    });
    return [...buckets.values()]
        .filter((row) => selectedUser === FILTER_ALL || normalizeName(row.label) === normalizeName(selectedUser))
        .map((row) => ({ username: row.label, ...row }))
        .sort((x, y) => y.paid - x.paid || String(x.username).localeCompare(String(y.username)));
};

const getUserWisePrintTableHtml = (userRows) => {
    const modeMap = new Map();
    const entryFor = (label) => {
        if (!modeMap.has(label)) modeMap.set(label, { amount: 0, advance: 0, spent: 0 });
        return modeMap.get(label);
    };
    studentRows.forEach((row) => {
        [...row.modeLines.values()].forEach((m) => { entryFor(m.label).amount += m.amount; });
    });
    (rawItems || []).forEach((item) => {
        getSegmentsInRange(item).forEach((segment) => {
            if (!isSelectedReceiver(segment.receivedBy) || !isSelectedModeSourceSeg(segment) || !isFamilyCreditPayment(segment.mode_id)) return;
            const label = `${segment.mode_id ? getModeName(segment.mode_id) : '-'}${segment.source_id ? ` / ${getSourceName(segment.source_id)}` : ''}`;
            entryFor(label).spent += segment.amount;
        });
    });
    (feeDefaulterDataFilter?.familyAdvanceTransactions || []).forEach((t) => {
        if (!isDateInRange(getAdvanceDate(t)) || !isSelectedReceiver(getAdvanceBy(t))) return;
        if (selectedModeSourceKey !== FILTER_ALL && modeSourceKey(t?.payment_mode_id, t?.payment_mode_source_id) !== selectedModeSourceKey) return;
        const label = `${t?.payment_mode_id ? getModeName(t.payment_mode_id) : '-'}${t?.payment_mode_source_id ? ` / ${getSourceName(t.payment_mode_source_id)}` : ''}`;
        entryFor(label).advance += getAdvanceAmount(t);
    });
    const modeGroups = new Map();
    modeMap.forEach((entry, label) => {
        const parts = String(label).split(' / ');
        const mode = parts[0] || '-';
        const source = parts.slice(1).join(' / ');
        if (!modeGroups.has(mode)) modeGroups.set(mode, { mode, total: 0, sources: new Map() });
        const group = modeGroups.get(mode);
        group.total += entry.amount + entry.advance;
        const prev = group.sources.get(source) || { amount: 0, advance: 0, spent: 0 };
        group.sources.set(source, { amount: prev.amount + entry.amount, advance: prev.advance + entry.advance, spent: prev.spent + entry.spent });
    });
    const modeList = [...modeGroups.values()].sort((x, y) => y.total - x.total);
    const modeTotals = modeList.reduce((acc, g) => [...g.sources.values()].reduce((t, v) => ({
        advance: t.advance + v.advance,
        receiving: t.receiving + v.amount,
        net: t.net + (v.amount - v.spent) + v.advance,
    }), acc), { advance: 0, receiving: 0, net: 0 });
    const modeRowsHtml = modeList.length > 0
        ? modeList.map((g) => {
            const sources = [...g.sources.entries()].sort((x, y) => (y[1].amount + y[1].advance) - (x[1].amount + x[1].advance));
            return sources.map(([source, v], i) => `
            <tr>
                ${i === 0 ? `<td class="table-cell mode-merge" rowspan="${sources.length}">${g.mode}</td>` : ""}
                <td class="table-cell">${source}</td>
                <td class="table-cell right">${amountBlank(v.advance)}</td>
                <td class="table-cell right">${amountBlank(v.amount)}</td>
                <td class="table-cell right strong">${amountBlank(v.amount - v.spent + v.advance)}</td>
            </tr>`).join('');
        }).join('')
        : `<tr><td colspan="5" class="no-records">No Records Found!</td></tr>`;
    return `
        ${getDateWiseUserPrintTableHtml(userRows)}

        <div class="section-title" style="margin-top: 14px;">Mode / Source Wise Breakdown</div>
        <table>
            <thead>
                <tr class="table-head-row">
                    <th class="table-head-cell">Mode</th>
                    <th class="table-head-cell">Source</th>
                    <th class="table-head-cell right">Advance Received</th>
                    <th class="table-head-cell right">Fee Receiving</th>
                    <th class="table-head-cell right">Net Receiving</th>
                </tr>
            </thead>
            <tbody>
                ${modeRowsHtml}
                ${modeList.length > 0 ? `
                <tr class="grand-total-row">
                    <td class="grand-total-label" colspan="2">Grand Total:</td>
                    <td class="grand-total-cell right">${amountBlank(modeTotals.advance)}</td>
                    <td class="grand-total-cell right">${amountBlank(modeTotals.receiving)}</td>
                    <td class="grand-total-cell right">${amountBlank(modeTotals.net)}</td>
                </tr>` : ""}
            </tbody>
        </table>
    `;
};

const buildReport = () => {
    const sessionName = session_id === "All" ? "All" : session_id;
    const rangeDate = (value) => new Date(`${value}T00:00:00`).toLocaleDateString("pt-PT");
    const dateLabel = start_date === end_date ? rangeDate(start_date) : `${rangeDate(start_date)} to ${rangeDate(end_date)}`;
    const userLabel = selectedUser === FILTER_ALL ? "All" : selectedUser;
    const filtersRow1 = [['Session', sessionName], ['Campus', campus_name || "All"], ['Class', class_name || "All"], ['Section', section_name || "All"]];
    const filtersRow2 = [['Date', dateLabel], ['User', userLabel]];
    const filtersHtml = (list) => `<div class="filters-row">${list.map(([label, value]) => `<span>${label}: <b>${value}</b></span>`).join('<span class="sep">&middot;</span>')}</div>`;

    const familyKeyOfItem = (item) => (item?.student_family_code ? String(item.student_family_code) : `__${item?.student_id}`);
    const familyKeyOfStudent = new Map();
    (rawItems || []).forEach((item) => familyKeyOfStudent.set(String(item.student_id), familyKeyOfItem(item)));

    const advanceReceivedByFamily = new Map();
    let advanceReceivedTotal = 0;
    (feeDefaulterDataFilter?.familyAdvanceTransactions || []).forEach((t) => {
        if (!isDateInRange(getAdvanceDate(t)) || !isSelectedReceiver(getAdvanceBy(t))) return;
        const key = String(t?.family_code || '');
        const amount = getAdvanceAmount(t);
        const date = getAdvanceDate(t) ? new Date(getAdvanceDate(t)) : null;
        if (!advanceReceivedByFamily.has(key)) advanceReceivedByFamily.set(key, { amount: 0, date: null, name: t?.family_name || t?.father_name || '' });
        const entry = advanceReceivedByFamily.get(key);
        entry.amount += amount;
        if (date && (!entry.date || date > entry.date)) entry.date = date;
        advanceReceivedTotal += amount;
    });

    const advanceSpentByFamily = new Map();
    const advanceSpentByStudent = new Map();
    let advanceSpentTotal = 0;
    (rawItems || []).forEach((item) => {
        getSegmentsInRange(item).forEach((segment) => {
            if (!isSelectedReceiver(segment.receivedBy) || !isSelectedModeSourceSeg(segment) || !isFamilyCreditPayment(segment.mode_id)) return;
            const key = familyKeyOfItem(item);
            advanceSpentByFamily.set(key, (advanceSpentByFamily.get(key) || 0) + segment.amount);
            advanceSpentByStudent.set(String(item.student_id), (advanceSpentByStudent.get(String(item.student_id)) || 0) + segment.amount);
            advanceSpentTotal += segment.amount;
        });
    });

    const printRows = studentRows.map((row) => ({ ...row, famKey: familyKeyOfStudent.get(String(row.student_id)) || `__${row.student_id}` }));
    const familyOrder = new Map();
    printRows.forEach((row) => { if (!familyOrder.has(row.famKey)) familyOrder.set(row.famKey, familyOrder.size); });
    // rows stay in paying-date order (newest first); a family advance cell is merged only over the siblings that sit next to each other
    const familySize = new Map();
    printRows.forEach((row) => familySize.set(row.famKey, (familySize.get(row.famKey) || 0) + 1));
    const seenFamily = new Set();
    printRows.forEach((row, index) => {
        row.sr = index + 1;
        row.runStart = index === 0 || printRows[index - 1].famKey !== row.famKey;
            row.famEnd = index === printRows.length - 1 || printRows[index + 1].famKey !== row.famKey;
        if (row.runStart) { let n = 1; while (printRows[index + n] && printRows[index + n].famKey === row.famKey) n++; row.runSize = n; }
        row.famFirst = !seenFamily.has(row.famKey);
        seenFamily.add(row.famKey);
        row.advRec = row.famFirst ? (advanceReceivedByFamily.get(row.famKey)?.amount || 0) : 0;
        row.advSpent = advanceSpentByStudent.get(String(row.student_id)) || 0;
        row.netPaid = row.paid - (advanceSpentByStudent.get(String(row.student_id)) || 0) + row.advRec;

    const depositOnlyRows = [...advanceReceivedByFamily.entries()]
        .filter(([key]) => !familyOrder.has(key))

    const invoiceCount = invoiceIds.size;

                #mainTable .adv-row { gap: 12px; }
                .fam-merge { vertical-align: middle; }
                /* Family Advance cell: no line between the rows of one family (a line only where the family ends), only the amounts (the left / right lines come from the neighbour columns) */
                #mainTable .fam-cell { border-top: none; border-bottom: none; }
                #mainTable .fam-cell.fam-end { border-bottom: 1px solid #999; }
                .mode-merge { vertical-align: middle; font-weight: 700; }
                .print-footer { margin-top: 11px; padding-top: 7px; font-size: 9px; color: #000; text-align: center; font-weight: 700; }

                /* User Wise Breakdown + footer always at the end of the LAST page: a spacer (set by the script below) fills the gap above it */
                .bottom { break-inside: avoid; page-break-inside: avoid; margin-top: 10px; }
                #pageSpacer { height: 0; }
                .page-measure { position: absolute; visibility: hidden; left: 0; top: 0; width: 1px; height: 281mm; }
                /* same layout the printer uses, applied only while measuring */
                body.measuring { padding: 0 !important; }
                body.measuring .page { width: 196mm !important; margin: 0 !important; }
                @media print { html, body { padding: 0 !important; } }
                .print-btn { position: fixed; top: 12px; right: 16px; background: #000; color: #fff; border: 1px solid #000; padding: 7px 16px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: Arial, sans-serif; } @media print { .print-btn { display: none !important; } }
            </style>
        </head>
        <body>
            <div class="page-measure" id="pageMeasure"></div>
            <div class="page">
                <div class="header-section">
                    <div class="header-side">
                        ${systemSetting?.school_logo ? `<img src="${systemSetting.school_logo}" class="header-logo" alt="Logo" />` : ''}
                    </div>
                    <div style="text-align: center; flex: 1;">
                        <h1>${systemSetting?.school_name || 'School Management System'}</h1>
                        <h2>Date Wise Fee Collection Report (Detailed)</h2>
                        <div class="filters">
                            ${filtersHtml(filtersRow1)}
                            ${filtersHtml(filtersRow2)}
                        </div>
                    </div>
                    <div class="header-side"></div>
                </div>

                <div class="stats-strip">
                    <div class="stat"><div class="stat-label">Students</div><div class="stat-value">${totalStudents}</div></div>
                    <div class="stat"><div class="stat-label">Number Of Invoices</div><div class="stat-value">${invoiceCount.toLocaleString()}</div></div>
                    <div class="stat"><div class="stat-label">Advance Receiving</div><div class="stat-value">Rs. ${advanceReceivedTotal.toLocaleString()}</div></div>
                    <div class="stat"><div class="stat-label">Fee Receiving</div><div class="stat-value">Rs. ${feeReceiving.toLocaleString()}</div></div>
                    <div class="stat net"><div class="stat-label">Net Receiving</div><div class="stat-value">Rs. ${netReceiving.toLocaleString()}</div></div>
                </div>

                <table id="mainTable">
                    <thead>
                        <tr class="table-head-row">
                            <th class="table-head-cell">Sr #</th>
                            <th class="table-head-cell">Reg #</th>
                            <th class="table-head-cell">Student Name</th>
                            <th class="table-head-cell">Paying Date</th>
                            ${payableTh}
                            <th class="table-head-cell right">Discount</th>
                            <th class="table-head-cell">Family Advance<div class="adv-row"><span>Received</span><span>Spent</span></div></th>
                            <th class="table-head-cell right">Total Received</th>
                            ${duesTh}
                        </tr>
                    </thead>
                    <tbody>
                        ${rowsHtml}
                        ${grandRowHtml}
                    </tbody>
                </table>

                <div id="pageSpacer"></div>
                <div class="bottom" id="bottomBlock">
                    ${getUserWisePrintTableHtml(buildUserBreakdownRows())}
                    <div class="print-footer">
                        Generated on: ${new Date().toLocaleDateString("pt-PT")} | Powered by Ai Schooling System.com
                    </div>
                </div>
            </div>
            <script>
                function fitBottomBlock() {
                    var spacer = document.getElementById("pageSpacer");
                    var block = document.getElementById("bottomBlock");
                    var table = document.getElementById("mainTable");
                    var page = document.querySelector(".page");
                    spacer.style.height = "0px";
                    document.body.classList.add("measuring");
                    var pageH = document.getElementById("pageMeasure").getBoundingClientRect().height;
                    var pageTop = page.getBoundingClientRect().top;
                    var theadH = table.querySelector("thead").getBoundingClientRect().height;
                    var rows = table.querySelectorAll("tbody tr");
                    var shift = 0;
                    for (var i = 0; i < rows.length; i++) {
                        var rect = rows[i].getBoundingClientRect();
                        var top = rect.top - pageTop + shift;
                        var bottom = rect.bottom - pageTop + shift;
                        var pg = Math.floor(top / pageH);
                        if (bottom > (pg + 1) * pageH) { shift += (pg + 1) * pageH + theadH - top; }
                    }
                    var contentEnd = spacer.getBoundingClientRect().top - pageTop + shift;
                    var blockH = block.getBoundingClientRect().height;
                    var pages = Math.max(1, Math.ceil((contentEnd + blockH) / pageH));
                    // 60px safety: the printer lays the rows out a little taller than this measurement, so the block must end well before the page bottom or it spills (together with the spacer) onto an extra page
                    var spare = pages * pageH - contentEnd - blockH - 60;
                    spacer.style.height = Math.max(0, spare) + "px";
                    document.body.classList.remove("measuring");
                }
                function clearBottomBlock() { document.getElementById("pageSpacer").style.height = "0px"; }
                window.addEventListener("beforeprint", fitBottomBlock);
                window.addEventListener("afterprint", clearBottomBlock);
            <\/script>
            <button class="print-btn" onclick="window.print()">Print</button>
        </body>
        </html>
    `;
};

document.open();
document.write(buildReport());
document.close();
</script>
</body>
