    return `${currentFine > 0 ? `<span class="fine-corner">${currentFine.toLocaleString()}</span>` : ''}${renderDiscountHistory(fineHistory)}`;
};

function buildDetailedFeeTransactionReportHtml({
    systemSetting,
    title = 'Date Wise Fee Transaction Report (Detailed)',
    sessionName,
    campusName,
    className,
    sectionName,
    typeName,
    feeMonth,
    feeYear,
    customFeeName,
    startDate,
    endDate,
    receivedByLabel,
    extraFilters = [],
    rows = [],
    getPaidInRange,
    getPrintSegments,
    getModeName,
    getSourceName,
    emptyModeAsDash = false,
    getFamilyAdvance,
    getFamilyBalance,
    getFamilyFatherName,
    getDepositFamilyCodes,
    userRows = [],
    totalStudent = 0,
    totalUnpaidCount = 0,
    familyAdvanceReceived = 0,
    totalFeeDiscount = 0,
    totalFineDiscount = 0,
    feeReceiving = 0,
    familyCreditUsed = 0,
    netReceiving = 0,
}) {
    const getModeSourcePrintString = (row) => {
        const segments = (getPrintSegments ? getPrintSegments(row) : []) || [];
        if (segments.length === 0) {
            if (emptyModeAsDash) return dash;
            const who = String(row?.payment_recieved_by || row?.paymentRecievedBy || '').trim();
            return `${modeSourceText(row?.payment_mode_id, row?.payment_mode_source_id, getModeName, getSourceName)} ${who ? `(${who})` : ''}`.trim();
        }
        if (segments.length === 1 && segments[0].type === 'quick') {
            const seg = segments[0];
            return `${modeSourceText(seg.modeId, seg.sourceId, getModeName, getSourceName)} ${seg.receivedBy ? `(${seg.receivedBy})` : ''}`.trim();
        }
        return segments.map((seg) => {
            const sub = [formatTime12(seg.date), seg.receivedBy].filter(Boolean).join(' | ');
            return renderHistoryItem(seg.date, sub, `${seg.amount} = ${modeSourceText(seg.modeId, seg.sourceId, getModeName, getSourceName)}`, true);
        }).join('');
    };
    const getAdvanceModeSource = (d) => `${modeSourceText(d.modeId, d.sourceId, getModeName, getSourceName)} ${d.by ? `(${d.by})` : ''}`.trim();

    const buildTableRows = (list) => list.map((i) => {
        const today = new Date().toLocaleDateString("en-CA");
        const dueDate = new Date(i.due_date).toLocaleDateString('en-CA');
        const isOverdue = i.fee_status === "Paid"
            ? new Date(i.paying_date).toLocaleDateString('en-CA') > dueDate
            : i.fee_status === "Clear"
                ? new Date(i.clear_fee_date).toLocaleDateString('en-CA') > dueDate
                : today > dueDate;
        const total = !isOverdue ? i.fee_after_discount : i.fee_after_discount + i.late_fine;
        const further = (i.further_discount_history || []).reduce((sum, d) => sum + Number(d.amount || 0), 0);
        const fineDiscount = (i.late_fee_fine_discount_history || []).reduce((sum, d) => sum + Number(d.amount || 0), 0);
        return {
            item: i,
            isOverdue,
            total,
            paid: getPaidInRange(i),
            dues: i.fee_status === "Clear" ? 0 : total - (Number(i.paid_amount) || 0),
            feeAfterDiscount: (Number(i.fee_after_discount) || 0) + further,
            further,
            fine: isOverdue ? Number(i.late_fine || 0) : 0,
            fineDiscount: isOverdue ? fineDiscount : 0,
        };
    });
    const getTableTotals = (tableRows) => tableRows.reduce((a, r) => ({
        actual: a.actual + Number(r.item.actual_fee || 0),
        feeAfterDiscount: a.feeAfterDiscount + r.feeAfterDiscount,
        further: a.further + r.further,
        fine: a.fine + r.fine,
        fineDiscount: a.fineDiscount + r.fineDiscount,
        total: a.total + Number(r.total || 0),
        paid: a.paid + r.paid,
        dues: a.dues + r.dues,
    }), { actual: 0, feeAfterDiscount: 0, further: 0, fine: 0, fineDiscount: 0, total: 0, paid: 0, dues: 0 });

    const tableRows = buildTableRows(rows || []);
    const rowTotals = getTableTotals(tableRows);
    const rangeDate = (value) => formatLedgerDate(`${value}T12:00:00`);

    const filtersRow1 = [['Fee Type', typeName]];
    if (typeName === "Monthly Fee" || typeName === "Transport Fee") filtersRow1.push(['Month / Year', `${feeMonth || '-'} / ${feeYear}`]);
    if (typeName === "Custom Fee") filtersRow1.push(['Fee Name', customFeeName || '-']);
    filtersRow1.push(['Session', sessionName], ['Campus', campusName], ['Class', className], ['Section', sectionName]);
    const filtersRow2 = [['Date Range', `${rangeDate(startDate)} to ${rangeDate(endDate)}`], ['Received By', receivedByLabel], ...extraFilters];
    const filtersHtml = (list) => `<div class="filters-row">${list.map(([label, value]) => `<span>${label}: <b>${value}</b></span>`).join('<span class="sep">&middot;</span>')}</div>`;

    const renderRow = (r, index, familyCellHtml = '') => {
        const i = r.item;
        const modeSourceHtml = getModeSourcePrintString(i);
        const hasFineHistory = (i.late_fee_fine_discount_history || []).length > 0;
        const fineHtml = (!r.isOverdue || (Number(i.late_fine || 0) === 0 && !hasFineHistory)) ? dash : getFinePrintStr(i);
        const fdHistory = i.further_discount_history || [];
        const furtherDiscountHtml = fdHistory.length > 0 ? renderDiscountHistory(fdHistory) : dash;
        const gr = i.general_registration_code?.replace(/\D/g, "");
        const modeCell = (modeSourceHtml === '-' || modeSourceHtml === '') ? dash : modeSourceHtml;
        return `
                    <tr class="row">
                        <td class="align-center col-narrow">${index + 1}</td>
                        ${familyCellHtml}
                        <td class="col-student">
                            <div>${i.student_name}</div>
                            <div class="student-sub">Reg # ${gr}</div>
                        </td>
                        <td class="col-title">${i.title}</td>
                        <td class="nowrap">${i.due_date ? (r.isOverdue ? `<u>${formatLedgerDate(i.due_date)}</u>` : formatLedgerDate(i.due_date)) : dash}</td>
                        <td>${formatPayingDate(i.paying_date)}</td>
                        <td>${modeCell}</td>
                        <td class="align-right col-num">${fitAmount(i.actual_fee, 9, 38)}</td>
                        <td class="align-right col-num">${fitAmount(r.feeAfterDiscount, 9, 45)}</td>
                        <td class="${fdHistory.length > 0 ? 'align-left' : 'align-right'}">${furtherDiscountHtml}</td>
                        <td class="${(r.isOverdue && hasFineHistory) ? 'align-left fine-top' : 'align-right'}">${fineHtml}</td>
                        <td class="align-right col-total col-num">${fitAmount(r.total, 11, 40)}</td>
                        <td class="align-right col-paid col-num">${fitAmount(r.paid, 11, 40)}</td>
                        <td class="align-right col-due col-num">${fitAmount(r.dues, 11, 40)}</td>
                    </tr>`;
    };

    const familyGroups = [];
    tableRows.forEach((r) => {
        const i = r.item;
        const familyKey = i.student_family_code || i.general_registration_code;
        let family = familyGroups.find((g) => g.key === familyKey);
        if (!family) {
            family = { key: familyKey, code: i.student_family_code, students: [] };
            familyGroups.push(family);
        }
        const studentCode = i.general_registration_code;
        let student = family.students.find((s) => s.code === studentCode);
        if (!student) {
            student = { code: studentCode, name: i.student_name, father: i.student_father_name, reg: String(studentCode || '').replace(/\D/g, ''), rows: [] };
            family.students.push(student);
        }
        student.rows.push(r);
    });
    (getDepositFamilyCodes ? getDepositFamilyCodes() : []).forEach((code) => {
        if (familyGroups.some((g) => g.code != null && String(g.code) === code)) return;
        familyGroups.push({ key: code, code, students: [], advanceOnly: true, father: getFamilyFatherName ? getFamilyFatherName(code) : '' });
    });
    familyGroups.sort((a, b) => String(a.code ?? "").localeCompare(String(b.code ?? ""), undefined, { numeric: true, sensitivity: "base" }));

    let srCounter = 0;
    const advanceRowHtml = (d, familyCellHtml) => `
                    <tr class="row advance-row">
                        <td class="col-narrow"></td>
                        ${familyCellHtml}
                        <td class="col-student"></td>
                        <td class="col-title"><b>Family Advance</b></td>
                        <td></td>
                        <td>${formatPayingDate(d.date)}</td>
                        <td>${getAdvanceModeSource(d)}</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td class="align-right col-paid col-num">${fitAmount(d.amount, 11, 40)}</td>
                        <td></td>
                    </tr>`;

    const familyBlockHtml = (family) => {
        const advances = getFamilyAdvance ? getFamilyAdvance(family.code) : [];
        const siblings = family.students.length > 1;
        const feeCount = family.students.reduce((n, s) => n + s.rows.length, 0);
        const sectionRows = feeCount + advances.length;
        let familyRowIndex = 0;
        const fatherNames = [...new Set([...family.students.map((s) => String(s.father || '').trim()), String(family.father || '').trim()].filter(Boolean))].join(' / ');
        const familyCell = () => {
            const index = familyRowIndex++;
            const position = sectionRows === 1 ? ' fc-only' : index === 0 ? ' fc-first' : index === sectionRows - 1 ? ' fc-last' : ' fc-mid';
            if (index > 0) return `<td class="family-code-cell col-narrow${position}"></td>`;
            return `<td class="family-code-cell col-narrow${position}"><div class="fc-content"><div class="fc-code">${family.code || dash}</div>${fatherNames ? `<div class="fc-father">${fatherNames}</div>` : ''}</div></td>`;
        };
        const studentsHtml = family.students.map((student) => student.rows.map((r) => renderRow(r, srCounter++, familyCell())).join('')).join('');
        const advanceRowsHtml = advances.map((d) => advanceRowHtml(d, familyCell())).join('');
        if (!siblings && feeCount < 2 && !family.advanceOnly) return studentsHtml + advanceRowsHtml;
        const familyRows = family.students.reduce((list, s) => list.concat(s.rows), []);
        const familyFeesPaid = familyRows.reduce((sum, r) => sum + r.paid, 0);
        const familyDues = familyRows.reduce((sum, r) => sum + r.dues, 0);
        const familyAdvanceSum = advances.reduce((sum, d) => sum + d.amount, 0);
        const familyPaid = familyFeesPaid + familyAdvanceSum;
        const studentChips = siblings ? family.students.map((s) => {
            const sPaid = s.rows.reduce((sum, r) => sum + r.paid, 0);
            const sDues = s.rows.reduce((sum, r) => sum + r.dues, 0);
            return `<span class="ft-chip"><b>${s.name}</b> Paid = ${sPaid.toLocaleString()} <i>|</i> Dues = ${sDues.toLocaleString()}</span>`;
        }).join('') : '';
        const familyBalance = getFamilyBalance ? getFamilyBalance(family.code) : 0;
        return studentsHtml + advanceRowsHtml + `
                    <tr class="family-total">
                        <td colspan="11" class="total-label"><span class="ft-balance">Current Advance Balance <b>${amountOrDash(familyBalance)}</b></span>${studentChips}<span class="ft-label">Family Total =</span></td>
                        <td></td>
                        <td class="align-right col-paid col-num">${fitAmount(familyPaid, 11, 40)}</td>
                        <td class="align-right col-due col-num">${fitAmount(familyDues, 11, 40)}</td>
                    </tr>`;
    };
    const sectionGapHtml = '<tr class="section-gap"><td colspan="14"></td></tr>';
    const rowsHtml = familyGroups.map((family, familyIndex) =>
        familyBlockHtml(family).replace(/<tr class="/g, `<tr class="${familyIndex % 2 === 0 ? 'fam-dark' : 'fam-light'} `)
        + sectionGapHtml
    ).join('');

    const body = `
            <div class="header-section">
                <div class="header-side">
                    ${systemSetting?.school_logo ? `<img src="${systemSetting.school_logo}" class="header-logo" alt="Logo" />` : ''}
                </div>
                <div style="text-align: center; flex: 1;">
                    <h1>${systemSetting?.school_name || 'School Management System'}</h1>
                    <h2>${title}</h2>
                    <div class="filters">
                        ${filtersHtml(filtersRow1)}
                        ${filtersHtml(filtersRow2)}
                    </div>
                </div>
                <div class="header-side">
                    <div class="summary-grid">
                        <div class="summary-card"><span class="summary-label">Total Students</span><span class="summary-value">${amountOrDash(totalStudent)}</span></div>
                        <div class="summary-card"><span class="summary-label">Number Of Invoices</span><span class="summary-value">${amountOrDash(totalUnpaidCount)}</span></div>
                        <div class="summary-card"><span class="summary-label">Family Advance Received</span><span class="summary-value">${amountOrDash(familyAdvanceReceived)}</span></div>
                        <div class="summary-card"><span class="summary-label">Disc (Further Fee + Fine)</span><span class="summary-value">${amountOrDash(totalFeeDiscount + totalFineDiscount)}</span></div>
                        <div class="summary-card"><span class="summary-label">Receiving</span><span class="summary-value">${amountOrDash(feeReceiving)}</span></div>
                        <div class="summary-card"><span class="summary-label">Fee paid by family advance</span><span class="summary-value">${amountOrDash(familyCreditUsed)}</span></div>
                        <div class="summary-card dues"><span class="summary-label">Net Receiving</span><span class="summary-value">${amountOrDash(netReceiving)}</span></div>
                    </div>
                </div>
            </div>

            <div style="overflow: auto; margin-bottom: 11px;">
                <table class="ledger-table">
                    <colgroup>${[2.5, 6, null, null, null, 6.5, 17, 4.4, 5.2, 11, 11, null, null, null].map(w => w === null ? `<col>` : `<col style="width:${w}%">`).join('')}</colgroup>
                    <thead>
                        <tr>
                            <th class="align-center col-narrow">Sr</th>
                            <th class="col-narrow">Family Code</th>
                            <th class="col-student">Student Name</th>
                            <th class="col-title">Fee Title</th>
                            <th>Due Date</th>
                            <th>Paying Date</th>
                            <th><span class="th-row"><span>Mode / Source (User)</span><span class="th-sub">(History)</span></span></th>
                            <th class="align-right col-num">Actual Class Fee</th>
                            <th class="align-right col-num">Fee After DISC</th>
                            <th class="align-right">Further Fee Disc</th>
                            <th class="align-right">Fine</th>
                            <th class="align-right col-total col-num">Total</th>
                            <th class="align-right col-paid col-num">Paid<span class="th-below">(in date range)</span></th>
                            <th class="align-right col-due col-num">This Fee Dues</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${familyGroups.length > 0 ? rowsHtml : `<tr><td colspan="14" class="align-center" style="padding: 17px;">No Records Found!</td></tr>`}
                    </tbody>
                    ${tableRows.length > 0 ? `
                    <tbody>
                        <tr class="grand-total">
                            <td colspan="7">Grand Total</td>
                            <td class="align-right col-num">${fitAmount(rowTotals.actual, 9, 38)}</td>
                            <td class="align-right col-num">${fitAmount(rowTotals.feeAfterDiscount, 9, 45)}</td>
                            <td class="align-right">${amountOrDash(rowTotals.further)}</td>
                            <td class="fine-pair-cell"><div class="fine-pair"><div><span>Disc</span><b>${amountOrDash(rowTotals.fineDiscount)}</b></div><div><span>Apl</span><b>${amountOrDash(rowTotals.fine)}</b></div></div></td>
                            <td class="align-right col-total col-num">${fitAmount(rowTotals.total, 11, 40)}</td>
                            <td class="align-right col-paid col-num">${fitAmount(rowTotals.paid - familyCreditUsed + familyAdvanceReceived, 11, 40)}</td>
                            <td class="align-right col-due col-num">${fitAmount(rowTotals.dues, 13, 40)}</td>
                        </tr>
                    </tbody>` : ''}
                </table>
            </div>
            ${userWiseTableHtml(userRows)}
            <div class="print-footer">
                Generated on: ${formatLedgerDate(new Date())} | Powered by Ai Schooling System.com
            </div>`;

    return `<!DOCTYPE html>
<html>
<head>
    <title>${title}</title>
    <style>${DETAILED_REPORT_CSS}</style>
</head>
<body>
    ${body}
</body>
</html>`;
}

    const buildReportHtml = () => buildDetailedFeeTransactionReportHtml({
        systemSetting: systemSetting,
        sessionName: sessionName,
        campusName: campus_name,
        className: class_name,
        sectionName: section_name,
        typeName: type_name,
        feeMonth: fee_month,
        feeYear: fee_year,
        customFeeName: custom_fee_name,
        startDate: start_date_incomePageFilter,
        endDate: end_date_incomePageFilter,
        receivedByLabel: selectedUsersLabel,
        rows: allStudentData,
        getPaidInRange: getPaidInRange,
        getPrintSegments: getPaymentSegments,
        getModeName: getModeName,
        getSourceName: getSourceName,
        getFamilyAdvance: getFamilyAdvance,
        getFamilyBalance: getFamilyBalance,
        getFamilyFatherName: getFamilyFatherName,
        getDepositFamilyCodes: getDepositFamilyCodes,
        userRows: filteredUserCollectedRows,
        totalStudent: totalStudent,
        totalUnpaidCount: totalUnpaidCount,
        familyAdvanceReceived: familyAdvanceReceived,
        totalFeeDiscount: totalFeeDiscount,
        totalFineDiscount: totalFineDiscount,
        feeReceiving: feeReceiving,
        familyCreditUsed: familyCreditUsed,
        netReceiving: netReceiving,
    });

    /* ================= RENDER: the report is written as the whole page ================= */
    window.addEventListener("load", function () {
        var html = buildReportHtml();
        document.open();
        document.write(html);
        document.close();
        // preview only
        var st = document.createElement("style");
        st.textContent = ".print-btn { position: fixed; top: 12px; right: 16px; z-index: 10; background: #000; color: #fff; border: 1px solid #000; padding: 7px 16px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: Poppins, sans-serif; } @media print { .print-btn { display: none !important; } }";
        document.head.appendChild(st);
        var b = document.createElement("button");
        b.className = "print-btn"; b.textContent = "Print"; b.onclick = function () { window.print(); };
        document.body.appendChild(b);
    });
</script>
</body>
</html>
