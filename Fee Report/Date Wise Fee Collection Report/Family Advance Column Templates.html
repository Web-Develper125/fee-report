<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Family Advance Column - Templates</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; font-family:"Poppins",Arial,sans-serif !important; }
@page { size: A4 portrait; margin: 7mm; }
html, body { background:#fff; color:#000; font-size:9px; line-height:1.2; padding:8px; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
.page-title { font-size:14px; font-weight:700; text-align:center; margin-bottom:2px; }
.page-sub { font-size:9px; text-align:center; color:#444; margin-bottom:10px; border-bottom:1px solid #000; padding-bottom:6px; }
.tpl { margin-bottom:12px; break-inside:avoid; page-break-inside:avoid; }
.tpl-head { display:flex; align-items:baseline; gap:8px; margin-bottom:3px; }
.tpl-no { background:#000; color:#fff; font-size:10px; font-weight:700; padding:1px 7px; }
.tpl-name { font-size:11px; font-weight:700; }
.tpl-note { font-size:8.5px; color:#444; }
table { width:100%; border-collapse:collapse; font-size:10px; font-variant-numeric:tabular-nums; }
thead th { padding:3px 5px; text-align:center; background:#c4c4c4; border:1px solid #000; font-size:9px; font-weight:700; text-transform:uppercase; }
thead th.r { text-align:right; }
td { padding:3px 6px; border:1px solid #999; font-weight:500; }
td.c { text-align:center; } td.r { text-align:right; } td.b { font-weight:700; }
td .sub { display:block; font-size:7.5px; color:#555; font-weight:400; }
tr.grand td { background:#f0f0f0; font-weight:700; border-top:2px solid #999; }
tr.band td { background:#e6e6e6; font-weight:700; font-size:9px; border-top:1px solid #666; border-bottom:1px solid #666; }
.adv-row { display:flex; justify-content:space-between; gap:12px; }
.sub-head { display:flex; justify-content:space-between; gap:12px; font-size:8px; font-weight:700; padding-top:2px; border-top:1px solid #000; margin-top:2px; }
.m { vertical-align:middle; }
.grp { background:#b5b5b5 !important; }
.stack div { display:flex; justify-content:space-between; gap:10px; }
.stack span { font-size:8px; color:#444; }
.print-btn { position:fixed; top:10px; right:14px; background:#000; color:#fff; border:1px solid #000; padding:6px 14px; font-size:11px; font-weight:600; cursor:pointer; }
@media print { .print-btn { display:none !important; } html, body { padding:0; } }
</style>
</head>
<body>
<button class="print-btn" onclick="window.print()">Print</button>
<div class="page-title">Family Advance Column - Templates</div>
<div class="page-sub">Same report, same data. Only the place and the look of the Family Advance column change. Family advance is one merged cell per family, so brothers / sisters never double count.</div>
<div id="out"></div>

<script>
/* ---------- dummy rows (brothers / sisters sit together) ---------- */
var rows = [
    { fam: 'F-101', name: 'Ali Raza',        gr: '12',   disc: 600,  paid: 5400, dues: 4500, rec: 2000, spent: 0 },
    { fam: 'F-102', name: 'Saad Ali',        gr: '25',   disc: 0,    paid: 2850, dues: 0,    rec: 0,    spent: 0 },
    { fam: 'F-105', name: 'Zayan Ali',       gr: '787',  disc: 250,  paid: 3000, dues: 0,    rec: 3000, spent: 1500 },
    { fam: 'F-105', name: 'Rehan Ali',       gr: '1212', disc: 300,  paid: 2750, dues: 5500, rec: 3000, spent: 1500 },
    { fam: 'F-106', name: 'Zain Hassan',     gr: '870',  disc: 0,    paid: 3100, dues: 3100, rec: 0,    spent: 1000 },
    { fam: 'F-106', name: 'Ismail Ahmed',    gr: '1440', disc: 0,    paid: 3100, dues: 0,    rec: 0,    spent: 1000 },
    { fam: 'F-107', name: 'Maryam Noor',     gr: '2536', disc: 200,  paid: 2500, dues: 2800, rec: 0,    spent: 0 }
];
var fmt = function (n) { return Number(n || 0) !== 0 ? Number(n).toLocaleString() : ''; };
var sgn = function (n, s) { return Number(n || 0) !== 0 ? s + Number(n).toLocaleString() : ''; };

/* family groups: size + first row */
var size = {}, seen = {};
rows.forEach(function (r) { size[r.fam] = (size[r.fam] || 0) + 1; });
rows.forEach(function (r, i) { r.sr = i + 1; r.first = !seen[r.fam]; seen[r.fam] = 1; r.size = size[r.fam]; r.bal = r.rec - r.spent; });
var fams = rows.filter(function (r) { return r.first; });
var T = { rec: fams.reduce(function (s, r) { return s + r.rec; }, 0), spent: fams.reduce(function (s, r) { return s + r.spent; }, 0) };
T.bal = T.rec - T.spent;
var tot = { disc: 0, paid: 0, dues: 0 };
rows.forEach(function (r) { tot.disc += r.disc; tot.paid += r.paid; tot.dues += r.dues; });

/* ---------- advance column kinds: each gives header cells, a body renderer and a total renderer ---------- */
var kinds = {
    split: {
        head: function () { return '<th><div>Family Advance</div><div class="sub-head"><span>Received</span><span>Spent</span></div></th>'; },
        cell: function (r) { return '<td class="m" rowspan="' + r.size + '"><div class="adv-row"><span>' + fmt(r.rec) + '</span><span>' + fmt(r.spent) + '</span></div></td>'; },
        total: function () { return '<td><div class="adv-row b"><span>' + fmt(T.rec) + '</span><span>' + fmt(T.spent) + '</span></div></td>'; }, n: 1
    },
    two: {
        head: function () { return '<th class="r">Advance In</th><th class="r">Advance Out</th>'; },
        cell: function (r) { return '<td class="m r" rowspan="' + r.size + '">' + fmt(r.rec) + '</td><td class="m r" rowspan="' + r.size + '">' + fmt(r.spent) + '</td>'; },
        total: function () { return '<td class="r b">' + fmt(T.rec) + '</td><td class="r b">' + fmt(T.spent) + '</td>'; }, n: 2
    },
    stack: {
        head: function () { return '<th>Family Advance</th>'; },
        cell: function (r) { return '<td class="m stack" rowspan="' + r.size + '"><div><span>In</span><b>' + fmt(r.rec) + '</b></div><div><span>Out</span><b>' + fmt(r.spent) + '</b></div></td>'; },
        total: function () { return '<td class="stack"><div><span>In</span><b>' + fmt(T.rec) + '</b></div><div><span>Out</span><b>' + fmt(T.spent) + '</b></div></td>'; }, n: 1
    },
    arrows: {
        head: function () { return '<th>Family Advance<div class="sub-head"><span>&#9650; In</span><span>&#9660; Out</span></div></th>'; },
        cell: function (r) { return '<td class="m" rowspan="' + r.size + '"><div class="adv-row"><span>' + (r.rec ? '&#9650; ' + fmt(r.rec) : '') + '</span><span>' + (r.spent ? '&#9660; ' + fmt(r.spent) : '') + '</span></div></td>'; },
        total: function () { return '<td><div class="adv-row b"><span>&#9650; ' + fmt(T.rec) + '</span><span>&#9660; ' + fmt(T.spent) + '</span></div></td>'; }, n: 1
    },
    net: {
        head: function () { return '<th class="r">Net Advance</th>'; },
        cell: function (r) { var n = r.bal; return '<td class="m r" rowspan="' + r.size + '"><b>' + (n ? (n > 0 ? '+' : '&minus;') + Math.abs(n).toLocaleString() : '') + '</b>' + ((r.rec || r.spent) ? '<span class="sub">' + fmt(r.rec) + ' &minus; ' + fmt(r.spent) + '</span>' : '') + '</td>'; },
        total: function () { return '<td class="r b">' + (T.bal > 0 ? '+' : '&minus;') + Math.abs(T.bal).toLocaleString() + '<span class="sub">' + fmt(T.rec) + ' &minus; ' + fmt(T.spent) + '</span></td>'; }, n: 1
    },
    fraction: {
        head: function () { return '<th class="r">Advance<div class="sub-head"><span>In</span><span>/</span><span>Out</span></div></th>'; },
        cell: function (r) { return '<td class="m r" rowspan="' + r.size + '">' + ((r.rec || r.spent) ? fmt(r.rec || 0) + ' / ' + fmt(r.spent || 0) : '') + '</td>'; },
        total: function () { return '<td class="r b">' + fmt(T.rec) + ' / ' + fmt(T.spent) + '</td>'; }, n: 1
    },
    group3: {
        head: function () { return '<th class="r">Received</th><th class="r">Spent</th><th class="r">Balance</th>'; },
        cell: function (r) { return '<td class="m r" rowspan="' + r.size + '">' + fmt(r.rec) + '</td><td class="m r" rowspan="' + r.size + '">' + fmt(r.spent) + '</td><td class="m r b" rowspan="' + r.size + '">' + (r.bal ? (r.bal > 0 ? '+' : '&minus;') + Math.abs(r.bal).toLocaleString() : '') + '</td>'; },
        total: function () { return '<td class="r b">' + fmt(T.rec) + '</td><td class="r b">' + fmt(T.spent) + '</td><td class="r b">' + (T.bal > 0 ? '+' : '&minus;') + Math.abs(T.bal).toLocaleString() + '</td>'; }, n: 3, group: 'Family Advance'
    },
    family: {
        head: function () { return '<th>Family</th>'; },
        cell: function (r) { return '<td class="m c" rowspan="' + r.size + '"><b>' + r.fam + '</b><span class="sub">In ' + (fmt(r.rec) || '0') + ' &middot; Out ' + (fmt(r.spent) || '0') + '</span></td>'; },
        total: function () { return '<td class="c b">In ' + fmt(T.rec) + ' &middot; Out ' + fmt(T.spent) + '</td>'; }, n: 1
    }
};

/* base columns (no advance) */
var base = [
    { id: 'sr',   th: '<th>Sr #</th>',               td: function (r) { return '<td class="c">' + r.sr + '</td>'; },        tot: function () { return ''; } },
    { id: 'gr',   th: '<th>GR #</th>',               td: function (r) { return '<td class="c">' + r.gr + '</td>'; },        tot: function () { return ''; } },
    { id: 'name', th: '<th>Student Name</th>',       td: function (r) { return '<td>' + r.name + '</td>'; },                tot: function () { return ''; } },
    { id: 'disc', th: '<th class="r">Discount</th>', td: function (r) { return '<td class="r">' + fmt(r.disc) + '</td>'; }, tot: function () { return '<td class="r">' + fmt(tot.disc) + '</td>'; } },
    { id: 'paid', th: '<th class="r">Paid</th>',     td: function (r) { return '<td class="r b">' + fmt(r.paid) + '</td>'; }, tot: function () { return '<td class="r">' + fmt(tot.paid) + '</td>'; } },
    { id: 'dues', th: '<th class="r">Dues</th>',     td: function (r) { return '<td class="r">' + fmt(r.dues) + '</td>'; }, tot: function () { return '<td class="r">' + fmt(tot.dues) + '</td>'; } }
];

/* where the advance goes: after the column with this id ('start' = very first column, 'end' = last) */
function buildTable(kindKey, after) {
    var k = kinds[kindKey];
    var cols = base.slice();
    var idx = after === 'start' ? 0 : after === 'end' ? cols.length : cols.map(function (c) { return c.id; }).indexOf(after) + 1;
    var advCol = { id: 'adv', th: k.head(), td: function (r) { return r.first ? k.cell(r) : ''; }, tot: k.total, group: k.group, n: k.n };
    cols.splice(idx, 0, advCol);
    var head = '';
    if (k.group) {
        var h1 = '', h2 = '';
        cols.forEach(function (c) {
            if (c.id === 'adv') { h1 += '<th class="grp" colspan="' + k.n + '">' + k.group + '</th>'; h2 += c.th; }
            else h1 += c.th.replace('<th', '<th rowspan="2"');
        });
        head = '<tr>' + h1 + '</tr><tr>' + h2 + '</tr>';
    } else head = '<tr>' + cols.map(function (c) { return c.th; }).join('') + '</tr>';
    var body = rows.map(function (r) { return '<tr>' + cols.map(function (c) { return c.td(r); }).join('') + '</tr>'; }).join('');
    /* Grand Total row: the label spans the plain columns before the first total; plain columns after that stay empty */
    var lead = 0; while (lead < cols.length && cols[lead].tot() === '') lead++;
    var cells = '';
    if (lead > 0) cells += '<td colspan="' + lead + '" style="text-align:right;text-transform:uppercase;">Grand Total:</td>';
    for (var j = lead; j < cols.length; j++) {
        var t = cols[j].tot();
        if (j === 0) t = t.replace(/^(<td[^>]*>)/, '$1<span class="sub" style="text-transform:uppercase;">Grand Total</span>');
        cells += t === '' ? '<td></td>' : t;
    }
    var grand = '<tr class="grand">' + cells + '</tr>';
    return '<table><thead>' + head + '</thead><tbody>' + body + grand + '</tbody></table>';
}

/* template 12: no column, a grey band row above each family */
function buildBand() {
    var cols = base.slice(), n = cols.length;
    var head = '<tr>' + cols.map(function (c) { return c.th; }).join('') + '</tr>';
    var body = rows.map(function (r) {
        var band = r.first ? '<tr class="band"><td colspan="' + n + '">Family ' + r.fam + ' &nbsp;&middot;&nbsp; Advance received: ' + (fmt(r.rec) || '0') + ' &nbsp;&middot;&nbsp; Advance spent: ' + (fmt(r.spent) || '0') + '</td></tr>' : '';
        return band + '<tr>' + cols.map(function (c) { return c.td(r); }).join('') + '</tr>';
    }).join('');
    var grand = '<tr class="grand"><td colspan="3" style="text-align:right;text-transform:uppercase;">Grand Total:</td><td class="r">' + fmt(tot.disc) + '</td><td class="r">' + fmt(tot.paid) + '</td><td class="r">' + fmt(tot.dues) + '</td></tr>';
    return '<table><thead>' + head + '</thead><tbody>' + body + grand + '</tbody></table>';
}

var templates = [
    { n: 'Split cell (Received | Spent)', note: 'After Discount. One heading, two sub-headings, one merged cell per family.', html: function () { return buildTable('split', 'disc'); } },
    { n: 'Split cell (Received | Spent)', note: 'Far right. Fees first, advance last.',                                      html: function () { return buildTable('split', 'end'); } },
    { n: 'Split cell (Received | Spent)', note: 'Left, right after Sr #. Advance is the first thing you read.',               html: function () { return buildTable('split', 'sr'); } },
    { n: 'Two plain columns (In / Out)',  note: 'After Discount. Simplest, each number has its own column.',                  html: function () { return buildTable('two', 'disc'); } },
    { n: 'Two plain columns (In / Out)',  note: 'Far right.',                                                                 html: function () { return buildTable('two', 'end'); } },
    { n: 'Stacked In / Out',              note: 'After Student Name. Labels inside the cell, numbers on the right.',           html: function () { return buildTable('stack', 'name'); } },
    { n: 'Arrows (up In, down Out)',      note: 'Far right. Arrow tells the direction, no long words.',                       html: function () { return buildTable('arrows', 'end'); } },
    { n: 'Net advance + breakdown',       note: 'Far right. One bold net number (+ / minus), small "In minus Out" under it.',  html: function () { return buildTable('net', 'end'); } },
    { n: 'Fraction (In / Out)',           note: 'After Discount. Very compact, one short line.',                              html: function () { return buildTable('fraction', 'disc'); } },
    { n: 'Group of 3 (Received, Spent, Balance)', note: 'Far right. A grey group heading, balance in bold.',                  html: function () { return buildTable('group3', 'end'); } },
    { n: 'Group of 3 (Received, Spent, Balance)', note: 'Left, after Sr #.',                                                  html: function () { return buildTable('group3', 'sr'); } },
    { n: 'Family column at the far left',  note: 'Family code with In / Out under it, merged over the children.',              html: function () { return buildTable('family', 'start'); } },
    { n: 'Family band row (no column)',    note: 'A grey line above each family: "Advance received / spent". Table stays narrow.', html: buildBand }
];

document.getElementById('out').innerHTML = templates.map(function (t, i) {
    return '<div class="tpl"><div class="tpl-head"><span class="tpl-no">' + (i + 1) + '</span><span class="tpl-name">' + t.n + '</span><span class="tpl-note">' + t.note + '</span></div>' + t.html() + '</div>';
}).join('');
</script>
</body>
</html>
