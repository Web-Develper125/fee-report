<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Date Wise Fee Collection Report</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; font-family:"Poppins",Arial,sans-serif !important; }
@page { size: A4 portrait; margin: 7mm; }
html, body { background:#fff; color:#000; font-size:9px; line-height:1.2; padding:5px; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
/* Header: logo | school name, title and filters | stat box, one black line under it (same as the Detailed report) */
.header-section { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid #000; padding:0 0 8px; }
.header-section h1 { font-size:17px; font-weight:700; margin-bottom:2px; color:#000; }
.header-section h2 { font-size:12px; font-weight:700; margin-bottom:4px; color:#000; }
.header-side { flex:0 0 190px; }
.header-logo { width:56px; height:56px; object-fit:contain; border-radius:5px; }
.filters { font-size:9px; font-weight:600; line-height:1.5; color:#444; }
.filters-row { display:flex; justify-content:center; flex-wrap:wrap; gap:0 6px; }
.filters b { font-weight:700; color:#000; }
.filters .sep { color:#999; }
/* Stats: one horizontal strip under the header, Paid in a grey box */
.stats-strip { display:grid; grid-template-columns:repeat(var(--stat-count, 5),1fr); border:1.5px solid #000; margin-bottom:8px; }
.stat { padding:5px 6px; text-align:center; border-right:1px solid #000; }
.stat:last-child { border-right:none; }
.stat.net { background:#d9d9d9 !important; }
.stat-label { font-size:7.6px; font-weight:600; text-transform:uppercase; letter-spacing:.2px; color:#000; }
.stat-value { font-size:14px; font-weight:800; margin-top:1px; color:#000; }
.section-title { font-size:12px; font-weight:700; color:#000; text-transform:uppercase; margin-bottom:4px; }
/* Tables: black outer lines, grey header, no stripes */
table { width:100%; border-collapse:collapse; font-size:10.5px; font-variant-numeric:tabular-nums; }
thead { display:table-header-group; }
tr { page-break-inside:avoid; }
thead tr.table-head-row { background:#c4c4c4; }
.table-head-cell { padding:3px 5px; text-align:center; color:#000; background-color:#c4c4c4 !important; font-weight:700; font-size:9.5px; text-transform:uppercase; border:1px solid #000; }
.table-head-cell.right { text-align:right; font-size:9.5px; }
.table-cell { padding:3px 6px; font-size:10.5px; border:1px solid #999; font-weight:500; color:#000; }
.table-cell.right { text-align:right; }
.table-cell.center { text-align:center; }
.table-cell.strong { font-weight:700; }
.date-cell { text-align:center; font-weight:600; white-space:nowrap; }
.zero-dash { color:#888; font-weight:400; }
.no-records { text-align:center; padding:17px; font-size:9px; border:1px solid #999; }
.grand-total-row { background:#f0f0f0; }
.grand-total-label { padding:3px 6px; text-align:right; color:#000; background-color:#f0f0f0 !important; font-weight:700; font-size:10.5px; text-transform:uppercase; border:1px solid #999; border-top:2px solid #999; }
.grand-total-cell { padding:3px 6px; font-weight:700; font-size:10.5px; color:#000; background-color:#f0f0f0 !important; text-align:center; border:1px solid #999; border-top:2px solid #999; }
.grand-total-cell.right { text-align:right; }
.print-footer { margin-top:11px; padding-top:7px; font-size:9px; color:#000; text-align:center; font-weight:700; }
/* preview only */
.print-btn { position:fixed; top:12px; right:16px; background:#000; color:#fff; border:1px solid #000; padding:7px 16px; font-size:11px; font-weight:600; cursor:pointer; }
@media print { .print-btn { display:none !important; } }
/* User Wise Breakdown + footer always at the end of the LAST page: a spacer (set by the script below) fills the gap above it */
.bottom { break-inside:avoid; page-break-inside:avoid; margin-top:10px; }
#pageSpacer { height:0; }
.page-measure { position:absolute; visibility:hidden; left:0; top:0; width:1px; height:281mm; }
/* same layout the printer uses, applied only while measuring */
body.measuring { padding:0 !important; }
body.measuring .page { width:196mm !important; margin:0 !important; }
@media print { html, body { padding:0 !important; } }
.adv-row { display:flex; justify-content:space-between; gap:14px; }
.adv-see { color:#555; font-size:8.5px; text-align:center; }
.note { font-size:8px; font-weight:500; color:#444; margin-top:4px; }
.stat-value { font-size:12.5px !important; }
.adv-row { display:flex; justify-content:space-between; gap:14px; }
.adv-merge { vertical-align:middle; }
.mode-merge { vertical-align:middle; font-weight:700; }
.table-cell .sub { font-size:8px; color:#555; font-weight:400; }
.col-student .sub { font-size:8px; color:#555; font-weight:400; }
.table-cell.col-name { text-align:left; }
.table-cell.sm { font-size:9.5px; }
</style>
</head>
<body>
<script>
/* ===== DUMMY DATA (same shape as the page's state in Fee Income Report NEW.jsx) ===== */
var systemSetting = {
    school_name: 'Ai Model School System',
    school_logo: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="71" height="71"><circle cx="35.5" cy="35.5" r="33" fill="#f0f0f0" stroke="#999" stroke-width="2"/><text x="35.5" y="43" font-size="22" font-weight="700" text-anchor="middle" fill="#333" font-family="Arial">AI</text></svg>')
};
var session_id = "All";
var sessionName = "All";
var campus_name = "All";
var class_name = "All";
var section_name = "All";
var use_date = "2026-10-19";
var selectedUser = "All";
var FILTER_ALL = "All";
var showPayableDues = true;   /* date = Today, no User / Mode filter */

/* one entry per student: payments (amount, who, mode / source, time) and discounts (amount, who), plus the dues still unpaid */
var dummyStudents = [
    { gr: 'BSS-STD-130', fam: 'F-103', name: 'Hamza Tariq',     fname: 'Tariq Mehmood',  campus: 'Main Campus', cls: 'Class 7', sec: 'B', dues: 3000, pay: [{ a: 3000, by: 'ali',   m: 'Cash / General',               t: '2026-10-19T10:05:00' }, { a: 2000, by: 'usman', m: 'Easypaisa / Office Wallet', t: '2026-10-19T12:20:00' }], disc: [{ a: 300, by: 'admin' }] },
    { gr: 'BSS-STD-130', fam: 'F-103', name: 'Hamza Tariq',     fname: 'Tariq Mehmood',  campus: 'Main Campus', cls: 'Class 7', sec: 'B', dues: 3000, pay: [{ a: 3000, by: 'ali',   m: 'Cash / General',               t: '2026-10-19T10:05:00' }, { a: 2000, by: 'usman', m: 'Easypaisa / Office Wallet', t: '2026-10-19T12:20:00' }], disc: [{ a: 300, by: 'admin' }] },
    { gr: 'BSS-STD-209', fam: 'F-104', name: 'Zainab Fatima',   fname: 'Ahmed Fatima',   campus: 'City Campus', cls: 'Class 3', sec: 'C', dues: 6000, pay: [{ a: 1500, by: 'usman', m: 'Cash / General',               t: '2026-10-19T10:40:00' }], disc: [] },
    { gr: 'BSS-STD-787', fam: 'F-105', name: 'Zayan Ali',       fname: 'Muhammad Yousaf',campus: 'City Campus', cls: 'Class 8', sec: 'A', dues: 0,    pay: [{ a: 3000, by: 'ali',   m: 'Bank Transfer / Meezan Bank',  t: '2026-10-19T11:15:00' }], disc: [{ a: 150, by: 'admin' }, { a: 100, by: 'usman' }] },
    { gr: 'BSS-STD-870', fam: 'F-106', name: 'Zain Hassan',     fname: 'Muhammad Ayub',  campus: 'City Campus', cls: 'Class 8', sec: 'A', dues: 3100, pay: [{ a: 3100, by: 'ali',  m: 'Cash / General',               t: '2026-10-19T11:50:00' }], disc: [] },
    { gr: 'BSS-STD-1212', fam: 'F-105',name: 'Rehan Ali',       fname: 'Muhammad Danish',campus: 'Main Campus', cls: 'Class 6', sec: 'B', dues: 5500, pay: [{ a: 2750, by: 'usman', m: 'Easypaisa / Office Wallet',    t: '2026-10-19T12:35:00' }], disc: [{ a: 300, by: 'admin' }] },
    { gr: 'BSS-STD-1440', fam: 'F-106',name: 'Ismail Ahmed',    fname: 'Muhammad Anwar', campus: 'Main Campus', cls: 'Class 9', sec: 'B', dues: 0,    pay: [{ a: 3100, by: 'admin',  m: 'Cash / General',               t: '2026-10-19T13:05:00' }], disc: [] },
    { gr: 'BSS-STD-2536', fam: 'F-107',name: 'Maryam Noor',     fname: 'Noor Hussain',   campus: 'City Campus', cls: 'Class 4', sec: 'A', dues: 2800, pay: [{ a: 2500, by: 'ali',      m: 'Cash / Front Desk',               t: '2026-10-19T13:40:00' }], disc: [{ a: 200, by: 'usman' }] }
];

/* family advance of the day: ONE entry per family (never per student), so brothers / sisters can not double count */
var familyAdvanceRows = [
    { fam: 'F-101', father: 'Raza Khan',        rec: 2000, spent: 0,    mode: 'Cash / General',              by: 'ali' },
    { fam: 'F-105', father: 'Muhammad Yousaf',  rec: 3000, spent: 1500, mode: 'Bank Transfer / Meezan Bank', by: 'usman' },
    { fam: 'F-106', father: 'Muhammad Ayub',    rec: 0,    spent: 1000, mode: '',                            by: '' }
];

/* ===== SAME CODE AS Fee Income Report NEW.jsx (helpers) ===== */
var GR_COLLATOR_SORT = function (a, b) {
    return String((a && a.gr) == null ? "" : a.gr).localeCompare(String((b && b.gr) == null ? "" : b.gr), undefined, { numeric: true, sensitivity: "base" });
};
var formatDateTime = function (value) {
    if (!value) return null;
    var date = new Date(value);
    if (isNaN(date.getTime())) return null;
    var dateString = date.toLocaleDateString("pt-PT");
    if (date.getUTCHours() === 0 && date.getUTCMinutes() === 0 && date.getUTCSeconds() === 0) return dateString;
    var timeString = date.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: true });
    return dateString + " " + timeString;
};
var getPlainGr = function (gr) { return String(gr == null ? "" : gr).replace(/\D/g, "") || String(gr == null ? "" : gr); };

/* group the dummy data into the page's studentRows (same fields as the useEffect in the page) */
var studentRows = (function () {
    var rows = dummyStudents.map(function (s) {
        var g = { gr: s.gr, fam: s.fam, name: s.name, fname: s.fname, campus: s.campus, className: s.cls, section: s.sec, payable: 0, paid: 0, discount: 0, dues: s.dues, userLines: [], discountLines: [], modeLines: new Map(), paymenthistoryLine: new Map(), latestDate: null };
        s.pay.forEach(function (p) {
            var date = new Date(p.t);
            g.paid += p.a;
            g.userLines.push({ amount: p.a, by: p.by || "Unknown", date: date });
            if (!g.modeLines.has(p.m)) g.modeLines.set(p.m, { label: p.m, amount: 0 });
            g.modeLines.get(p.m).amount += p.a;
            g.paymenthistoryLine.set(String(g.paymenthistoryLine.size), { amount: p.a, label: p.m, user: p.by || "Unknown", date: date });
            if (!g.latestDate || date > g.latestDate) g.latestDate = date;
        });
        s.disc.forEach(function (d) {
            g.discount += d.a;
            g.discountLines.push({ amount: d.a, by: d.by || "Unknown", date: new Date(use_date + 'T09:00:00') });
            if (!g.latestDate) g.latestDate = new Date(use_date + 'T09:00:00');
        });
        g.payable = g.dues + g.paid + g.discount;
        return g;
    });
    /* brothers / sisters of one family sit together (family order = lowest GR of the family, then GR inside the family),
       so the family advance can be ONE merged cell over all of them: it is never repeated, so it can never double count */
    rows.sort(GR_COLLATOR_SORT);
    var famOrder = {};
    rows.forEach(function (g) { var k = g.fam || ('__' + g.gr); if (famOrder[k] === undefined) famOrder[k] = Object.keys(famOrder).length; g.famKey = k; });
    rows.sort(function (a, b) { return (famOrder[a.famKey] - famOrder[b.famKey]) || GR_COLLATOR_SORT(a, b); });
    var famCount = {};
    rows.forEach(function (g) { famCount[g.famKey] = (famCount[g.famKey] || 0) + 1; });
    var seenFam = {};
    return rows.map(function (g, index) {
        g.sr = index + 1;
        g.famSize = famCount[g.famKey];
        g.famFirst = !seenFam[g.famKey];
        seenFam[g.famKey] = true;
        var a = familyAdvanceRows.filter(function (r) { return r.fam === g.fam; })[0] || { rec: 0, spent: 0 };
        g.advRec = a.rec; g.advSpent = a.spent;
        return g;
    });
})();
var totalStudents = studentRows.length;
var totalPayable = studentRows.reduce(function (s, r) { return s + r.payable; }, 0);
var totalPaid = studentRows.reduce(function (s, r) { return s + r.paid; }, 0);
var totalDiscount = studentRows.reduce(function (s, r) { return s + r.discount; }, 0);
var totalDues = studentRows.reduce(function (s, r) { return s + r.dues; }, 0);
var totalAdvRec = studentRows.reduce(function (s, r) { return s + (r.famFirst ? r.advRec : 0); }, 0);      /* each family counted once */
var totalAdvSpent = studentRows.reduce(function (s, r) { return s + (r.famFirst ? r.advSpent : 0); }, 0);

/* zero shows nothing (no dash), same as the Date Wise Fee Transaction report */
var amountOrDash = function (value) { return Number(value || 0) !== 0 ? Number(value).toLocaleString() : ''; };

/* ===== SAME CODE AS getUserWisePrintTableHtml (User Wise + Mode / Source Wise Breakdown) ===== */
var getUserWisePrintTableHtml = () => {
    // ── User Wise Breakdown ──────────────────────────────────────────
    const userPaidMap = new Map();     // name -> paid amount
    const userDiscountMap = new Map(); // name -> discount amount
    studentRows.forEach((row) => {
        row.userLines.forEach((l) => {
            userPaidMap.set(l.by, (userPaidMap.get(l.by) || 0) + l.amount);
        });
        row.discountLines.forEach((l) => {
            userDiscountMap.set(l.by, (userDiscountMap.get(l.by) || 0) + l.amount);
        });
    });

    const allUserNames = new Set([...userPaidMap.keys(), ...userDiscountMap.keys()]);
    const userRows = [...allUserNames]
        .map((name) => ({
            name,
            paid: userPaidMap.get(name) || 0,
            discount: userDiscountMap.get(name) || 0,
        }))
        .sort((a, b) => b.paid - a.paid);

    const userGrandTotalPaid = userRows.reduce((sum, r) => sum + r.paid, 0);
    const userGrandTotalDiscount = userRows.reduce((sum, r) => sum + r.discount, 0);

    const userRowsHtml = userRows.length > 0
        ? userRows.map((r) => `
            <tr>
                <td class="table-cell">${r.name}</td>
                <td class="table-cell right">${amountOrDash(r.discount)}</td>
                <td class="table-cell right strong">${amountOrDash(r.paid)}</td>
            </tr>`).join('')
        : `<tr><td colspan="3" class="no-records">No Records Found!</td></tr>`;

    // ── Mode/Source Wise Breakdown ───────────────────────────────────
    const modeMap = new Map(); // label -> amount
    studentRows.forEach((row) => {
        [...row.modeLines.values()].forEach((m) => {
            modeMap.set(m.label, (modeMap.get(m.label) || 0) + m.amount);
        });
    });
    // "Cash / General" -> mode "Cash", source "General" (a mode with no source has an empty source)
    const modeGroups = new Map();     // mode -> { total, sources: Map(source -> amount) }
    modeMap.forEach((amt, label) => {
        const parts = String(label).split(' / ');
        const mode = parts[0] || '-';
        const source = parts.slice(1).join(' / ');
        if (!modeGroups.has(mode)) modeGroups.set(mode, { mode, total: 0, sources: new Map() });
        const g = modeGroups.get(mode);
        g.total += amt;
        g.sources.set(source, (g.sources.get(source) || 0) + amt);
    });
    const modeList = [...modeGroups.values()].sort((x, y) => y.total - x.total);
    const modeGrandTotal = modeList.reduce((sum, g) => sum + g.total, 0);

    // the Mode cell is merged (rowspan) over all of its sources
    const modeRowsHtml = modeList.length > 0
        ? modeList.map((g) => {
            const sources = [...g.sources.entries()].sort((x, y) => y[1] - x[1]);
            return sources.map(([source, amt], i) => `
            <tr>
                ${i === 0 ? `<td class="table-cell mode-merge" rowspan="${sources.length}">${g.mode}</td>` : ""}
                <td class="table-cell">${source}</td>
                <td class="table-cell right strong">${amountOrDash(amt)}</td>
            </tr>`).join('');
        }).join('')
        : `<tr><td colspan="3" class="no-records">No Records Found!</td></tr>`;

    return `
        <div class="section-title">User Wise Breakdown</div>
        <table>
            <thead>
                <tr class="table-head-row">
                    <th class="table-head-cell">User</th>
                    <th class="table-head-cell right">Discount</th>
                    <th class="table-head-cell right">Received</th>
                </tr>
            </thead>
            <tbody>
                ${userRowsHtml}
                ${userRows.length > 0 ? `
                <tr class="grand-total-row">
                    <td class="grand-total-label">Grand Total:</td>
                    <td class="grand-total-cell right">${amountOrDash(userGrandTotalDiscount)}</td>
                    <td class="grand-total-cell right">${amountOrDash(userGrandTotalPaid)}</td>
                </tr>` : ""}
            </tbody>
        </table>

        <div class="section-title" style="margin-top: 14px;">Mode / Source Wise Breakdown</div>
        <table>
            <thead>
                <tr class="table-head-row">
                    <th class="table-head-cell">Mode</th>
                    <th class="table-head-cell">Source</th>
                    <th class="table-head-cell right">Amount</th>
                </tr>
            </thead>
            <tbody>
                ${modeRowsHtml}
                ${modeList.length > 0 ? `
                <tr class="grand-total-row">
                    <td class="grand-total-label" colspan="2">Grand Total:</td>
                    <td class="grand-total-cell right">${amountOrDash(modeGrandTotal)}</td>
                </tr>` : ""}
            </tbody>
        </table>
    `;
};

/* ===== SAME CODE AS handlePrintReport (report html) ===== */
var rangeDate = function (value) { return new Date(value + 'T00:00:00').toLocaleDateString("pt-PT"); };
var userLabel = selectedUser === FILTER_ALL ? "All" : selectedUser;
var filtersRow1 = [['Session', sessionName], ['Campus', campus_name], ['Class', class_name], ['Section', section_name]];
var filtersRow2 = [['Date', rangeDate(use_date)], ['User', userLabel]];
var filtersHtml = function (list) { return '<div class="filters-row">' + list.map(function (p) { return '<span>' + p[0] + ': <b>' + p[1] + '</b></span>'; }).join('<span class="sep">&middot;</span>') + '</div>'; };

var payableTh = showPayableDues ? `<th class="table-head-cell right">Payable</th>` : "";
var duesTh = showPayableDues ? `<th class="table-head-cell right">Dues</th>` : "";
var payableTd = (row) => showPayableDues ? `<td class="table-cell right">${amountOrDash(row.payable)}</td>` : "";
var advTh = `<th class="table-head-cell">Family Advance<div class="adv-row"><span>Received</span><span>Spent</span></div></th>`;
var advTd = (row) => row.famFirst
    ? `<td class="table-cell adv-merge" rowspan="${row.famSize}"><div class="adv-row"><span>${amountOrDash(row.advRec)}</span><span>${amountOrDash(row.advSpent)}</span></div></td>`
    : "";
var duesTd = (row) => showPayableDues ? `<td class="table-cell right">${amountOrDash(row.dues)}</td>` : "";
var colCount = 7 + (showPayableDues ? 2 : 0);

var rowsHtml = studentRows?.length > 0
    ? studentRows.map((row, index) => `
        <tr>
            <td class="table-cell center">${row.sr}</td>
            <td class="table-cell center">${getPlainGr(row.gr)}</td>
            <td class="table-cell col-name col-student">
                <div style="font-weight: 700;">${row.name}</div>
                <div class="sub">${row.fname}</div>
            </td>
            <td class="table-cell center sm">${formatDateTime(row.latestDate) || '-'}</td>
            ${payableTd(row)}
            <td class="table-cell right">${amountOrDash(row.discount)}</td>
            ${advTd(row)}
            <td class="table-cell right strong">${amountOrDash(row.paid)}</td>
            ${duesTd(row)}
        </tr>`).join('')
    : `<tr><td colspan="${colCount}" class="no-records">No Records Found!</td></tr>`;

var grandRowHtml = studentRows.length > 0 ? `
        <tr class="grand-total-row">
            <td class="grand-total-label" colspan="4">Grand Total:</td>
            ${showPayableDues ? `<td class="grand-total-cell right">${amountOrDash(totalPayable)}</td>` : ""}
            <td class="grand-total-cell right">${amountOrDash(totalDiscount)}</td>
            <td class="grand-total-cell"><div class="adv-row"><span>${amountOrDash(totalAdvRec)}</span><span>${amountOrDash(totalAdvSpent)}</span></div></td>
            <td class="grand-total-cell right">${amountOrDash(totalPaid)}</td>
            ${showPayableDues ? `<td class="grand-total-cell right">${amountOrDash(totalDues)}</td>` : ""}
        </tr>` : "";

var statCount = 3 + (showPayableDues ? 2 : 0) + 2;
var reportBody = `
<div class="page" style="--stat-count: ${statCount};">
    <div class="header-section">
        <div class="header-side">
            ${systemSetting?.school_logo ? `<img src="${systemSetting.school_logo}" class="header-logo" alt="Logo" />` : ''}
        </div>
        <div style="text-align: center; flex: 1;">
            <h1>${systemSetting?.school_name || 'School Management System'}</h1>
            <h2>Date Wise Fee Collection Report</h2>
            <div class="filters">
                ${filtersHtml(filtersRow1)}
                ${filtersHtml(filtersRow2)}
            </div>
        </div>
        <div class="header-side"></div>
    </div>

    <div class="stats-strip">
        <div class="stat"><div class="stat-label">Total Students</div><div class="stat-value">${totalStudents}</div></div>
        ${showPayableDues ? `<div class="stat"><div class="stat-label">Total Payable</div><div class="stat-value">Rs. ${totalPayable.toLocaleString()}</div></div>` : ""}
        <div class="stat"><div class="stat-label">Total Discount</div><div class="stat-value">Rs. ${totalDiscount.toLocaleString()}</div></div>
        <div class="stat net"><div class="stat-label">Total Paid</div><div class="stat-value">Rs. ${totalPaid.toLocaleString()}</div></div>
        ${showPayableDues ? `<div class="stat"><div class="stat-label">Total Dues</div><div class="stat-value">Rs. ${totalDues.toLocaleString()}</div></div>` : ""}
        <div class="stat"><div class="stat-label">Advance Receiving</div><div class="stat-value">Rs. ${totalAdvRec.toLocaleString()}</div></div>
        <div class="stat"><div class="stat-label">Advance Spent</div><div class="stat-value">Rs. ${totalAdvSpent.toLocaleString()}</div></div>
    </div>

    <table id="mainTable">
        <thead>
            <tr class="table-head-row">
                <th class="table-head-cell">Sr #</th>
                <th class="table-head-cell">GR #</th>

/* PIN THE USER WISE / MODE WISE BREAKDOWN TO THE BOTTOM OF THE LAST PRINTED PAGE (same method as the Family Advance Ledger report) */
function fitBottomBlock() {
    var spacer = document.getElementById("pageSpacer");
    var block = document.getElementById("bottomBlock");
    var table = document.getElementById("mainTable");
    var page = document.querySelector(".page");
    spacer.style.height = "0px";
    document.body.classList.add("measuring");
    var pageH = document.getElementById("pageMeasure").getBoundingClientRect().height;
    var pageTop = page.getBoundingClientRect().top;
    var theadH = table.querySelector("thead").getBoundingClientRect().height;
    var rows = table.querySelectorAll("tbody tr");
    // walk the rows like the printer does: a row that does not fit moves to the next page,
    // and the table header is repeated at the top of that page
    var shift = 0;
    for (var i = 0; i < rows.length; i++) {
        var rect = rows[i].getBoundingClientRect();
        var top = rect.top - pageTop + shift;
        var bottom = rect.bottom - pageTop + shift;
        var pg = Math.floor(top / pageH);
        if (bottom > (pg + 1) * pageH) { shift += (pg + 1) * pageH + theadH - top; }
    }
    var contentEnd = spacer.getBoundingClientRect().top - pageTop + shift;
    var blockH = block.getBoundingClientRect().height;
    var pages = Math.max(1, Math.ceil((contentEnd + blockH) / pageH));
    var spare = pages * pageH - contentEnd - blockH - 20;   // 20px safety
    spacer.style.height = Math.max(0, spare) + "px";
    document.body.classList.remove("measuring");
}
function clearBottomBlock() { document.getElementById("pageSpacer").style.height = "0px"; }
window.addEventListener("beforeprint", fitBottomBlock);
window.addEventListener("afterprint", clearBottomBlock);
</script>
