                }

                }
                .student-report-page {
                    page-break-after: always;
                    break-after: page;
                }

                }

                    align-items: center;

                .header-section h1 {
                    font-size: 17px;
                    font-weight: 700;
                    margin-bottom: 2px;
                    color: black;
                }
                .header-section h2 {
                    font-size: 12px;
                    font-weight: 700;
                    margin-bottom: 4px;
                    color: black;
                }
                .header-logo {

                    object-fit: contain;
                    border-radius: 5px;
                }

                th { text-align: center; font-size: 9px; font-weight: 700; padding: 3px 1px; border-bottom: 3px double #000; color: black; }

                .hist-no { flex: none; font-size: 7px; line-height: 12px; }
                .hist-sub { font-size: 8px; font-weight: 600; }   /* old: bold number (1. 2. 3.) */

                .top-left .info-grid { flex: 1; }
                .group-summary { display: flex; border: 1px solid #000; }   /* old: a separate line under the whole top band (margin: -2px 0 8px) */

                .group-label { font-size: 8px; font-weight: 600; text-transform: uppercase; }
                .group-value { font-size: 11px; font-weight: 700; }
                .fine-legend { margin: -2px 0 4px; font-size: 8px; font-weight: 600; color: #000; }
                .sign-row { display: flex; justify-content: space-between; gap: 30px; margin: 34px 0 10px; }

                .page-measure { position: absolute; visibility: hidden; height: 196mm; width: 1px; }

                body.measuring .student-report-page { width: calc(283mm - 10px) !important; }
                /* ---- Family report ---- */
                .section-heading { font-size: 11px; font-weight: 700; text-transform: uppercase; margin: 0 0 4px; }
                .family-info-grid { grid-template-columns: repeat(3, 1fr); }

                .top-left .family-info-grid { align-self: stretch; flex: none; }
                .children-table { margin-bottom: 10px; }
                .student-section { margin-bottom: 10px; }
                .student-title { display: flex; gap: 8px; font-size: 11px; font-weight: 700; margin: 0 0 4px; page-break-after: avoid; break-after: avoid; }
                .student-title .r { margin-left: auto; text-align: right; }
    /* preview only */
    .print-btn { position: fixed; top: 12px; right: 16px; background: #000; color: #fff; border: 1px solid #000; padding: 7px 16px; font-size: 11px; font-weight: 600; cursor: pointer; }
    @media print { .print-btn { display: none !important; } }
</style>

    /* ================= SAME LOGIC AS Fee Payment.jsx ================= */
    function getModeName(id) {
        for (var i = 0; i < paymentChannels.length; i++) if (paymentChannels[i]._id === id) return paymentChannels[i].mode_name;
        return "";
    }
    function getSourceName(id) {
        for (var i = 0; i < paymentChannels.length; i++)
            for (var j = 0; j < paymentChannels[i].sources.length; j++) if (paymentChannels[i].sources[j]._id === id) return paymentChannels[i].sources[j].source;
        return "";
    }
    function toDateCA(v) { return v ? new Date(v).toLocaleDateString("en-CA") : ""; }
    function isFeeOverdue(o) {
        var due = toDateCA(o.dueDate);
        if (!due) return false;
        if (o.feeStatus === "Paid") return toDateCA(o.payingDate) > due;
        if (o.feeStatus === "Clear") return toDateCA(o.clearFeeDate) > due;
        return toDateCA(o.compareDate) > due;
    }

    // Build the rows of one student exactly like getFeePaymentData does
    var today = new Date().toLocaleDateString("en-CA");
    var statusOrder = { Unpaid: 1, Paid: 2, Clear: 3 };
    function buildFeeRows(studentDues, student) {
        var totalData = [];
        studentDues.monthlyFee.forEach(function (mf) {
            mf.fees.forEach(function (e) {
                var due = isFeeOverdue({ dueDate: e.due_date, compareDate: today, feeStatus: e.fee_status, payingDate: e.paying_date, clearFeeDate: e.clear_fee_date });
                totalData.push({
                    student: student,
                    title: "Fee Of " + e.fee_month + " " + e.fee_year, fee_month: e.fee_month, fee_year: e.fee_year, fee_generation_date: new Date(e.fee_generation_date), due: due, due_date: e.due_date,
                    actual_fee: e.actual_monthly_fee, discount: e.monthly_fee_discount, fee_after_discount: e.monthly_fee_after_discount, fine: e.late_fine,
                    total: due ? e.monthly_fee_after_discount + e.late_fine : e.monthly_fee_after_discount,
                    dues: (due ? e.monthly_fee_after_discount + e.late_fine : e.monthly_fee_after_discount) - e.paid_amount,
                    status: e.fee_status, paid_amount: e.paid_amount, partial_payment_history: e.partial_payment_history, paying_date: e.paying_date,
                    payment_method: e.payment_method, further_discount_history: e.further_discount_history, late_fee_fine_discount_history: e.late_fee_fine_discount_history,
                    payment_mode_id: e.payment_mode_id, payment_mode_source_id: e.payment_mode_source_id, payment_recieved_by: e.payment_recieved_by
                });
            });
        });
        studentDues.customFee.forEach(function (e) {
            var due = isFeeOverdue({ dueDate: e.custom_fee_due_date, compareDate: today, feeStatus: e.custom_fee_status, payingDate: e.paying_date, clearFeeDate: e.clear_fee_date });
            totalData.push({
                student: student,
                title: e.custom_fee_name, fee_generation_date: new Date(e.custom_fee_generate_date), due: due, due_date: e.custom_fee_due_date,
                actual_fee: e.actual_custom_fee, discount: e.custom_fee_discount, fee_after_discount: e.custom_fee_after_discount, fine: e.custom_fee_fine,
                paid_amount: e.paid_amount,
                total: due ? e.custom_fee_after_discount + e.custom_fee_fine : e.custom_fee_after_discount,
                dues: (due ? e.custom_fee_after_discount + e.custom_fee_fine : e.custom_fee_after_discount) - e.paid_amount,
                status: e.custom_fee_status, partial_payment_history: e.partial_payment_history, paying_date: e.paying_date, payment_method: e.payment_method,
                further_discount_history: e.further_discount_history, late_fee_fine_discount_history: e.late_fee_fine_discount_history,
                payment_mode_id: e.payment_mode_id, payment_mode_source_id: e.payment_mode_source_id, payment_recieved_by: e.payment_recieved_by
            });
        });
        totalData.sort(function (a, b) {
            var diff = new Date(b.fee_generation_date) - new Date(a.fee_generation_date);
            return diff !== 0 ? diff : statusOrder[a.status] - statusOrder[b.status];
        });
        return totalData;
    }


    /* ================= SAME CODE AS Fee Payment.jsx (formatTime / formatDateTime) ================= */
    function formatTime(isoDate) {
        if (!isoDate) return null;
    
        const date = new Date(isoDate);
    
        if (isNaN(date.getTime())) return null;
    
        // Don't return anything for 00:00:00
        if (
            date.getUTCHours() === 0 &&
            date.getUTCMinutes() === 0 &&
            date.getUTCSeconds() === 0
        ) {
            return null;
        }
    
        return date.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: true,
        });
    }
    
    function formatDateTime(isoDate) {
        if (!isoDate) return null;
    
        const date = new Date(isoDate);
        if (isNaN(date.getTime())) return null;
    
        const dateString = date.toLocaleDateString("pt-PT");
        const timeString = formatTime(isoDate);
        return timeString ? `${dateString} ${timeString}` : dateString;
    }
    
    

    /* ================= SAME CODE AS handlePrintReport (design copied as it is) ================= */
    // one entry per sibling: the sibling + that sibling's fee rows
    var familyPages = familyInfo.students.map(function (st, i) { return { studentData: st, feeData: buildFeeRows(i === 0 ? studentDues1 : studentDues2, st) }; });
    var LEDGER_COLS = '<col style="width:3%"><col style="width:11%"><col style="width:7%"><col style="width:11%"><col style="width:16.5%"><col style="width:4.5%"><col style="width:5.5%"><col style="width:13%"><col style="width:12.5%"><col style="width:5%"><col style="width:5%"><col style="width:5.5%">';
        const getModeSourceStr = (i) => {
            const segments = [];

            if (i?.partial_payment_history?.length > 0) {
                segments.push(...i.partial_payment_history.map(p => ({
                    amount: p.amount,

                    date: p.date,
                    source_id: p.payment_mode_source_id,
                    recieved_by: p.payment_recieved_by,
                    type: 'partial'
                })));
            }

            const partialSum = i?.partial_payment_history?.reduce((sum, p) => sum + (p.amount || 0), 0) || 0;
            const quickPayAmount = (i.paid_amount || 0) - partialSum;
            if (quickPayAmount > 0) {
                segments.push({
                    amount: quickPayAmount,
                    mode_id: i.payment_mode_id,
                    date: i.paying_date,
                    source_id: i.payment_mode_source_id,
                    recieved_by: i.payment_recieved_by,
                    type: 'quick'
                });
            }

            if (segments.length === 0) {
                const mode = i.payment_mode_id ? getModeName(i.payment_mode_id) : '-';
                const source = i.payment_mode_source_id ? getSourceName(i.payment_mode_source_id) : '';
                return `${mode}${source ? ` / ${source}` : ''} ${i.payment_recieved_by ? `(${i.payment_recieved_by})` : ''}`;
            }

            if (segments.length === 1 && segments[0].type === 'quick') {
                const mode = segments[0].mode_id ? getModeName(segments[0].mode_id) : '-';
                const source = segments[0].source_id ? getSourceName(segments[0].source_id) : '';
                return `${mode}${source ? ` / ${source}` : ''} ${segments[0].recieved_by ? `(${segments[0].recieved_by})` : ''}`;
            }

            // Each history: amount = mode / source on the first line, the date, time and user on a small second line,
            // with a small arrow sign in front when there are several histories:
            //   ► 100 = Family Advance / Bank
            //     01 Oct 2026 2:16 PM | DEMO
            // old: one text line per history: 100 = Family Advance / Bank (01 Oct 2026 2:16 PM) (DEMO)
            return segments.map((seg) => {
                const mode = seg.mode_id ? getModeName(seg.mode_id) : '-';
                const source = seg.source_id ? getSourceName(seg.source_id) : '';
                const sub = [seg.date ? formatLedgerDateText(seg.date) : '', seg.recieved_by || ''].filter(Boolean).join(' | ');
                // the arrow is shown on every partial payment, also when there is only one partial payment (old: only when there were several).
                // A fee paid in one go (quick payment only) never gets here: it keeps the simple one-line text above, without an arrow.
                return `<div class="hist-item"><span class="hist-no">&#9658;</span><span>${seg.amount} = ${mode}${source ? ` / ${source}` : ''}${sub ? `<br/><small class="hist-sub">${sub}</small>` : ''}</span></div>`;
            }).join('');
        };

        // Discount histories (further discount / fine discount), compact: "dis 1000" on the first line, the date, time and user
        // on a small second line, and a small arrow in front of each one when there are several.
        // old: one text line per history: dis 1000 (01 Oct 2026 2:16 PM) (DEMO)
        const renderDiscountHistory = (history) => {
            // "dis 40  20 Sept 2026" and "2:20 PM | DEMO" are two groups that never split inside: in a wide column they share one line,
            // in a narrow column the second group moves to a small second line.
            // the arrow sign is shown on every history, also when there is only one (old: only when there were several)
            // format: dis = 1000, 01 Oct 2026 (old: dis 1000  01 Oct 2026)
            // old: dis 40 / date / time / user wrapped anywhere
            return history.map(entry => {
                const d = entry.date ? new Date(entry.date) : null;
                const hasDate = d && !isNaN(d.getTime());
                const midnight = hasDate && d.getUTCHours() === 0 && d.getUTCMinutes() === 0 && d.getUTCSeconds() === 0;   // no time stored
                const time = hasDate && !midnight ? d.toLocaleTimeString("en-US", { hour: 'numeric', minute: '2-digit', hour12: true }) : '';
                const sub = [time, entry.discount_by || ''].filter(Boolean).join(' | ');
                return `<div class="hist-item"><span class="hist-no">&#9658;</span><span><span class="nowrap">dis = ${entry.amount}${hasDate ? `, <small class="hist-sub">${formatLedgerDate(entry.date)}</small>` : ''}</span>${sub ? ` <small class="hist-sub nowrap">${sub}</small>` : ''}</span></div>`;
            }).join('');
        };

        const getAmountDateHistoryStr = (history) => {
            if (!history?.length) return null;
            return renderDiscountHistory(history);
        };

        const getFinePrintStr = (item, markApplied = false) => {
            const fineHistory = item.late_fee_fine_discount_history || [];
            const currentFine = Number(item.fine || 0).toLocaleString();

            if (fineHistory.length > 0) {
                const totalFineDiscount = fineHistory.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
                const fineSteps = [];
                let runningFine = (item.fine || 0) + totalFineDiscount;

                fineSteps.push(runningFine);
                fineHistory.forEach(h => {
                    runningFine -= Number(h.amount || 0);
                    fineSteps.push(runningFine);
                });

                const formatDashDate = (date) => {
                    if (!date) return '-';
                    // new format: day, short month name, year. old: 01/10/2026 (dd/mm/yyyy)
                    return formatLedgerDate(date);
                };

                const startLine = `Initial Fine: ${Number(fineSteps[0]).toLocaleString()}`;
                const historyLines = renderDiscountHistory(fineHistory);
                // markApplied: the fee is overdue, so the current fine is underlined and gets the check mark
                const currentLine = markApplied
                    ? `Current Fine: ${currentFine} <span class="fine-ok">&#10003;</span>`   // old: the current fine was underlined
                    : `Current Fine: ${currentFine}`;

                return `<div>${startLine}</div>${historyLines}<div>${currentLine}</div>`;
            }

            return currentFine;
        };

        // Plain-table helpers: a zero / empty value is shown as a light grey dash
        const dash = '<span class="zero-dash">-</span>';
        const amountOrDash = (value) => (Number(value || 0) !== 0 ? Number(value).toLocaleString() : dash);
        const formatLedgerDate = (value) => {
            if (!value) return '-';
            const d = new Date(value);
            return isNaN(d.getTime()) ? '-' : d.toLocaleDateString("en-GB", { day: '2-digit', month: 'short', year: 'numeric' });
        };

        // Same new date format as plain text (used inside the Mode / Source history lines)
        const formatLedgerDateText = (value) => {
            const d = new Date(value);
            if (isNaN(d.getTime())) return '-';
            const midnight = d.getUTCHours() === 0 && d.getUTCMinutes() === 0 && d.getUTCSeconds() === 0;   // no time stored
            const time = midnight ? '' : d.toLocaleTimeString("en-US", { hour: 'numeric', minute: '2-digit', hour12: true });
            return `${formatLedgerDate(value)}${time ? ` ${time}` : ''}`;
        };

        // Paying Date: day, short month name and year, then the time (12-hour) when one is stored
        const formatPayingDate = (value) => {
            if (!value) return dash;
            const d = new Date(value);
            if (isNaN(d.getTime())) return dash;
            const midnight = d.getUTCHours() === 0 && d.getUTCMinutes() === 0 && d.getUTCSeconds() === 0;   // no time stored
            const time = midnight ? '' : d.toLocaleTimeString("en-US", { hour: 'numeric', minute: '2-digit', hour12: true });
            return `<span class="dt"><span>${formatLedgerDate(value)}</span>${time ? `<span>${time}</span>` : ''}</span>`;
        };

        // Rows are sorted: Overdue (unpaid and past due), Not Yet Due (unpaid, due date in the future), Paid
        const monthOrder = (i) => (i.fee_month && i.fee_year ? Number(i.fee_year) * 12 + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'].indexOf(i.fee_month) : 0);
        const byDueDate = (a, b) => (new Date(a.due_date) - new Date(b.due_date)) || (monthOrder(a) - monthOrder(b)) || (new Date(a.fee_generation_date) - new Date(b.fee_generation_date)) || String(a.title).localeCompare(String(b.title));
        const sortFees = (feeData) => [
            ...feeData.filter(i => i.status !== 'Clear' && Number(i.dues || 0) > 0 && i.due).sort(byDueDate),
            ...feeData.filter(i => i.status !== 'Clear' && Number(i.dues || 0) > 0 && !i.due).sort(byDueDate),
            ...feeData.filter(i => i.status === 'Clear' || Number(i.dues || 0) <= 0).sort((a, b) => (new Date(b.paying_date || 0) - new Date(a.paying_date || 0)) || byDueDate(a, b)),   // old: .sort(byDueDate)
        ];

        // ---------- Family report: father details on top, siblings, then one detailed ledger per sibling ----------
        // Totals of a list of fee rows (same formulas as the Student Detailed report):
        //   expected = sum of Total, collected = sum of Paid, pending = sum of Dues, discount = (actual fee - fee after discount) + fine discounts,
        //   afterDiscount = fee after discount + further discounts, fine = fines included in Total (overdue fees only)
        const computeStats = (feeData) => {
            const st = { expected: 0, collected: 0, pending: 0, discount: 0, actual: 0, afterDiscount: 0, further: 0, fine: 0, fineDiscount: 0, clearedWaived: 0 };
            feeData.forEach(item => {
                const collected = item.paid_amount || 0;
                // a cleared fee waives the remaining amount: Net Receivable counts what was paid, Dues is 0
                const cleared = item.status === 'Clear';
                st.expected += cleared ? collected : (item.total || 0);
                st.collected += collected;
                st.pending += cleared ? 0 : (item.dues || 0);
                if (cleared) st.clearedWaived += Number(item.total || 0) - Number(collected);
                // Discount = further discounts + fine discounts. A fine discount counts only when that fine is inside Total (overdue fee).
                // The monthly fee discount (percent) is not part of it.
                const furtherDiscountAmount = (item.further_discount_history || []).reduce((sum, d) => sum + Number(d.amount || 0), 0);
                const fineDiscountAmount = item.due ? (item.late_fee_fine_discount_history || []).reduce((sum, d) => sum + Number(d.amount || 0), 0) : 0;
                st.discount += furtherDiscountAmount + fineDiscountAmount;
                st.actual += Number(item.actual_fee || 0);
                st.afterDiscount += Number(item.fee_after_discount || 0) + furtherDiscountAmount;
                st.further += furtherDiscountAmount;
                st.fine += item.due ? Number(item.fine || 0) : 0;
                st.fineDiscount += fineDiscountAmount;   // shown in the DISC box of the total row
            });
            return st;
        };
        /* old computeStats (commented out): Discount included the monthly percent discount and every fine discount, cleared fees were not handled
        const computeStats = (feeData) => {
            const st = { expected: 0, collected: 0, pending: 0, discount: 0, actual: 0, afterDiscount: 0, further: 0, fine: 0, fineDiscount: 0 };
            feeData.forEach(item => {

                const fineDiscountAmount = (item.late_fee_fine_discount_history || []).reduce((sum, d) => sum + Number(d.amount || 0), 0);
                st.discount += feeDiscountAmount + fineDiscountAmount;
                const furtherDiscountAmount = (item.further_discount_history || []).reduce((sum, d) => sum + Number(d.amount || 0), 0);
                st.actual += Number(item.actual_fee || 0);
                st.afterDiscount += Number(item.fee_after_discount || 0) + furtherDiscountAmount;
                st.further += furtherDiscountAmount;
                st.fine += item.due ? Number(item.fine || 0) : 0;
                st.fineDiscount += fineDiscountAmount;
            });
            return st;

        */

        // One fee row of the detailed ledger (same row as the Student Detailed report)
        const renderFeeRow = (item, srNo) => {

        // One student's detailed ledger table (rows + the student's total row)
        const renderLedgerTable = (feeData, totalLabel) => {

                                <td class="align-right">${st.actual.toLocaleString()}</td>
                                <td class="align-right">${st.afterDiscount.toLocaleString()}</td>
                                <td class="align-right">${amountOrDash(st.further)}</td>
                                ${st.fineDiscount > 0
                                    ? `<td class="fine-pair-cell"><div class="fine-pair"><div><span>Disc</span><b>${st.fineDiscount.toLocaleString()}</b></div><div><span>Apl</span><b>${st.fine.toLocaleString()}</b></div></div></td>`
                                    : `<td class="align-right">${st.fine.toLocaleString()}</td>`}
                                ${'' /* old cell: <td class="align-right">applied fine total + <br/>dis X</td> */}
                                <td class="align-right col-total">${Number(st.expected || 0).toLocaleString()}</td>
                                <td class="align-right col-paid">${Number(st.collected || 0).toLocaleString()}</td>
                                <td class="align-right col-due">${Number(st.pending || 0).toLocaleString()}</td>
                            </tr>
                        </tbody>` : ''}
                    </table>`;
        };

        const buildFamilyReportPage = (family, studentPages) => {
            const allFees = studentPages.reduce((all, p) => all.concat(p.feeData), []);
            const familyStats = computeStats(allFees);

            // Group totals of the whole family: Overdue = dues of unpaid fees past their due date, Not Yet Due = dues of unpaid fees not due yet
            // (Overdue + Not Yet Due = Remaining)
            let overdueDues = 0, overdueCount = 0, notYetDueDues = 0, notYetDueCount = 0;
            allFees.forEach(item => {
                if (item.status === 'Clear') return;   // a cleared fee waives its dues
                if (Number(item.dues || 0) > 0) {
                    if (item.due) { overdueDues += Number(item.dues || 0); overdueCount++; }
                    else { notYetDueDues += Number(item.dues || 0); notYetDueCount++; }
                }
            });

            // Date wise breakdown (all siblings together): how much was paid and how much discount was given on each date
            const dateBreakdown = {};
            const addToDate = (value, field, amount) => {
                const n = Number(amount || 0);
                if (!value || !n) return;
                const key = new Date(value).toLocaleDateString('en-CA');
                dateBreakdown[key] = dateBreakdown[key] || { received: 0, discount: 0 };
                dateBreakdown[key][field] += n;
            };
            allFees.forEach(item => {
                const partials = item.partial_payment_history || [];
                const partialSum = partials.reduce((sum, p) => sum + Number(p.amount || 0), 0);
                partials.forEach(p => addToDate(p.date, 'received', p.amount));
                addToDate(item.paying_date, 'received', Number(item.paid_amount || 0) - partialSum);   // full / quick payment
                (item.further_discount_history || []).forEach(d => addToDate(d.date, 'discount', d.amount));
                if (item.due) (item.late_fee_fine_discount_history || []).forEach(d => addToDate(d.date, 'discount', d.amount));   // old: counted for every fee
            });
            const breakdownDates = Object.keys(dateBreakdown).sort();
            const datedReceived = breakdownDates.reduce((sum, k) => sum + dateBreakdown[k].received, 0);
            const datedDiscount = breakdownDates.reduce((sum, k) => sum + dateBreakdown[k].discount, 0);
            // amounts that have no date (for example the discount given when the fee was generated)
            const undatedReceived = Math.max(0, familyStats.collected - datedReceived);
            const undatedDiscount = Math.max(0, familyStats.discount - datedDiscount);

            // Family advance is subtracted from the dues. If the advance is bigger than the dues, what is left of the advance is shown instead.
            const familyAdvance = Number(family.family_credit || 0);
            const duesAfterAdvance = Number(familyStats.pending || 0) - familyAdvance;
            const advanceCoversDues = duesAfterAdvance < 0;

            return `
            <div class="student-report-page last-page">
                <!-- Header Section -->
                <div class="header-section">
                    <div>
                        ${systemSettings?.school_logo ? `<img src="${systemSettings.school_logo}" class="header-logo" alt="Logo" />` : ''}
                    </div>
                    <div style="text-align: center; flex: 1;">
                        <h1>${systemSettings?.school_name || 'School Management System'}</h1>
                        <h2>Family Ledger Report (Detailed)</h2>
                    </div>
                    <div style="opacity: 0; width: 44px;"></div>
                </div>

                <!-- Father details + family fee summary (one row) -->
                <div class="top-band">
                <div class="top-left">
                <div class="info-grid family-info-grid">
                    <div class="info-item"><span class="info-label">Family Code</span><span class="info-value">${family.family_code || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Account Name</span><span class="info-value">${family.father_name || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Phone</span><span class="info-value">${family.phone || '-'}</span></div>
                    <div class="info-item"><span class="info-label">CNIC</span><span class="info-value">${family.cnic || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Siblings</span><span class="info-value">${family.students.length}</span></div>
                    <div class="info-item info-highlight"><span class="info-label">Family Advance</span><span class="info-value">Rs. ${familyAdvance.toLocaleString()}</span></div>
                </div>

                <!-- Overdue / Not Yet Due totals -->
                <div class="group-summary">
                    <div class="group-item"><span class="group-label">Overdue (${overdueCount} ${overdueCount === 1 ? 'fee' : 'fees'}) =</span><span class="group-value">${amountOrDash(overdueDues)}</span></div>
                    <div class="group-item"><span class="group-label">Not Yet Due (${notYetDueCount} ${notYetDueCount === 1 ? 'fee' : 'fees'}) =</span><span class="group-value">${amountOrDash(notYetDueDues)}</span></div>
                </div>
                </div>

                <!-- Step by step amounts: Receivable (sum of Fee After Discount) - Disc (further + fine) + Fine Applied = Net Receivable (= Total column),
                     - Received = Remaining, - Family Advance = Net Dues -->
                <div class="summary-grid">
                    <div class="summary-card"><span class="summary-label">Receivable</span><span class="summary-value">${Number(familyStats.afterDiscount || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Disc (Further Fee + Fine)</span><span class="summary-value">${(familyStats.discount || 0) ? '-' : ''}${Number(familyStats.discount || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Fine Applied</span><span class="summary-value">${(familyStats.fine || 0) ? '+' : ''}${Number(familyStats.fine || 0).toLocaleString()}</span></div>
                    ${familyStats.clearedWaived !== 0 ? `<div class="summary-card"><span class="summary-label">Cleared Fee Waived</span><span class="summary-value">${familyStats.clearedWaived > 0 ? "-" : "+"}${Math.abs(familyStats.clearedWaived).toLocaleString()}</span></div>` : ''}
                    <div class="summary-card result"><span class="summary-label">= Net Receivable</span><span class="summary-value">${Number(familyStats.expected || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Received</span><span class="summary-value">${Number(familyStats.collected || 0).toLocaleString()}</span></div>
                    <div class="summary-card result"><span class="summary-label">= Remaining</span><span class="summary-value">${Number(familyStats.pending || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Family Advance</span><span class="summary-value">- ${familyAdvance.toLocaleString()}</span></div>
                    <div class="summary-card dues"><span class="summary-label">${advanceCoversDues ? '= Advance Left' : '= Net Dues'}</span><span class="summary-value">${Math.abs(duesAfterAdvance).toLocaleString()}</span></div>
                    ${'' /* old cards (commented out):
                    <div class="summary-card"><span class="summary-label">Receivable =</span><span class="summary-value">${Number((familyStats.expected || 0) + (familyStats.discount || 0)).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Discount =</span><span class="summary-value">${Number(familyStats.discount || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Received =</span><span class="summary-value">${Number(familyStats.collected || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Remaining =</span><span class="summary-value">${Number(familyStats.pending || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Family Advance =</span><span class="summary-value">- ${familyAdvance.toLocaleString()}</span></div>
                    <div class="summary-card dues"><span class="summary-label">${advanceCoversDues ? 'Advance Left =' : 'Net Dues ='}</span><span class="summary-value">${Math.abs(duesAfterAdvance).toLocaleString()}</span></div>
                    */}
                </div>
                </div>

                <!-- Siblings -->
                <div class="section-heading">Siblings (${family.students.length})</div>
                <table class="children-table">
                    <thead>
                        <tr>
                            <th class="align-center">Sr #</th>
                            <th>Reg #</th>
                            <th>Student Name</th>
                            <th>Class / Section</th>
                            <th>Campus</th>
                            <th>Status</th>
                            <th class="align-right">Net Receivable</th>${'' /* old heading: Receivable (Net Receivable + discount) */}
                            <th class="align-right">Received</th>
                            <th class="align-right">Dues</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${studentPages.map((p, index) => {
                            const st = computeStats(p.feeData);
                            return `
                        <tr class="row">
                            <td class="align-center">${index + 1}</td>
                            <td class="nowrap">${p.studentData?.general_registration_code || '-'}</td>
                            <td>${p.studentData?.student_name || '-'}</td>
                            <td class="nowrap">${p.studentData?.student_class_name || '-'} / ${p.studentData?.student_section_name || '-'}</td>
                            <td>${p.studentData?.student_campus_name || '-'}</td>
                            <td>${p.studentData?.student_status || '-'}</td>
                            <td class="align-right">${Number(st.expected || 0).toLocaleString()}</td>   ${'' /* old: expected + discount */}
                            <td class="align-right">${amountOrDash(st.collected)}</td>
                            <td class="align-right col-due">${amountOrDash(st.pending)}</td>
                        </tr>`;
                        }).join('')}
                        <tr class="grand-total">
                            <td colspan="6">Family Total</td>
                            <td class="align-right">${Number(familyStats.expected || 0).toLocaleString()}</td>   ${'' /* old: expected + discount */}
                            <td class="align-right">${Number(familyStats.collected || 0).toLocaleString()}</td>
                            <td class="align-right col-due">${Number(familyStats.pending || 0).toLocaleString()}</td>
                        </tr>
                    </tbody>
                </table>

                <!-- One detailed ledger for each sibling -->
                ${studentPages.map(p => `
                <div class="student-section">
                    <div class="student-title">
                        <span>${p.studentData?.student_name || '-'} (${p.studentData?.general_registration_code || '-'})</span>
                        <span class="r">${p.studentData?.student_class_name || '-'} / ${p.studentData?.student_section_name || '-'}</span>
                    </div>
                    ${renderLedgerTable(p.feeData, 'Student Total')}
                </div>`).join('')}

                ${'' /* <div class="fine-legend"><u>Underlined</u> due date = overdue (unpaid and past its due date, or paid after it) &nbsp;|&nbsp; 300 &#10003; = fine applied (fee overdue, included in Total) &nbsp;|&nbsp; 300 &#10007; = fine not applicable (fee not overdue) &nbsp;|&nbsp; - = nothing / zero</div> */}   <!-- legend removed -->
                <div class="bottom-spacer"></div>
                <div class="report-bottom">
                    ${(breakdownDates.length > 0 || undatedReceived > 0 || undatedDiscount > 0) ? `
                    <div class="breakdown-title">Date Wise Breakdown (All Siblings)</div>
                    ${(() => {
                        // GROUPS = 1: one single column of dates. (the dates can be split in 2 or 3 parts that sit side by side by setting GROUPS to 2 or 3, and the width above to 100%)
                        const GROUPS = 1;
                        const items = breakdownDates.map(k => ({ label: formatLedgerDate(k + 'T12:00:00'), discount: dateBreakdown[k].discount, received: dateBreakdown[k].received }));
                        if (undatedReceived > 0 || undatedDiscount > 0) items.push({ label: 'Date not recorded', discount: undatedDiscount, received: undatedReceived });
                        const per = Math.ceil(items.length / GROUPS);
                        const cells = (it) => it
                            ? `<td class="nowrap">${it.label}</td><td class="align-right">${amountOrDash(it.discount)}</td><td class="align-right">${amountOrDash(it.received)}</td>`
                            : `<td></td><td></td><td></td>`;
                        let bodyRows = '';
                        for (let i = 0; i < per; i++) bodyRows += `<tr>${Array.from({ length: GROUPS }, (_, g) => cells(items[i + g * per])).join('')}</tr>`;
                        const headGroup = `<th>Date</th><th class="align-right">Discount</th><th class="align-right">Paid</th>`;
                        return `
                    <table class="breakdown-table">
                        <thead>
                            <tr>
                                ${headGroup.repeat(GROUPS)}
                            </tr>
                        </thead>
                        <tbody>
                            ${bodyRows}
                            <tr class="grand-total">
                                <td>Total</td>
                                <td class="align-right">${Number(familyStats.discount || 0).toLocaleString()}</td>
                                <td class="align-right">${Number(familyStats.collected || 0).toLocaleString()}</td>
                                ${GROUPS > 1 ? `<td colspan="${(GROUPS - 1) * 3}"></td>` : ''}
                            </tr>
                        </tbody>
                    </table>`;
                    })()}` : ''}
                    <div class="sign-row">
                        <div class="sign-box">Prepared By</div>
                        <div class="sign-box">Checked By</div>
                        <div class="sign-box">Parent Signature</div>
                    </div>
                    <div class="print-footer">
                        Generated on: ${new Date().toLocaleDateString("pt-PT")} | Powered by Ai Schooling System.com
                    </div>
                </div>
            </div>
            `;
        };

    document.body.insertAdjacentHTML("beforeend", buildFamilyReportPage(familyInfo, familyPages));

    /* ================= RUNNING HEADER (family) + PAGE NUMBERS, printed in the page margin ================= */
    // switched off: no "Family ... | ..." header and no "Page X of Y" on the printed pages. Set this to true to show them again.
    var SHOW_PAGE_HEADER_AND_NUMBERS = false;
    if (SHOW_PAGE_HEADER_AND_NUMBERS) (function () {
        var name = ("Family " + familyInfo.family_code + " | " + familyInfo.father_name).split('"').join("");
        var css = "@page { @top-left { content: \"" + name + "\"; font-size: 8px; color: #444; } @bottom-right { content: \"Page \" counter(page) \" of \" counter(pages); font-size: 8px; color: #444; } }" +
                  "@page :first { @top-left { content: \"\"; } }";
        var st = document.createElement("style");
        st.textContent = css;
        document.head.appendChild(st);
    })();

    /* ================= PIN THE DATE WISE BREAKDOWN + GENERATED LINE TO THE END OF THE LAST PRINTED PAGE ================= */
    function fitBottomBlocks() {
        var pageH = document.getElementById("pageMeasure").getBoundingClientRect().height;
        var pages = document.querySelectorAll(".student-report-page");
        pages.forEach(function (pg) { pg.querySelector(".bottom-spacer").style.height = "0px"; });
        document.body.classList.add("measuring");
        pages.forEach(function (pg) {
            var spacer = pg.querySelector(".bottom-spacer"), block = pg.querySelector(".report-bottom");
            var pageTop = pg.getBoundingClientRect().top;
            // walk the rows of every table like the printer does: a row that does not fit moves to the next page,
            // and the header of its table is repeated at the top of that page
            var rows = pg.querySelectorAll(".children-table tbody tr, .ledger-table tbody tr");
            var shift = 0;
            for (var i = 0; i < rows.length; i++) {
                var rect = rows[i].getBoundingClientRect();
                var theadH = rows[i].closest("table").querySelector("thead").getBoundingClientRect().height;
                var top = rect.top - pageTop + shift;
                var bottom = rect.bottom - pageTop + shift;
                var page = Math.floor(top / pageH);
                if (bottom > (page + 1) * pageH) { shift += (page + 1) * pageH + theadH - top; }
            }
            var contentEnd = spacer.getBoundingClientRect().top - pageTop + shift;
            var blockH = block.getBoundingClientRect().height;
            var pagesNeeded = Math.max(1, Math.ceil((contentEnd + blockH) / pageH));
            var spare = pagesNeeded * pageH - contentEnd - blockH - 80;   // 80px safety (landscape)
            spacer.style.height = Math.max(0, spare) + "px";
        });
        document.body.classList.remove("measuring");
    }
    window.addEventListener("beforeprint", fitBottomBlocks);
    window.addEventListener("afterprint", function () {
        document.querySelectorAll(".bottom-spacer").forEach(function (sp) { sp.style.height = "0px"; });
    });
</script>
</body>
</html>
