<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Ledger Report (Detailed)</title>
<!-- old title: Student Wise Collected Fee Report -->
<style>
                @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
                * {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                    font-family: "Poppins", sans-serif !important;
                }
                @page {
                    size: A4 auto;   /* old: A4 landscape */
                    margin: 7mm;
                }
                html {
                    -webkit-print-color-adjust: exact !important;
                    print-color-adjust: exact !important;
                }
                body {
                    background: white;
                    font-size: 9px;
                    line-height: 1.2;
                    padding: 5px;
                    -webkit-print-color-adjust: exact !important;
                    print-color-adjust: exact !important;
                }
                .student-report-page {
                    page-break-after: always;
                    break-after: page;
                }
                .student-report-page.last-page {
                    page-break-after: auto;
                    break-after: auto;
                }

                /* Header Section */
                .header-section {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 8px;
                    border-bottom: 1px solid #000;
                    padding: 0 0 8px;
                    /* old: border: 1px solid #ddd; padding: 11px; margin-bottom: 11px; */
                }
                .header-section h1 {
                    font-size: 17px;
                    font-weight: 700;
                    margin-bottom: 2px;
                    color: black;
                }
                .header-section h2 {
                    font-size: 12px;
                    font-weight: 700;
                    margin-bottom: 4px;
                    color: black;
                }
                .header-logo {
                    width: 56px;
                    height: 56px;
                    object-fit: contain;
                    border-radius: 5px;
                }

                /* Table Styles */
                table {
                    width: 100%;
                    border-collapse: collapse;
                    font-size: 9px;
                }
                /* old table style (double header line, grey odd rows, no cell borders) replaced by the plain bordered table
                thead tr { background-color: #f0f0f0 !important; }
                th { text-align: center; font-size: 9px; font-weight: 700; padding: 3px 1px; border-bottom: 3px double #000; color: black; }
                tbody tr:nth-child(odd) { background-color: #cececeff !important; }
                tbody tr:nth-child(even) { background-color: white !important; }
                td { text-align: center; font-size: 9px; font-weight: 600; border-bottom: 1px solid #ccc; color: black; vertical-align: middle; }
                */
                th, td {
                    border: 1px solid #999;
                    padding: 4px;
                    text-align: left;
                    font-weight: 600;
                    color: #000;
                    vertical-align: middle;
                }
                th {
                    font-size: 9px;
                    background-color: #f0f0f0 !important;
                    font-weight: 700;
                    text-transform: uppercase;
                }
                td { font-size: 9px; }
                thead { display: table-header-group; }
                tr { page-break-inside: avoid; }
                .align-right { text-align: right; }
                .align-left { text-align: left; }   /* cells with a history list (further discount / fine) */
                .align-center { text-align: center; }
                .nowrap { white-space: nowrap; }
                tr.row td { border-top: 1px solid #d4d4d4; border-bottom: 1px solid #d4d4d4; padding-top: 3px; padding-bottom: 3px; }
                td s { margin-right: 5px; }
                td.td-fee-title {
                    text-align: left;
                }
                th.col-total,
                th.col-paid,
                th.col-due { font-size: 10px; }
                td.col-total,
                td.col-paid,
                td.col-due,
                tr.grand-total td.col-total,
                tr.grand-total td.col-paid,
                tr.grand-total td.col-due { font-size: 11px; font-weight: 700; }
                tr.grand-total td {
                    background-color: #f0f0f0 !important;
                    font-weight: 700;
                    border-top: 2px solid #999;
                }
                tr.grand-total td:first-child { text-align: right; text-transform: uppercase; }
                tr.grand-total td.col-due { font-size: 13px; border-bottom: 3px double #000; }
                /* Grand Total row: Actual Class Fee, Fee After Discount and Further Fee Disc totals are normal weight (old: all bold). Total / Paid / Dues stay bold */
                .ledger-table tr.grand-total td.align-right:not(.col-total):not(.col-paid):not(.col-due) { font-weight: 400; }
                .zero-dash { color: #999; font-size: 9px; font-weight: 400; }
                /* fine not applicable: dark, so it is clearly visible on a black and white print (old: color #999; font-weight 400) */
                .fine-na { color: #000; font-size: 9px; font-weight: 400; }   /* old: 600. Not used now: a fee that is not overdue shows only a dash */
                .fine-ok { font-size: 10px; font-weight: 400; }   /* old: 700. Not used now: the check mark is removed */
                /* Grand Total / Student Total, Fine cell: two small boxes side by side, DISC (fine discount) and APL (fine applied), each with its amount under it */
                td.fine-pair-cell { padding: 0 !important; }
                .fine-pair { display: flex; }
                .fine-pair > div { flex: 1; display: flex; flex-direction: column; align-items: stretch; text-align: center; }
                .fine-pair > div + div { border-left: 1px solid #999; }
                .fine-pair span { font-size: 7px; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid #999; padding: 1px 2px; background: #e6e6e6; }
                .fine-pair b { font-size: 9px; font-weight: 400; padding: 2px; white-space: nowrap; }
                .dt span { white-space: nowrap; }   /* the date and the time stay whole, the time moves to the next line when the cell is too narrow */
                .dt span + span { margin-left: 8px; }
                .green { color: rgb(0, 0, 0) !important; }
                .red { color: rgb(0, 0, 0) !important; }
                .blue { color: rgb(0, 0, 0) !important; }

                /* Status Badge */
                .status-badge {
                    padding: 2px 5px;
                    border-radius: 9px;
                    font-size: 9px;
                    font-weight: 700;
                }
                .status-paid { background-color: #dcfce7; color: #15803d; }
                .status-clear { background-color: #dbeafe; color: #1d4ed8; }
                .status-unpaid { background-color: #fee2e2; color: #dc2626; }
                .status-not-created { background-color: #f3f4f6; color: #374151; }

                /* History chain */
                .chain { display: flex; align-items: center; justify-content: center; gap: 2px; flex-wrap: wrap; color: black; }
                .chain small { font-size: 9px; color: black; }
                .chain .arrow { font-size: 8px; color: #555; }
                .chain .total-val { font-size: 10px; font-weight: 700; color: black; }
                .th-sub {
                    display: block;
                    font-size: 7px;
                    font-weight: 500;
                    color: #3d3d3d;
                    margin-top: 1px;
                }

                /* Student Details + Fee Summary (compact, black & white) */
                .top-band {
                    display: flex;
                    gap: 6px;
                    margin-bottom: 8px;
                }
                .info-grid {
                    flex: 3;
                    display: grid;
                    grid-template-columns: repeat(4, 1fr);
                    gap: 5px 10px;
                    align-content: space-between;
                    border: 1px solid #000;
                    padding: 6px 8px;
                }
                .info-item { display: flex; flex-direction: column; }
                /* highlighted field (Family Advance): grey box with a border, bigger value */
                .info-item.info-highlight { background-color: #e6e6e6 !important; border: 1px solid #000; padding: 2px 6px; }
                .info-item.info-highlight .info-label { font-weight: 700; }
                .info-item.info-highlight .info-value { font-size: 13px; }
                .info-label {
                    white-space: nowrap;
                    font-size: 8px;
                    font-weight: 600;
                    color: #000;
                    text-transform: uppercase;
                }
                .info-value {
                    font-size: 11px;
                    font-weight: 700;
                    color: #000;
                }
                .summary-grid {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    border: 1px solid #000;
                }
                .summary-card {
                    flex: 1;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    gap: 10px;
                    padding: 3px 8px;
                    border-top: 1px solid #000;
                }
                .summary-card:first-child { border-top: none; }
                .summary-card { border-top: 1px dotted #999; }
                .summary-card.result { border-top: 1px solid #000; }
                .summary-card.result .summary-label { font-weight: 700; }
                .summary-card.dues { background-color: #e6e6e6 !important; border-top: 2px solid #000; }
                .summary-card.dues .summary-label { font-weight: 700; }
                .summary-card.dues .summary-value { font-size: 15px; }
                .summary-label {
                    font-size: 8px;
                    font-weight: 600;
                    color: #000;
                    text-transform: uppercase;
                }
                .summary-value {
                    font-size: 12px;
                    font-weight: 400;   /* old: 700 for every amount. Now only the = lines are bold */
                    color: #000;
                }
                .summary-card.result .summary-value, .summary-card.dues .summary-value { font-weight: 700; }
                .summary-section {
                    border: 1px solid #ddd;
                    margin: 11px 0;
                    padding: 9px;
                    background-color: #f9f9f9;
                    border-radius: 5px;
                }
                .summary-section h3 {
                    font-size: 11px;
                    font-weight: 700;
                    color: black;
                    text-align: center;
                    margin-bottom: 7px;
                }
                .summary-section ul {
                    list-style-type: none;
                    padding: 0;
                    margin: 0;
                }
                .summary-section li {
                    font-size: 9px;
                    color: black;
                    margin-bottom: 2px;
                    font-weight: 600;
                    line-height: 1.35;
                }
                .print-footer {
                    margin-top: 11px;
                    padding-top: 7px;
                    font-size: 10px;
                    color: rgb(56, 56, 56);
                    text-align: center;
                    font-weight: 700;
                }
                .report-bottom { page-break-inside: avoid; break-inside: avoid; display: flow-root; }
                /* fixed column widths: the Mode / Source column no longer takes all the free space and pushes the number columns apart (old: automatic widths) */
                /* fixed column widths (see the colgroup of the table): the Fine and Further Disc columns are wider than before (Fine 11% -> 13.5%, Further Disc 15.5% -> 14.5% with a shorter Mode / Source). old: automatic widths made the history columns too wide */
                .ledger-table { table-layout: fixed; }
                .breakdown-title { font-size: 11px; font-weight: 700; text-transform: uppercase; margin: 0 0 4px; }
                .breakdown-table { width: 40%; margin-bottom: 0; }
                /* Mode / Source: one line per history, only a small number in front (hanging indent so a wrapped line stays under its own text) */
                .hist-item { display: flex; gap: 3px; align-items: flex-start; }
                .hist-no { flex: none; font-size: 7px; line-height: 12px; }
                .hist-sub { font-size: 8px; font-weight: 600; }   /* old: bold number (1. 2. 3.) */
                /* Overdue / Not Yet Due / Paid totals: one thin bordered line under the stat boxes */
                /* left column of the top band: the student details box with the group line under it (same width as the details box, the stats box stays on the right) */
                .top-left { flex: 3; display: flex; flex-direction: column; gap: 6px; }
                .top-left .info-grid { flex: 1; }
                .group-summary { display: flex; border: 1px solid #000; }   /* old: a separate line under the whole top band (margin: -2px 0 8px) */
                .group-item { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 8px; }
                .group-item + .group-item { border-left: 1px solid #000; }
                .group-label { font-size: 8px; font-weight: 600; text-transform: uppercase; }
                .group-value { font-size: 11px; font-weight: 700; }
                .fine-legend { margin: -4px 0 8px; font-size: 8px; font-weight: 600; color: #000; }
                .sign-row { display: flex; justify-content: space-between; gap: 30px; margin: 34px 0 10px; }
                .sign-box { flex: 1; text-align: center; border-top: 1px solid #000; padding-top: 4px; font-size: 9px; font-weight: 600; text-transform: uppercase; }
                .page-measure { position: absolute; visibility: hidden; height: 196mm; width: 1px; }
                /* same width the printer uses (landscape page 297mm - 2 x 7mm margin - body padding), applied only while measuring */
                body.measuring .student-report-page { width: calc(283mm - 10px) !important; }
    /* preview only */
    .print-btn { position: fixed; top: 12px; right: 16px; background: #000; color: #fff; border: 1px solid #000; padding: 7px 16px; font-size: 11px; font-weight: 600; cursor: pointer; }
    @media print { .print-btn { display: none !important; } }
</style>
</head>
<body>
<div class="page-measure" id="pageMeasure"></div>
<button class="print-btn" onclick="window.print()">Print</button>

<script>
    /* ================= DUMMY DATA (same shape as your APIs) ================= */
    var systemSettings = { school_name: "Ai Schooling System", school_logo: "https://i.postimg.cc/jqB2gpTG/image.png" };
    var FA = "6a23166bc0d803e8365bf1d1", FA_GEN = "6a23166bc0d803e8365bf1d2", FA_BANK = "6abe24c6c47ee1a2165d82f4";

    // Payment channels (id -> name), the same data getModeName / getSourceName read from
    var paymentChannels = [
        { _id: FA, mode_name: "Family Advance", sources: [{ _id: FA_GEN, source: "General" }, { _id: FA_BANK, source: "Bank" }] },
        { _id: "69f61a250ece5980ea7593d9", mode_name: "Cash", sources: [{ _id: "69f61a250ece5980ea7593da", source: "General" }, { _id: "6a99cd3ac6679a85f7c0ab5f", source: "Ayesha" }, { _id: "6a99cd4bc6679a85f7c0ab64", source: "Nimra" }] },
        { _id: "69f61a250ece5980ea7593db", mode_name: "Mobile Wallet", sources: [{ _id: "69f61a250ece5980ea7593dc", source: "General" }, { _id: "69f61a600ece5980ea7593f4", source: "Jazz Cash" }] },
        { _id: "69f61a250ece5980ea7593dd", mode_name: "Bank Transfer", sources: [{ _id: "69f61a250ece5980ea7593de", source: "General" }] }
    ];

    var studentDataFromOfFee = {
        student_name: "Adnan Ahmed", student_father_name: "Muhammad Kamran", general_registration_code: "BSS-STD-898",
        student_class_name: "NINE", student_section_name: "SUPER BARIAN", student_campus_name: "IQBAL TOWN",
        student_father_phone: 1256701817, student_status: "Active", family_credit: 78000,
        siblings_count: 2   // other children of this family (the app can take it from the family list: totalStudent.length - 1)
    };

    var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    var DISC_PAY = "2026-10-01T09:16:33.948Z";
    function mfee(i, year, o) {
        var m = MONTHS[i], mm = ("0" + (i + 1)).slice(-2), cur = year === "2026";
        var after = o.after != null ? o.after : 3000;
        return {
            fee_month: m, fee_year: year,
            due_date: cur ? year + "-" + mm + "-10T00:00:00.000Z" : "2026-10-08T00:00:00.000Z",
            late_fine: cur ? 300 : 0,
            fee_status: o.status || "Unpaid",
            fee_generation_date: cur ? year + "-" + mm + "-01T00:00:00.000Z" : "2026-10-01T00:00:00.000Z",
            actual_monthly_fee: 3000, monthly_fee_discount: o.disc || 0, paying_date: o.paying || null,
            monthly_fee_after_discount: after, message_cost: 0, paid_amount: o.paid || 0,
            partial_payment_history: o.partial || [], further_discount_history: o.further || [],
            due_date_history: [], late_fee_fine_discount_history: o.fineDisc || [],
            payment_method: o.paid ? "Family Credit" : undefined,
            payment_mode_id: o.mode, payment_mode_source_id: o.src, payment_recieved_by: o.by
        };
    }
    var paidFull = function (paying, src) { return { status: "Paid", paying: paying, paid: 3300, mode: FA, src: src, by: "DEMO" }; };

    var studentDues = {
        monthlyFee: [{ student: "67d6c5e7548e557c580d5959", fees: [
            mfee(0, "2026", { status: "Paid", paying: DISC_PAY, paid: 3300, mode: FA, src: FA_BANK, by: "DEMO" }),
            mfee(1, "2026", { status: "Paid", paying: DISC_PAY, paid: 3300, mode: FA, src: FA_BANK, by: "DEMO" }),
            mfee(2, "2026", { status: "Paid", paying: DISC_PAY, paid: 3300, mode: FA, src: FA_BANK, by: "DEMO" }),
            // Fee Of April 2026: three partial payments (three Mode / Source history lines)
            mfee(3, "2026", { paid: 1000, partial: [
                { amount: 100, date: DISC_PAY, payment_mode_id: FA, payment_mode_source_id: FA_BANK, payment_recieved_by: "DEMO" },
                { amount: 500, date: "2026-09-10T10:30:00.000Z", payment_mode_id: "69f61a250ece5980ea7593d9", payment_mode_source_id: "6a99cd3ac6679a85f7c0ab5f", payment_recieved_by: "Ayesha" },
                { amount: 400, date: "2026-09-25T14:05:00.000Z", payment_mode_id: "69f61a250ece5980ea7593db", payment_mode_source_id: "69f61a600ece5980ea7593f4", payment_recieved_by: "Nimra" }
            ] }),
            // Fee Of May 2026: two fine discounts
            mfee(4, "2026", { fine: 200, fineDisc: [
                { date: "2026-09-20T09:20:00.000Z", amount: 60, reason: "Fine Discount", discount_by: "DEMO", approved_by: "DEMO" },
                { date: "2026-09-28T16:45:00.000Z", amount: 40, reason: "Fine Discount", discount_by: "Ayesha", approved_by: "DEMO" }
            ] }), mfee(5, "2026", {}), mfee(6, "2026", {}), mfee(7, "2026", {}), mfee(8, "2026", {}),
            mfee(9, "2026", { paid: 2500, partial: [{ amount: 2500, date: "2026-10-01T09:16:20.620Z", payment_mode_id: FA, payment_mode_source_id: FA_BANK, payment_recieved_by: "DEMO" }] }),
            mfee(10, "2026", { status: "Paid", paying: "2026-10-01T09:15:04.079Z", paid: 3000, mode: FA, src: FA_GEN, by: "DEMO" }),
            mfee(11, "2026", {}),
            mfee(0, "2025", { status: "Paid", paying: "2026-10-01T09:15:30.246Z", paid: 3000, mode: FA, src: FA_GEN, by: "DEMO",
                fineDisc: [{ date: "2026-10-01T09:15:30.246Z", amount: 0, reason: "Paid Without Fine", discount_by: "DEMO", approved_by: "DEMO" }] }),
            mfee(1, "2025", {}), mfee(2, "2025", {}), mfee(3, "2025", {}), mfee(4, "2025", {}),
            mfee(5, "2025", { status: "Paid", paying: "2026-10-01T09:16:42.926Z", paid: 2000, after: 2000, disc: 33, mode: FA, src: FA_BANK, by: "DEMO",
                further: [{ date: "2026-10-01T09:16:42.926Z", amount: 1000, reason: "Pay And Discount", discount_by: "DEMO", approved_by: "DEMO" }] }),
            // Fee Of July 2025: two further discounts
            mfee(6, "2025", { after: 2000, disc: 33, further: [
                { date: "2026-09-12T11:10:00.000Z", amount: 600, reason: "Further Discount", discount_by: "DEMO", approved_by: "DEMO" },
                { date: "2026-09-22T13:25:00.000Z", amount: 400, reason: "Further Discount", discount_by: "Nimra", approved_by: "DEMO" }
            ] }), mfee(7, "2025", {}), mfee(8, "2025", {}), mfee(9, "2025", {}), mfee(10, "2025", {}), mfee(11, "2025", {})
        ] }],
        customFee: [
            { custom_fee_name: "CONTEEN FEE 2026", custom_fee_generate_date: "2026-10-31T19:05:36.930Z", actual_custom_fee: 4500, custom_fee_discount: 0,
              custom_fee_after_discount: 4500, custom_fee_fine: 300, custom_fee_due_date: "2026-11-10T00:00:00.000Z", paying_date: null,
              custom_fee_status: "Unpaid", paid_amount: 1500, payment_method: "Family Credit",
              partial_payment_history: [{ amount: 1500, date: "2026-10-01T09:15:15.255Z", payment_mode_id: FA, payment_mode_source_id: FA_GEN, payment_recieved_by: "DEMO" }],
              further_discount_history: [], late_fee_fine_discount_history: [] },
            { custom_fee_name: "STATIONARY FEE 2026", custom_fee_generate_date: "2026-10-31T19:06:38.125Z", actual_custom_fee: 1500, custom_fee_discount: 0,
              custom_fee_after_discount: 1500, custom_fee_fine: 300, custom_fee_due_date: "2026-11-10T00:00:00.000Z", paying_date: null,
              custom_fee_status: "Unpaid", paid_amount: 0, partial_payment_history: [], further_discount_history: [], late_fee_fine_discount_history: [] }
        ],
        transferFee: []
    };

    /* ================= SAME LOGIC AS Fee Payment.jsx ================= */
    function getModeName(id) {
        for (var i = 0; i < paymentChannels.length; i++) if (paymentChannels[i]._id === id) return paymentChannels[i].mode_name;
        return "";
    }
    function getSourceName(id) {
        for (var i = 0; i < paymentChannels.length; i++)
            for (var j = 0; j < paymentChannels[i].sources.length; j++) if (paymentChannels[i].sources[j]._id === id) return paymentChannels[i].sources[j].source;
        return "";
    }
    function toDateCA(v) { return v ? new Date(v).toLocaleDateString("en-CA") : ""; }
    function isFeeOverdue(o) {
        var due = toDateCA(o.dueDate);
        if (!due) return false;
        if (o.feeStatus === "Paid") return toDateCA(o.payingDate) > due;
        if (o.feeStatus === "Clear") return toDateCA(o.clearFeeDate) > due;
        return toDateCA(o.compareDate) > due;
    }

    // Build the rows exactly like getFeePaymentData does
    var today = new Date().toLocaleDateString("en-CA");
    var totalData = [];
    studentDues.monthlyFee.forEach(function (mf) {
        mf.fees.forEach(function (e) {
            var due = isFeeOverdue({ dueDate: e.due_date, compareDate: today, feeStatus: e.fee_status, payingDate: e.paying_date, clearFeeDate: e.clear_fee_date });
            totalData.push({
                title: "Fee Of " + e.fee_month + " " + e.fee_year, fee_month: e.fee_month, fee_year: e.fee_year, fee_generation_date: new Date(e.fee_generation_date), due: due, due_date: e.due_date,
                actual_fee: e.actual_monthly_fee, discount: e.monthly_fee_discount, fee_after_discount: e.monthly_fee_after_discount, fine: e.late_fine,
                total: due ? e.monthly_fee_after_discount + e.late_fine : e.monthly_fee_after_discount,
                dues: (due ? e.monthly_fee_after_discount + e.late_fine : e.monthly_fee_after_discount) - e.paid_amount,
                status: e.fee_status, paid_amount: e.paid_amount, partial_payment_history: e.partial_payment_history, paying_date: e.paying_date,
                payment_method: e.payment_method, further_discount_history: e.further_discount_history, late_fee_fine_discount_history: e.late_fee_fine_discount_history,
                payment_mode_id: e.payment_mode_id, payment_mode_source_id: e.payment_mode_source_id, payment_recieved_by: e.payment_recieved_by
            });
        });
    });
    studentDues.customFee.forEach(function (e) {
        var due = isFeeOverdue({ dueDate: e.custom_fee_due_date, compareDate: today, feeStatus: e.custom_fee_status, payingDate: e.paying_date, clearFeeDate: e.clear_fee_date });
        totalData.push({

                // // fine applicable: underlined + check mark (with a fine history the current fine line gets them)
                // fineHtml = hasFineHistory ? getFinePrintStr(item, true) : `${getFinePrintStr(item)} <span class="fine-ok">&#10003;</span>`;   // old: the fine was underlined (<u>...</u>)
                // } else {
                // fineHtml = getFinePrintStr(item);
                // }
                // // old: const fineHtml = Number(item.fine || 0) === 0 && !hasFineHistory ? dash : getFinePrintStr(item);
                const furtherDiscountTotal = fdHistory.reduce((sum, d) => sum + Number(d.amount || 0), 0);
                const modeSourceHtml = getModeSourceStr(item).trim();

                return `
                                    <tr class="row">
                                        <td class="align-center">${index + 1}</td>
                                        <td class="td-fee-title">${item.title}</td>
                                        ${'' /* <td>${item.status}${item.payment_method === 'Online Payment' ? ' (Online)' : ''}</td> */}
                                        <td class="nowrap">${item.due_date ? (item.due ? `<u>${formatLedgerDate(item.due_date)}</u>` : formatLedgerDate(item.due_date)) : dash}</td>   ${'' /* overdue due date = underlined (item.due) */}
                                        <td>${formatPayingDate(item.paying_date)}</td>   <!-- old: class="nowrap", the text could run out of the cell -->
                                        ${'' /* old format (01/10/2026 02:15 PM): <td class="nowrap">${formatDateTime(item.paying_date) || dash}</td> */}
                                        <td>${modeSourceHtml === '-' || modeSourceHtml === '' ? dash : modeSourceHtml}</td>
                                        ${'' /* <td class="align-center">${item.due ? 'Yes' : 'No'}</td> */}
                                        <td class="align-right">${Number(item.actual_fee || 0).toLocaleString()}</td>
                                        ${'' /* <td class="blue">${item.discount || 0}%</td> */}
                                        <td class="align-right">${(Number(item.fee_after_discount || 0) + furtherDiscountTotal).toLocaleString()}</td>
                                        <td class="${fdHistory.length > 0 ? 'align-left' : 'align-right'}">${furtherDiscountHtml}</td>
                                        <td class="${(item.due && hasFineHistory) ? 'align-left' : 'align-right'}">${fineHtml}</td>   ${'' /* old class: hasFineHistory ? align-left : align-right */}
                                        <td class="align-right col-total">${Number(item.total || 0).toLocaleString()}</td>
                                        <td class="align-right col-paid">${amountOrDash(item.paid_amount)}</td>
                                        <td class="align-right col-due">${amountOrDash(item.dues)}</td>
                                    </tr>
                                `;
            }).join('') : `<tr><td colspan="12" style="text-align: center; padding: 17px; font-size: 9px;">No Records Found!</td></tr>`}
                        </tbody>
                        ${studentFeeData?.length > 0 ? `
                        <tbody class="grand-total-body">
                            <tr class="grand-total">
                                <td colspan="5">Grand Total</td>
                                <td class="align-right">${totalActualFeePrint.toLocaleString()}</td>
                                <td class="align-right">${totalFeeAfterDiscountPrint.toLocaleString()}</td>
                                <td class="align-right">${amountOrDash(totalFurtherDiscountPrint)}</td>
                                <td class="fine-pair-cell"><div class="fine-pair"><div><span>Disc</span><b>${totalFineDiscountPrint.toLocaleString()}</b></div><div><span>Apl</span><b>${totalFinePrint.toLocaleString()}</b></div></div></td>
                                ${'' /* old: the DISC / APL boxes were only shown when a fine discount existed (totalFineDiscountPrint > 0), otherwise only the applied fine total */}
                                ${'' /* old cell: <td class="align-right">applied fine total + <br/>dis X</td> */}
                                <td class="align-right col-total">${Number(totalExpectedFeePrint || 0).toLocaleString()}</td>
                                <td class="align-right col-paid">${Number(totalCollectedFeePrint || 0).toLocaleString()}</td>
                                <td class="align-right col-due">${Number(totalPendingFeePrint || 0).toLocaleString()}</td>
                            </tr>
                        </tbody>` : ''}
                    </table>
                </div>
                ${'' /* <div class="fine-legend"><u>Underlined</u> due date = overdue (unpaid and past its due date, or paid after it) &nbsp;|&nbsp; 300 &#10003; = fine applied (fee overdue, included in Total) &nbsp;|&nbsp; 300 &#10007; = fine not applicable (fee not overdue) &nbsp;|&nbsp; - = nothing / zero</div> */}   <!-- legend removed -->
                <div class="bottom-spacer"></div>
                <div class="report-bottom">
                    ${(breakdownDates.length > 0 || undatedReceived > 0 || undatedDiscount > 0) ? `
                    <div class="breakdown-title">Date Wise Breakdown</div>
                    <table class="breakdown-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th class="align-right">Discount</th>
                                <th class="align-right">Paid</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${breakdownDates.map(k => `
                            <tr>
                                <td class="nowrap">${formatLedgerDate(k + 'T12:00:00')}</td>
                                <td class="align-right">${amountOrDash(dateBreakdown[k].discount)}</td>
                                <td class="align-right">${amountOrDash(dateBreakdown[k].received)}</td>
                            </tr>`).join('')}
                            ${(undatedReceived > 0 || undatedDiscount > 0) ? `
                            <tr>
                                <td>Date not recorded</td>
                                <td class="align-right">${amountOrDash(undatedDiscount)}</td>
                                <td class="align-right">${amountOrDash(undatedReceived)}</td>
                            </tr>` : ''}
                            <tr class="grand-total">
                                <td>Total</td>
                                <td class="align-right">${Number(totalDiscountPrint || 0).toLocaleString()}</td>
                                <td class="align-right">${Number(totalCollectedFeePrint || 0).toLocaleString()}</td>

                        </tbody>
                    </table>` : ''}
                    <div class="sign-row">
                        <div class="sign-box">Prepared By</div>
                        <div class="sign-box">Checked By</div>
                        <div class="sign-box">Parent Signature</div>
                    </div>
                    <div class="print-footer">
                        Generated on: ${new Date().toLocaleDateString("pt-PT")} | Powered by Ai Schooling System.com
                    </div>
                </div>
            </div>
            `;
        };


    var pagesWithFees = printPages.filter(function (page) { return page.feeData.length > 0; });
    var pagesToRender = pagesWithFees.length > 0 ? pagesWithFees : printPages;
    document.body.insertAdjacentHTML("beforeend", pagesToRender.map(function (page, index) { return buildStudentReportPage(page.studentData, page.feeData, index === pagesToRender.length - 1); }).join(""));

    /* ================= RUNNING HEADER (student) + PAGE NUMBERS, printed in the page margin ================= */

    /* ================= PIN THE DATE WISE BREAKDOWN + GENERATED LINE TO THE END OF THE LAST PRINTED PAGE ================= */
    function fitBottomBlocks() {
        var pageH = document.getElementById("pageMeasure").getBoundingClientRect().height;
        var pages = document.querySelectorAll(".student-report-page");
        pages.forEach(function (pg) { pg.querySelector(".bottom-spacer").style.height = "0px"; });
        document.body.classList.add("measuring");
        pages.forEach(function (pg) {
            var spacer = pg.querySelector(".bottom-spacer"), block = pg.querySelector(".report-bottom"), table = pg.querySelector(".ledger-table");
            var pageTop = pg.getBoundingClientRect().top;
            var theadH = table ? table.querySelector("thead").getBoundingClientRect().height : 0;
            var rows = table ? table.querySelectorAll("tbody tr") : [];
            // walk the rows like the printer does: a row that does not fit moves to the next page,
            // and the table header is repeated at the top of that page
            var shift = 0;
            for (var i = 0; i < rows.length; i++) {
                var rect = rows[i].getBoundingClientRect();
                var top = rect.top - pageTop + shift;
                var bottom = rect.bottom - pageTop + shift;
                var page = Math.floor(top / pageH);
                if (bottom > (page + 1) * pageH) { shift += (page + 1) * pageH + theadH - top; }
            }
            var contentEnd = spacer.getBoundingClientRect().top - pageTop + shift;
            var blockH = block.getBoundingClientRect().height;
            var pagesNeeded = Math.max(1, Math.ceil((contentEnd + blockH) / pageH));
            var spare = pagesNeeded * pageH - contentEnd - blockH - 80;   // 80px safety (landscape needs more room than portrait)
            spacer.style.height = Math.max(0, spare) + "px";
        });
        document.body.classList.remove("measuring");
    }
    window.addEventListener("beforeprint", fitBottomBlocks);
    window.addEventListener("afterprint", function () {
        document.querySelectorAll(".bottom-spacer").forEach(function (sp) { sp.style.height = "0px"; });
    });
</script>
