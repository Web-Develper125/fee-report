<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Ledger Report (Simple)</title>
<!-- old title: Student Wise Collected Fee Report (New Design) -->
<style>
                @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
                * {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                    font-family: "Poppins", sans-serif !important;
                }
                @page {
                    size: A4 portrait;
                    margin: 7mm;
                }
                html {
                    -webkit-print-color-adjust: exact !important;
                    print-color-adjust: exact !important;
                }
                body {
                    background: white;
                    font-size: 9px;
                    line-height: 1.2;
                    padding: 5px;
                    -webkit-print-color-adjust: exact !important;
                    print-color-adjust: exact !important;
                }
                .student-report-page {
                    page-break-after: always;
                    break-after: page;
                }
                .student-report-page.last-page {
                    page-break-after: auto;
                    break-after: auto;
                }

                /* Header Section */
                .header-section {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 8px;
                    border-bottom: 1px solid #000;
                    padding: 0 0 8px;
                }
                .report-sub { font-size: 9px; font-weight: 600; color: #000; margin-top: 1px; }
                .header-section h1 {
                    font-size: 17px;
                    font-weight: 700;
                    margin-bottom: 2px;
                    color: black;
                }
                .header-section h2 {
                    font-size: 12px;
                    font-weight: 700;
                    margin-bottom: 4px;
                    color: black;
                }
                .header-logo {
                    width: 56px;
                    height: 56px;
                    object-fit: contain;
                    border-radius: 5px;
                }

                /* Table Styles (same bordered, plain table as the Family Advance Ledger report) */
                table {
                    width: 100%;
                    border-collapse: collapse;
                }
                th, td {
                    border: 1px solid #999;
                    padding: 4px;
                    text-align: left;
                    font-weight: 600;
                    color: #000;
                    vertical-align: middle;
                }
                /* header cells: original size */
                th {
                    font-size: 9px;
                    background-color: #f0f0f0 !important;
                    font-weight: 700;
                    text-transform: uppercase;
                }
                /* body cells: original size */
                td {
                    font-size: 9px;
                }
                thead { display: table-header-group; }
                tr { page-break-inside: avoid; }
                .align-right { text-align: right; }
                .align-center { text-align: center; }
                .nowrap { white-space: nowrap; }
                .ledger-table th:first-child { white-space: nowrap; }   /* Sr # stays on one line */
                tr.row td { border-top: 1px solid #d4d4d4; border-bottom: 1px solid #d4d4d4; }
                tr.row td, tr.band td, tr.subtotal td { padding-top: 3px; padding-bottom: 3px; }
                td s { margin-right: 5px; }
                /* group bands: Overdue / Not Yet Due / Paid, each with its own subtotal */
                tr.band td { background-color: #e6e6e6 !important; font-weight: 700; text-transform: uppercase; border-top: 1px solid #666; border-bottom: 1px solid #666; }
                tr.subtotal td { background-color: #f3f3f3 !important; font-weight: 700; border-top: 1px solid #666; }
                tr.subtotal td:first-child { text-align: right; text-transform: uppercase; }
                th.col-total,
                th.col-paid,
                th.col-due { font-size: 10px; }
                td.col-total,
                td.col-paid,
                td.col-due,
                tr.grand-total td.col-total,
                tr.grand-total td.col-paid,
                tr.grand-total td.col-due { font-size: 11px; font-weight: 700; }
                tr.grand-total td {
                    background-color: #f0f0f0 !important;
                    font-weight: 700;
                    border-top: 2px solid #999;
                }
                tr.grand-total td:first-child { text-align: right; text-transform: uppercase; }
                tr.grand-total td.col-due { font-size: 13px; border-bottom: 3px double #000; }
                .zero-dash { color: #999; font-size: 9px; font-weight: 400; }
                .dt span { white-space: nowrap; }   /* the date and the time stay whole, the time moves to the next line when the cell is too narrow */
                .dt span + span { margin-left: 8px; }
                td.fine-applied { font-weight: 700; }
                td.fine-na { color: #000; font-weight: 600; }   /* old: color #999; font-weight 400 (light grey dash) */
                .fine-legend { margin: -4px 0 8px; font-size: 8px; font-weight: 600; color: #000; }
                /* left column of the top band: the details box with the Overdue / Not Yet Due line under it (same width as the details box) */
                .top-left { flex: 3; display: flex; flex-direction: column; gap: 6px; }
                .top-left .info-grid { flex: 1; }
                .group-summary { display: flex; border: 1px solid #000; }
                .group-item { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 8px; }
                .group-item + .group-item { border-left: 1px solid #000; }
                .group-label { font-size: 8px; font-weight: 600; text-transform: uppercase; }
                .group-value { font-size: 11px; font-weight: 700; }
                .green { color: #000 !important; }
                .red { color: #000 !important; }
                .blue { color: #000 !important; }

                /* Status Badge */
                .status-badge {
                    padding: 2px 5px;
                    border-radius: 9px;
                    font-size: 9px;
                    font-weight: 700;
                }
                .status-paid { background-color: #dcfce7; color: #15803d; }
                .status-clear { background-color: #dbeafe; color: #1d4ed8; }
                .status-unpaid { background-color: #fee2e2; color: #dc2626; }
                .status-not-created { background-color: #f3f4f6; color: #374151; }

                /* History chain */
                .chain { display: flex; align-items: center; justify-content: center; gap: 2px; flex-wrap: wrap; color: black; }
                .chain small { font-size: 9px; color: black; }
                .chain .arrow { font-size: 8px; color: #555; }
                .chain .total-val { font-size: 10px; font-weight: 700; color: black; }
                .th-sub {
                    display: block;
                    font-size: 7px;
                    font-weight: 500;
                    color: #3d3d3d;
                    margin-top: 1px;
                }

                /* Student Details + Fee Summary (compact, black & white) */
                .top-band {
                    display: flex;
                    gap: 6px;
                    margin-bottom: 8px;
                }
                .info-grid {
                    flex: 3;
                    display: grid;
                    grid-template-columns: repeat(4, 1fr);
                    gap: 5px 10px;
                    align-content: space-between;
                    border: 1px solid #000;
                    padding: 6px 8px;
                }
                .info-item { display: flex; flex-direction: column; }
                /* highlighted field (Family Advance): grey box with a border, bigger value */
                .info-item.info-highlight { background-color: #e6e6e6 !important; border: 1px solid #000; padding: 2px 6px; }
                .info-item.info-highlight .info-label { font-weight: 700; }
                .info-item.info-highlight .info-value { font-size: 13px; }
                .info-label {
                    white-space: nowrap;
                    font-size: 8px;
                    font-weight: 600;
                    color: #000;
                    text-transform: uppercase;
                }
                .info-value {
                    font-size: 11px;
                    font-weight: 700;
                    color: #000;
                }
                .summary-grid {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    border: 1px solid #000;
                }
                .summary-card {
                    flex: 1;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    gap: 10px;
                    padding: 3px 8px;
                    border-top: 1px solid #000;
                }
                .summary-card:first-child { border-top: none; }
                .summary-card.dues { background-color: #e6e6e6 !important; border-top: 2px solid #000; }
                .summary-card.dues .summary-label { font-weight: 700; }
                .summary-card.dues .summary-value { font-size: 15px; }
                .summary-label {
                    font-size: 8px;
                    font-weight: 600;
                    color: #000;
                    text-transform: uppercase;
                }
                .summary-value {
                    font-size: 12px;
                    font-weight: 700;
                    color: #000;
                }
                .summary-section {
                    border: 1px solid #ddd;
                    margin: 11px 0;
                    padding: 9px;
                    background-color: #f9f9f9;
                    border-radius: 5px;
                }
                .summary-section h3 {
                    font-size: 11px;
                    font-weight: 700;
                    color: black;
                    text-align: center;
                    margin-bottom: 7px;
                }
                .summary-section ul {
                    list-style-type: none;
                    padding: 0;
                    margin: 0;
                }
                .summary-section li {
                    font-size: 9px;
                    color: black;
                    margin-bottom: 2px;
                    font-weight: 600;
                    line-height: 1.35;
                }
                .print-footer {
                    margin-top: 11px;
                    padding-top: 7px;
                    font-size: 10px;
                    color: rgb(56, 56, 56);
                    text-align: center;
                    font-weight: 700;
                }
            
                /* fixed column widths (see the colgroup of the table). old: automatic widths */
                .ledger-table { table-layout: fixed; }
                .report-bottom { page-break-inside: avoid; break-inside: avoid; display: flow-root; }
                .breakdown-title { font-size: 11px; font-weight: 700; text-transform: uppercase; margin: 0 0 4px; }
                .breakdown-table { width: 52%; margin-bottom: 0; }
                .sign-row { display: flex; justify-content: space-between; gap: 30px; margin: 34px 0 10px; }
                .sign-box { flex: 1; text-align: center; border-top: 1px solid #000; padding-top: 4px; font-size: 9px; font-weight: 600; text-transform: uppercase; }
                .page-measure { position: absolute; visibility: hidden; height: 281mm; width: 1px; }
                /* same width the printer uses (page 210mm - 2 x 7mm margin - body padding), applied only while measuring */
                body.measuring .student-report-page { width: calc(196mm - 10px) !important; }
    /* preview only */
    .print-btn { position: fixed; top: 12px; right: 16px; background: #000; color: #fff; border: 1px solid #000; padding: 7px 16px; font-size: 11px; font-weight: 600; cursor: pointer; }
    @media print { .print-btn { display: none !important; } }
</style>
</head>
<body>
<div class="page-measure" id="pageMeasure"></div>
<button class="print-btn" onclick="window.print()">Print</button>

<script>
    /* ================= DUMMY DATA (same shape as your APIs) ================= */
    var systemSettings = { school_name: "Ai Schooling System", school_logo: "https://i.postimg.cc/jqB2gpTG/image.png" };
    var FA = "6a23166bc0d803e8365bf1d1", FA_GEN = "6a23166bc0d803e8365bf1d2", FA_BANK = "6abe24c6c47ee1a2165d82f4";

    // Payment channels (id -> name), the same data getModeName / getSourceName read from
    var paymentChannels = [
        { _id: FA, mode_name: "Family Advance", sources: [{ _id: FA_GEN, source: "General" }, { _id: FA_BANK, source: "Bank" }] },
        { _id: "69f61a250ece5980ea7593d9", mode_name: "Cash", sources: [{ _id: "69f61a250ece5980ea7593da", source: "General" }, { _id: "6a99cd3ac6679a85f7c0ab5f", source: "Ayesha" }, { _id: "6a99cd4bc6679a85f7c0ab64", source: "Nimra" }] },
        { _id: "69f61a250ece5980ea7593db", mode_name: "Mobile Wallet", sources: [{ _id: "69f61a250ece5980ea7593dc", source: "General" }, { _id: "69f61a600ece5980ea7593f4", source: "Jazz Cash" }] },
        { _id: "69f61a250ece5980ea7593dd", mode_name: "Bank Transfer", sources: [{ _id: "69f61a250ece5980ea7593de", source: "General" }] }
    ];

    var studentDataFromOfFee = {
        student_name: "Adnan Ahmed", student_father_name: "Muhammad Kamran", general_registration_code: "BSS-STD-898",
        student_class_name: "NINE", student_section_name: "SUPER BARIAN", student_campus_name: "IQBAL TOWN",
        student_father_phone: 1256701817, student_status: "Active", family_credit: 78000,
        siblings_count: 2   // other children of this family (the app can take it from the family list: totalStudent.length - 1)
    };

    var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    var DISC_PAY = "2026-10-01T09:16:33.948Z";
    function mfee(i, year, o) {
        var m = MONTHS[i], mm = ("0" + (i + 1)).slice(-2), cur = year === "2026";
        var after = o.after != null ? o.after : 3000;
        return {
            fee_month: m, fee_year: year,
            due_date: cur ? year + "-" + mm + "-10T00:00:00.000Z" : "2026-10-08T00:00:00.000Z",
            late_fine: o.fine != null ? o.fine : (cur ? 300 : 0),
            fee_status: o.status || "Unpaid",
            fee_generation_date: cur ? year + "-" + mm + "-01T00:00:00.000Z" : "2026-10-01T00:00:00.000Z",
            actual_monthly_fee: 3000, monthly_fee_discount: o.disc || 0, paying_date: o.paying || null,
            monthly_fee_after_discount: after, message_cost: 0, paid_amount: o.paid || 0,
            partial_payment_history: o.partial || [], further_discount_history: o.further || [],
            due_date_history: [], late_fee_fine_discount_history: o.fineDisc || [],
            payment_method: o.paid ? "Family Credit" : undefined,
            payment_mode_id: o.mode, payment_mode_source_id: o.src, payment_recieved_by: o.by
        };
    }
    var paidFull = function (paying, src) { return { status: "Paid", paying: paying, paid: 3300, mode: FA, src: src, by: "DEMO" }; };

    var studentDues = {
        monthlyFee: [{ student: "67d6c5e7548e557c580d5959", fees: [
            mfee(0, "2026", { status: "Paid", paying: DISC_PAY, paid: 3300, mode: FA, src: FA_BANK, by: "DEMO" }),
            mfee(1, "2026", { status: "Paid", paying: DISC_PAY, paid: 3300, mode: FA, src: FA_BANK, by: "DEMO" }),
            mfee(2, "2026", { status: "Paid", paying: DISC_PAY, paid: 3300, mode: FA, src: FA_BANK, by: "DEMO" }),
            mfee(3, "2026", { paid: 100, partial: [{ amount: 100, date: DISC_PAY, payment_mode_id: FA, payment_mode_source_id: FA_BANK, payment_recieved_by: "DEMO" }] }),
            mfee(4, "2026", { fine: 200, fineDisc: [{ date: "2026-09-20T09:20:00.000Z", amount: 100, reason: "Fine Discount", discount_by: "DEMO", approved_by: "DEMO" }] }), mfee(5, "2026", {}), mfee(6, "2026", {}), mfee(7, "2026", {}), mfee(8, "2026", {}),
            mfee(9, "2026", { paid: 2500, partial: [{ amount: 2500, date: "2026-09-15T09:16:20.620Z", payment_mode_id: FA, payment_mode_source_id: FA_BANK, payment_recieved_by: "DEMO" }] }),
            mfee(10, "2026", { status: "Paid", paying: "2026-10-01T09:15:04.079Z", paid: 3000, mode: FA, src: FA_GEN, by: "DEMO" }),
            mfee(11, "2026", {}),
            mfee(0, "2025", { status: "Paid", paying: "2026-10-01T09:15:30.246Z", paid: 3000, mode: FA, src: FA_GEN, by: "DEMO",
                fineDisc: [{ date: "2026-10-01T09:15:30.246Z", amount: 0, reason: "Paid Without Fine", discount_by: "DEMO", approved_by: "DEMO" }] }),
            mfee(1, "2025", {}), mfee(2, "2025", {}), mfee(3, "2025", {}), mfee(4, "2025", {}),
            mfee(5, "2025", { status: "Paid", paying: "2026-10-01T09:16:42.926Z", paid: 2000, after: 2000, disc: 33, mode: FA, src: FA_BANK, by: "DEMO",
                further: [{ date: "2026-10-01T09:16:42.926Z", amount: 1000, reason: "Pay And Discount", discount_by: "DEMO", approved_by: "DEMO" }] }),
            mfee(6, "2025", {}), mfee(7, "2025", {}), mfee(8, "2025", {}), mfee(9, "2025", {}), mfee(10, "2025", {}), mfee(11, "2025", {})
        ] }],
        customFee: [
            { custom_fee_name: "CONTEEN FEE 2026", custom_fee_generate_date: "2026-10-31T19:05:36.930Z", actual_custom_fee: 4500, custom_fee_discount: 0,
              custom_fee_after_discount: 4500, custom_fee_fine: 300, custom_fee_due_date: "2026-11-10T00:00:00.000Z", paying_date: null,
              custom_fee_status: "Unpaid", paid_amount: 1500, payment_method: "Family Credit",
              partial_payment_history: [{ amount: 1500, date: "2026-09-01T09:15:15.255Z", payment_mode_id: FA, payment_mode_source_id: FA_GEN, payment_recieved_by: "DEMO" }],
              further_discount_history: [], late_fee_fine_discount_history: [] },
            { custom_fee_name: "STATIONARY FEE 2026", custom_fee_generate_date: "2026-10-31T19:06:38.125Z", actual_custom_fee: 1500, custom_fee_discount: 0,
              custom_fee_after_discount: 1500, custom_fee_fine: 300, custom_fee_due_date: "2026-11-10T00:00:00.000Z", paying_date: null,
              custom_fee_status: "Unpaid", paid_amount: 0, partial_payment_history: [], further_discount_history: [], late_fee_fine_discount_history: [] }
        ],
        transferFee: []
    };

    /* ================= SAME LOGIC AS Fee Payment.jsx ================= */
    function getModeName(id) {
        for (var i = 0; i < paymentChannels.length; i++) if (paymentChannels[i]._id === id) return paymentChannels[i].mode_name;
        return "";
    }
    function getSourceName(id) {
        for (var i = 0; i < paymentChannels.length; i++)
            for (var j = 0; j < paymentChannels[i].sources.length; j++) if (paymentChannels[i].sources[j]._id === id) return paymentChannels[i].sources[j].source;
        return "";
    }
    function toDateCA(v) { return v ? new Date(v).toLocaleDateString("en-CA") : ""; }
    function isFeeOverdue(o) {
        var due = toDateCA(o.dueDate);
        if (!due) return false;
        if (o.feeStatus === "Paid") return toDateCA(o.payingDate) > due;
        if (o.feeStatus === "Clear") return toDateCA(o.clearFeeDate) > due;
        return toDateCA(o.compareDate) > due;
    }

    // Build the rows exactly like getFeePaymentData does
    var today = new Date().toLocaleDateString("en-CA");
    var totalData = [];
    studentDues.monthlyFee.forEach(function (mf) {
        mf.fees.forEach(function (e) {
            var due = isFeeOverdue({ dueDate: e.due_date, compareDate: today, feeStatus: e.fee_status, payingDate: e.paying_date, clearFeeDate: e.clear_fee_date });
            totalData.push({
                title: "Fee Of " + e.fee_month + " " + e.fee_year, fee_month: e.fee_month, fee_year: e.fee_year, fee_generation_date: new Date(e.fee_generation_date), due: due, due_date: e.due_date,
                actual_fee: e.actual_monthly_fee, discount: e.monthly_fee_discount, fee_after_discount: e.monthly_fee_after_discount, fine: e.late_fine,
                total: due ? e.monthly_fee_after_discount + e.late_fine : e.monthly_fee_after_discount,
                dues: (due ? e.monthly_fee_after_discount + e.late_fine : e.monthly_fee_after_discount) - e.paid_amount,
                status: e.fee_status, paid_amount: e.paid_amount, partial_payment_history: e.partial_payment_history, paying_date: e.paying_date,
                payment_method: e.payment_method, further_discount_history: e.further_discount_history, late_fee_fine_discount_history: e.late_fee_fine_discount_history,
                payment_mode_id: e.payment_mode_id, payment_mode_source_id: e.payment_mode_source_id, payment_recieved_by: e.payment_recieved_by
            });
        });
    });
    studentDues.customFee.forEach(function (e) {
        var due = isFeeOverdue({ dueDate: e.custom_fee_due_date, compareDate: today, feeStatus: e.custom_fee_status, payingDate: e.paying_date, clearFeeDate: e.clear_fee_date });
        totalData.push({
            title: e.custom_fee_name, fee_generation_date: new Date(e.custom_fee_generate_date), due: due, due_date: e.custom_fee_due_date,
            actual_fee: e.actual_custom_fee, discount: e.custom_fee_discount, fee_after_discount: e.custom_fee_after_discount, fine: e.custom_fee_fine,
            paid_amount: e.paid_amount,
            total: due ? e.custom_fee_after_discount + e.custom_fee_fine : e.custom_fee_after_discount,
            dues: (due ? e.custom_fee_after_discount + e.custom_fee_fine : e.custom_fee_after_discount) - e.paid_amount,
            status: e.custom_fee_status, partial_payment_history: e.partial_payment_history, paying_date: e.paying_date, payment_method: e.payment_method,
            further_discount_history: e.further_discount_history, late_fee_fine_discount_history: e.late_fee_fine_discount_history,
            payment_mode_id: e.payment_mode_id, payment_mode_source_id: e.payment_mode_source_id, payment_recieved_by: e.payment_recieved_by
        });
    });
    var statusOrder = { Unpaid: 1, Paid: 2, Clear: 3 };
    totalData.sort(function (a, b) {
        var diff = new Date(b.fee_generation_date) - new Date(a.fee_generation_date);
        return diff !== 0 ? diff : statusOrder[a.status] - statusOrder[b.status];
    });


    /* ================= SAME CODE AS Fee Payment.jsx (formatTime / formatDateTime) ================= */
    function formatTime(isoDate) {
        if (!isoDate) return null;
    
        const date = new Date(isoDate);
    
        if (isNaN(date.getTime())) return null;
    
        // Don't return anything for 00:00:00
        if (
            date.getUTCHours() === 0 &&
            date.getUTCMinutes() === 0 &&
            date.getUTCSeconds() === 0
        ) {
            return null;
        }
    
        return date.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: true,
        });
    }
    
    function formatDateTime(isoDate) {
        if (!isoDate) return null;
    
        const date = new Date(isoDate);
        if (isNaN(date.getTime())) return null;
    
        const dateString = date.toLocaleDateString("pt-PT");
        const timeString = formatTime(isoDate);
        return timeString ? `${dateString} ${timeString}` : dateString;
    }
    
    

    /* ================= SAME CODE AS handlePrintReport (design copied as it is) ================= */
    var checkFamilyToggle = false;
    var printPages = [{ studentData: studentDataFromOfFee, feeData: totalData }];
        const getModeSourceStr = (i) => {
            const segments = [];

            if (i?.partial_payment_history?.length > 0) {
                segments.push(...i.partial_payment_history.map(p => ({
                    amount: p.amount,
                    mode_id: p.payment_mode_id,
                    date: p.date,
                    source_id: p.payment_mode_source_id,
                    recieved_by: p.payment_recieved_by,
                    type: 'partial'
                })));
            }

            const partialSum = i?.partial_payment_history?.reduce((sum, p) => sum + (p.amount || 0), 0) || 0;
            const quickPayAmount = (i.paid_amount || 0) - partialSum;
            if (quickPayAmount > 0) {
                segments.push({
                    amount: quickPayAmount,
                    mode_id: i.payment_mode_id,
                    date: i.paying_date,
                    source_id: i.payment_mode_source_id,
                    recieved_by: i.payment_recieved_by,
                    type: 'quick'
                });
            }

            if (segments.length === 0) {
                const mode = i.payment_mode_id ? getModeName(i.payment_mode_id) : '-';
                const source = i.payment_mode_source_id ? getSourceName(i.payment_mode_source_id) : '';
                return `${mode}${source ? ` / ${source}` : ''} ${i.payment_recieved_by ? `(${i.payment_recieved_by})` : ''}`;
            }

            if (segments.length === 1 && segments[0].type === 'quick') {
                const mode = segments[0].mode_id ? getModeName(segments[0].mode_id) : '-';
                const source = segments[0].source_id ? getSourceName(segments[0].source_id) : '';
                return `${mode}${source ? ` / ${source}` : ''} ${segments[0].recieved_by ? `(${segments[0].recieved_by})` : ''}`;
            }

            return segments.map(seg => {
                const mode = seg.mode_id ? getModeName(seg.mode_id) : '-';
                const source = seg.source_id ? getSourceName(seg.source_id) : '';
                return `${seg.amount} = ${mode}${source ? ` / ${source}` : ''} ${seg.date ? `(${formatDateTime(seg.date)})` : ''} ${seg.recieved_by ? `(${seg.recieved_by})` : ''}`;
            }).join('<br/>');
        };

        const getAmountDateHistoryStr = (history) => {
            if (!history?.length) return null;
            return history.map(entry => {
                const dateStr = entry.date ? new Date(entry.date).toLocaleDateString("pt-PT") : '-';
                return `dis ${entry.amount} (${dateStr})`;
            }).join('<br/>');
        };

        const getFinePrintStr = (item) => {
            const fineHistory = item.late_fee_fine_discount_history || [];
            const currentFine = Number(item.fine || 0).toLocaleString();

            if (fineHistory.length > 0) {
                const totalFineDiscount = fineHistory.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
                const fineSteps = [];
                let runningFine = (item.fine || 0) + totalFineDiscount;

                fineSteps.push(runningFine);
                fineHistory.forEach(h => {
                    runningFine -= Number(h.amount || 0);
                    fineSteps.push(runningFine);
                });

                const formatDashDate = (date) => {
                    if (!date) return '-';
                    const d = new Date(date);
                    return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
                };

                const startLine = `Initial Fine: ${Number(fineSteps[0]).toLocaleString()}`;
                const historyLines = fineHistory.map((entry, i) => {
                    const fineAtStep = Number(fineSteps[i + 1]).toLocaleString();
                    return `dis ${entry.amount} (${formatDashDate(entry.date)})`;
                }).join('<br/>');

                return `${startLine}<br/>${historyLines}<br/>Current Fine: ${currentFine}`;
            }

            return currentFine;
        };

        // Simple report helpers
        const formatLedgerDate = (value) => {
            if (!value) return '-';
            const d = new Date(value);
            return isNaN(d.getTime()) ? '-' : d.toLocaleDateString("en-GB", { day: '2-digit', month: 'short', year: 'numeric' });
        };
        const formatLedgerDateTime = (value) => {
            if (!value) return '<span class="zero-dash">-</span>';
            const d = new Date(value);
            if (isNaN(d.getTime())) return '<span class="zero-dash">-</span>';
            const midnight = d.getUTCHours() === 0 && d.getUTCMinutes() === 0 && d.getUTCSeconds() === 0;   // no time stored
            const time = midnight ? '' : d.toLocaleTimeString("en-US", { hour: 'numeric', minute: '2-digit', hour12: true });
            return `<span class="dt"><span>${formatLedgerDate(value)}</span>${time ? `<span>${time}</span>` : ''}</span>`;
        };
        const amountOrDash = (value) => (Number(value || 0) !== 0 ? Number(value).toLocaleString() : '<span class="zero-dash">-</span>');

        const buildStudentReportPage = (currentStudentData, studentFeeData, isLastPage) => {
            let totalExpectedFeePrint = 0;
            let totalCollectedFeePrint = 0;
            let totalPendingFeePrint = 0;
            let totalDiscountPrint = 0;
            let totalActualFeePrint = 0;
            let totalFeeAfterDiscountPrint = 0;
            let totalFurtherDiscountPrint = 0;
            let totalFinePrint = 0;
            let totalFineDiscountPrint = 0;
            // Group totals: Overdue = dues of unpaid fees past their due date, Not Yet Due = dues of unpaid fees not due yet (Overdue + Not Yet Due = Dues)
            let overdueDuesPrint = 0, overdueCountPrint = 0, notYetDueDuesPrint = 0, notYetDueCountPrint = 0;
            studentFeeData.forEach(item => {
                if (Number(item.dues || 0) > 0) {
                    if (item.due) { overdueDuesPrint += Number(item.dues || 0); overdueCountPrint++; }
                    else { notYetDueDuesPrint += Number(item.dues || 0); notYetDueCountPrint++; }
                }
            });

            studentFeeData.forEach(item => {
                totalExpectedFeePrint += item.total || 0;
                totalCollectedFeePrint += item.paid_amount || 0;
                totalPendingFeePrint += item.dues || 0;

                // Discount = fee discount + further discount (actual fee - fee after discount) + fine discount
                const feeDiscountAmount = Math.max(0, Number(item.actual_fee || 0) - Number(item.fee_after_discount || 0));
                const fineDiscountAmount = (item.late_fee_fine_discount_history || []).reduce((sum, d) => sum + Number(d.amount || 0), 0);
                totalDiscountPrint += feeDiscountAmount + fineDiscountAmount;

                // Grand total row (same figures the table columns show)
                const furtherDiscountAmount = (item.further_discount_history || []).reduce((sum, d) => sum + Number(d.amount || 0), 0);
                totalActualFeePrint += Number(item.actual_fee || 0);
                totalFeeAfterDiscountPrint += Number(item.fee_after_discount || 0) + furtherDiscountAmount;
                totalFurtherDiscountPrint += furtherDiscountAmount;
                totalFinePrint += item.due ? Number(item.fine || 0) : 0;   // only fines that are included in Total
                totalFineDiscountPrint += fineDiscountAmount;
            });

            // Collection Percentage stat (commented out, not used for now)
            // const collectionPercPrint = totalExpectedFeePrint > 0
            //     ? Math.round((totalCollectedFeePrint / totalExpectedFeePrint) * 100)
            //     : 0;

            // Date wise breakdown: how much was received and how much discount was given on each date
            const dateBreakdown = {};
            const addToDate = (value, field, amount) => {
                const n = Number(amount || 0);
                if (!value || !n) return;
                const key = new Date(value).toLocaleDateString('en-CA');
                dateBreakdown[key] = dateBreakdown[key] || { received: 0, discount: 0 };
                dateBreakdown[key][field] += n;
            };
            studentFeeData.forEach(item => {
                const partials = item.partial_payment_history || [];
                const partialSum = partials.reduce((sum, p) => sum + Number(p.amount || 0), 0);
                partials.forEach(p => addToDate(p.date, 'received', p.amount));
                addToDate(item.paying_date, 'received', Number(item.paid_amount || 0) - partialSum);   // full / quick payment
                (item.further_discount_history || []).forEach(d => addToDate(d.date, 'discount', d.amount));
                (item.late_fee_fine_discount_history || []).forEach(d => addToDate(d.date, 'discount', d.amount));
            });
            const breakdownDates = Object.keys(dateBreakdown).sort();
            const datedReceived = breakdownDates.reduce((sum, k) => sum + dateBreakdown[k].received, 0);
            const datedDiscount = breakdownDates.reduce((sum, k) => sum + dateBreakdown[k].discount, 0);
            // amounts that have no date (for example the discount given when the fee was generated)
            const undatedReceived = Math.max(0, totalCollectedFeePrint - datedReceived);
            const undatedDiscount = Math.max(0, totalDiscountPrint - datedDiscount);

            // Group the fees: Overdue (unpaid and past due), Not Yet Due (unpaid, due date in the future), Paid
            const monthOrder = (i) => (i.fee_month && i.fee_year ? Number(i.fee_year) * 12 + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'].indexOf(i.fee_month) : 0);
            const byDueDate = (a, b) => (new Date(a.due_date) - new Date(b.due_date)) || (monthOrder(a) - monthOrder(b)) || (new Date(a.fee_generation_date) - new Date(b.fee_generation_date)) || String(a.title).localeCompare(String(b.title));
            const feeGroups = [
                { label: 'Overdue', rows: studentFeeData.filter(i => Number(i.dues || 0) > 0 && i.due).sort(byDueDate) },
                { label: 'Not Yet Due', rows: studentFeeData.filter(i => Number(i.dues || 0) > 0 && !i.due).sort(byDueDate) },
                { label: 'Paid', rows: studentFeeData.filter(i => Number(i.dues || 0) <= 0).sort((a, b) => (new Date(b.paying_date || 0) - new Date(a.paying_date || 0)) || byDueDate(a, b)) },   // old: .sort(byDueDate)
            ].filter(g => g.rows.length > 0);
            const orderedFees = [];
            // The fees are only sorted in this order (Overdue, Not Yet Due, Paid). Set this to true to show

            const showGroupRows = false;
            feeGroups.forEach(g => {

                g.rows.forEach(i => orderedFees.push(i));
                if (showGroupRows) orderedFees.push({

                        label: g.label,

            let srCounter = 0;

            return `

                        ${'' /* <div class="report-sub">${currentStudentData?.student_name || '-'} (${currentStudentData?.general_registration_code || '-'}) &nbsp;|&nbsp; As of ${formatLedgerDate(new Date())}</div> */}
                    </div>
                    <div style="opacity: 0; width: 56px;"></div>
                </div>

                <!-- Student Details + Fee Summary (one row) -->
                <div class="top-band">
                <div class="top-left">
                <div class="info-grid">
                    <div class="info-item"><span class="info-label">Student Name</span><span class="info-value">${currentStudentData?.student_name || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Father Name</span><span class="info-value">${currentStudentData?.student_father_name || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Reg #</span><span class="info-value">${currentStudentData?.general_registration_code || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Status</span><span class="info-value">${currentStudentData?.student_status || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Class / Section</span><span class="info-value">${currentStudentData?.student_class_name || '-'} / ${currentStudentData?.student_section_name || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Campus</span><span class="info-value">${currentStudentData?.student_campus_name || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Phone</span><span class="info-value">${currentStudentData?.student_father_phone || '-'}</span></div>
                    <div class="info-item info-highlight"><span class="info-label">Family Advance (Sibling: ${Number(currentStudentData?.siblings_count || 0)})</span><span class="info-value">Rs. ${Number(currentStudentData?.family_credit || 0).toLocaleString()}</span></div>
                </div>

                <!-- Overdue / Not Yet Due totals -->
                <div class="group-summary">
                    <div class="group-item"><span class="group-label">Overdue (${overdueCountPrint} ${overdueCountPrint === 1 ? 'fee' : 'fees'}) =</span><span class="group-value">${amountOrDash(overdueDuesPrint)}</span></div>
                    <div class="group-item"><span class="group-label">Not Yet Due (${notYetDueCountPrint} ${notYetDueCountPrint === 1 ? 'fee' : 'fees'}) =</span><span class="group-value">${amountOrDash(notYetDueDuesPrint)}</span></div>
                </div>
                </div>

                <div class="summary-grid">
                    <div class="summary-card"><span class="summary-label">Receivable =</span><span class="summary-value">${Number((totalExpectedFeePrint || 0) + (totalDiscountPrint || 0)).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Discount =</span><span class="summary-value">${Number(totalDiscountPrint || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Received =</span><span class="summary-value">${Number(totalCollectedFeePrint || 0).toLocaleString()}</span></div>
                    <div class="summary-card dues"><span class="summary-label">Dues =</span><span class="summary-value">${Number(totalPendingFeePrint || 0).toLocaleString()}</span></div>
                    ${'' /* <div class="summary-card"><span class="summary-label">Collection Percentage</span><span class="summary-value">${collectionPercPrint}%</span></div> */}
                </div>
                </div>

                <!-- Summary Section
                <div class="summary-section">
                    <h3>Summary (Calculation Formula)</h3>
                    <ul>
                        <li>Net Receivable = Sum Of All Total (If fee is overdue, fine is included).</li>
                        <li>Received = Sum Of Paid Amount.</li>
                        <li>Dues = Sum Of Dues (Total - Paid).</li>
                        <li>Collection Percentage = (Collected Fee ÷ Expected Fee) x 100.</li>
                    </ul>
                </div>-->

                <!-- Data Table -->
                <div style="overflow: auto; margin-bottom: 11px;">
                    <table class="ledger-table">
                        <colgroup><col style="width:5%"><col style="width:16%"><col style="width:10%"><col style="width:16.5%"><col style="width:6.5%"><col style="width:8%"><col style="width:7.5%"><col style="width:8%"><col style="width:7%"><col style="width:7%"><col style="width:8.5%"></colgroup>
                        <thead>
                            <tr>
                                <th class="align-center">Sr #</th>
                                <th>Fee Title</th>
                                ${'' /* <th>Status</th> */}
                                <th>Due Date</th>
                                <th>Paying Date</th>
                                ${'' /* <th>Mode / Source (User)</th> */}
                                ${'' /* <th>Due</th> */}
                                <th class="align-right">Actual Fee</th>
                                ${'' /* <th>Disc</th> */}
                                <th class="align-right">After Discount</th>
                                <th class="align-right">Further Disc</th>
                                <th class="align-right">Fine</th>
                                <th class="align-right col-total">Total</th>
                                <th class="align-right col-paid">Paid</th>
                                <th class="align-right col-due">Fee Dues</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${studentFeeData?.length > 0 ? orderedFees.map((item, index) => {
                if (item.__band) {
                    const band = item.__band;
                    return `
                                    <tr class="band">
                                        <td colspan="11">${band.label} - ${band.count} ${band.count === 1 ? 'fee' : 'fees'}</td>
                                    </tr>`;
                }
                if (item.__subtotal) {
                    const sub = item.__subtotal;
                    return `
                                    <tr class="subtotal">
                                        <td colspan="8">${sub.label} Subtotal</td>
                                        <td class="align-right">${sub.total.toLocaleString()}</td>
                                        <td class="align-right">${amountOrDash(sub.paid)}</td>
                                        <td class="align-right">${amountOrDash(sub.dues)}</td>
                                    </tr>`;
                }
                const fdHistory = item.further_discount_history || [];
                const furtherDiscountTotal = fdHistory.reduce((sum, d) => sum + Number(d.amount || 0), 0);
                // Simple report: direct values only (full history with amount + date is commented out)
                // const furtherDiscountHtml = getAmountDateHistoryStr(fdHistory) || '0';
                // const fineHtml = getFinePrintStr(item);
                const furtherDiscountHtml = amountOrDash(furtherDiscountTotal);
                // Fine states: applied (overdue, included in Total) = bold + underlined, waived = struck-through original,
                // not applicable (fee not overdue) = light grey dash
                const currentFine = Number(item.fine || 0);
                const fineDiscountAmount = (item.late_fee_fine_discount_history || []).reduce((sum, d) => sum + Number(d.amount || 0), 0);
                const fineClass = item.due ? 'fine-applied' : 'fine-na';
                // new: applicable = underlined fine + check mark, not applicable = fine + cross mark, zero fine = light grey dash
                // old: applicable = bold underlined, not applicable = light grey dash
                // only the current fine is shown (the struck-through original fine, before the fine discount, is not shown any more).
                // old: fineDiscountAmount > 0 ? `<s>${(currentFine + fineDiscountAmount).toLocaleString()}</s> ${...current fine...}` : ...
                const fineHtml = currentFine === 0
                    ? '<span class="zero-dash">-</span>'
                    : (item.due ? `${currentFine.toLocaleString()} &#10003;` : `${currentFine.toLocaleString()} &#10007;`);   // old: the applied fine was underlined (<u>...</u>)

                return `
                                    <tr class="row">
                                        <td class="align-center">${++srCounter}</td>
                                        <td class="td-fee-title">${item.title}</td>
                                        ${'' /* <td>${item.status}${item.payment_method === 'Online Payment' ? ' (Online)' : ''}</td> */}
                                        <td class="nowrap">${item.due ? `<u>${formatLedgerDate(item.due_date)}</u>` : formatLedgerDate(item.due_date)}</td>   ${'' /* overdue due date = underlined (item.due) */}
                                        <td>${formatLedgerDateTime(item.paying_date)}</td>   <!-- old: class="nowrap", the text could run out of the cell -->
                                        ${'' /* <td class="blue">${getModeSourceStr(item)}</td> */}
                                        ${'' /* <td>${item.due ? 'Yes' : 'No'}</td> */}
                                        <td class="align-right">${Number(item.actual_fee || 0).toLocaleString()}</td>
                                        ${'' /* <td class="blue">${item.discount || 0}%</td> */}
                                        <td class="align-right">${(Number(item.fee_after_discount || 0) + furtherDiscountTotal).toLocaleString()}</td>
                                        <td class="align-right">${furtherDiscountHtml}</td>
                                        <td class="align-right ${fineClass}">${fineHtml}</td>
                                        <td class="align-right col-total">${Number(item.total || 0).toLocaleString()}</td>
                                        <td class="align-right col-paid">${amountOrDash(item.paid_amount)}</td>
                                        <td class="align-right col-due">${amountOrDash(item.dues)}</td>
                                    </tr>
                                `;
            }).join('') : `<tr><td colspan="11" style="text-align: center; padding: 17px; font-size: 9px;">No Records Found!</td></tr>`}
                        </tbody>
                        ${studentFeeData?.length > 0 ? `
                        <tbody class="grand-total-body">
                            <tr class="grand-total">
                                <td colspan="4">Grand Total</td>
                                <td class="align-right">${totalActualFeePrint.toLocaleString()}</td>
                                <td class="align-right">${totalFeeAfterDiscountPrint.toLocaleString()}</td>
                                <td class="align-right">${totalFurtherDiscountPrint.toLocaleString()}</td>
                                <td class="align-right">${totalFinePrint.toLocaleString()}</td>
                                <td class="align-right col-total">${Number(totalExpectedFeePrint || 0).toLocaleString()}</td>
                                <td class="align-right col-paid">${Number(totalCollectedFeePrint || 0).toLocaleString()}</td>
                                <td class="align-right col-due">${Number(totalPendingFeePrint || 0).toLocaleString()}</td>
                            </tr>
                        </tbody>` : ''}
                    </table>
                </div>
                <div class="fine-legend"><u>Underlined</u> due date = overdue (unpaid and past its due date, or paid after it) &nbsp;|&nbsp; 300 &#10003; = fine applied (fee overdue, included in Total) &nbsp;|&nbsp; 300 &#10007; = fine not applicable (fee not overdue) &nbsp;|&nbsp; - = nothing / zero</div>
                <div class="bottom-spacer"></div>
                <div class="report-bottom">
                    ${(breakdownDates.length > 0 || undatedReceived > 0 || undatedDiscount > 0) ? `
                    <div class="breakdown-title">Date Wise Breakdown</div>

                        <thead>

                        <tbody>
                            ${breakdownDates.map(k => `
                            <tr>
                                <td class="nowrap">${formatLedgerDate(k + 'T12:00:00')}</td>
                                <td class="align-right">${amountOrDash(dateBreakdown[k].discount)}</td>
                                <td class="align-right">${amountOrDash(dateBreakdown[k].received)}</td>
                            </tr>`).join('')}
                            ${(undatedReceived > 0 || undatedDiscount > 0) ? `
                            <tr>
                                <td>Date not recorded</td>
                                <td class="align-right">${amountOrDash(undatedDiscount)}</td>
                                <td class="align-right">${amountOrDash(undatedReceived)}</td>
                            </tr>` : ''}
                            <tr class="grand-total">
                                <td>Total</td>
                                <td class="align-right">${Number(totalDiscountPrint || 0).toLocaleString()}</td>
                                <td class="align-right">${Number(totalCollectedFeePrint || 0).toLocaleString()}</td>
                            </tr>
                        </tbody>
                    </table>` : ''}
                    <!-- Signature lines (removed for now)
                    <div class="sign-row">
                        <div class="sign-box">Prepared By</div>
                        <div class="sign-box">Checked By</div>
                        <div class="sign-box">Parent Signature</div>
                    </div>
                    <div class="fine-legend"><u>Underlined</u> due date = overdue &nbsp;|&nbsp; <u>Underlined</u> fine = included in Total &nbsp;|&nbsp; <s>Struck-through</s> = fine discount &nbsp;|&nbsp; - = fine not applicable (fee not overdue)</div>
                    -->
                    <div class="print-footer">
                        Generated on: ${new Date().toLocaleDateString("pt-PT")} | Powered by Ai Schooling System.com
                    </div>
                </div>
            </div>
            `;
        };


    var pagesWithFees = printPages.filter(function (page) { return page.feeData.length > 0; });
    var pagesToRender = pagesWithFees.length > 0 ? pagesWithFees : printPages;
    document.body.insertAdjacentHTML("beforeend", pagesToRender.map(function (page, index) { return buildStudentReportPage(page.studentData, page.feeData, index === pagesToRender.length - 1); }).join(""));

    /* ================= RUNNING HEADER (student) + PAGE NUMBERS, printed in the page margin ================= */
    (function () {
        var first = pagesToRender[0] && pagesToRender[0].studentData;
        var name = pagesToRender.length === 1 && first ? String(first.student_name || "") + " | " + String(first.general_registration_code || "") : "Student Fee Ledger";
        name = name.split('"').join("");
        var css = "@page { @top-left { content: \"" + name + "\"; font-size: 8px; color: #444; } @bottom-right { content: \"Page \" counter(page) \" of \" counter(pages); font-size: 8px; color: #444; } }" +
                  "@page :first { @top-left { content: \"\"; } }";
        var st = document.createElement("style");
        st.textContent = css;
        document.head.appendChild(st);
    })();

    /* ================= PIN THE FINE NOTE + GENERATED LINE TO THE END OF THE LAST PRINTED PAGE ================= */
    function fitBottomBlocks() {
        var pageH = document.getElementById("pageMeasure").getBoundingClientRect().height;
        var pages = document.querySelectorAll(".student-report-page");
        pages.forEach(function (pg) { pg.querySelector(".bottom-spacer").style.height = "0px"; });
        document.body.classList.add("measuring");
        pages.forEach(function (pg) {
            var spacer = pg.querySelector(".bottom-spacer"), block = pg.querySelector(".report-bottom"), table = pg.querySelector(".ledger-table");
            var pageTop = pg.getBoundingClientRect().top;
            var theadH = table ? table.querySelector("thead").getBoundingClientRect().height : 0;
            var rows = table ? table.querySelectorAll("tbody tr") : [];
            // walk the rows like the printer does: a row that does not fit moves to the next page,
            // and the table header is repeated at the top of that page
            var shift = 0;
            for (var i = 0; i < rows.length; i++) {
                var rect = rows[i].getBoundingClientRect();
                var top = rect.top - pageTop + shift;
                var bottom = rect.bottom - pageTop + shift;
                var page = Math.floor(top / pageH);
                if (bottom > (page + 1) * pageH) { shift += (page + 1) * pageH + theadH - top; }
            }
            var contentEnd = spacer.getBoundingClientRect().top - pageTop + shift;
            var blockH = block.getBoundingClientRect().height;
            var pagesNeeded = Math.max(1, Math.ceil((contentEnd + blockH) / pageH));
            var spare = pagesNeeded * pageH - contentEnd - blockH - 24;   // 24px safety
            spacer.style.height = Math.max(0, spare) + "px";
        });
        document.body.classList.remove("measuring");
    }
    window.addEventListener("beforeprint", fitBottomBlocks);
    window.addEventListener("afterprint", function () {
        document.querySelectorAll(".bottom-spacer").forEach(function (sp) { sp.style.height = "0px"; });
    });
</script>
</body>
</html>
