                    padding: 0;

                }

                    margin: 7mm;
                }
                html {
                    -webkit-print-color-adjust: exact !important;
                    print-color-adjust: exact !important;
                }
                body {
                    background: white;
                    font-size: 9px;
                    line-height: 1.2;
                    padding: 5px;
                    -webkit-print-color-adjust: exact !important;
                    print-color-adjust: exact !important;
                }
                .student-report-page {
                    page-break-after: always;
                    break-after: page;
                }
                .student-report-page.last-page {
                    page-break-after: auto;
                    break-after: auto;
                }

                .header-section {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 8px;
                    border-bottom: 1px solid #000;

                .report-sub { font-size: 9px; font-weight: 600; color: #000; margin-top: 1px; }
                .header-section h1 {
                    font-size: 17px;
                    font-weight: 700;
                    margin-bottom: 2px;
                    color: black;
                }
                .header-section h2 {
                    font-size: 12px;
                    font-weight: 700;
                    margin-bottom: 4px;
                    color: black;
                }
                .header-logo {
                    width: 56px;
                    height: 56px;
                    object-fit: contain;
                    border-radius: 5px;
                }

                /* Table Styles (same bordered, plain table as the Family Advance Ledger report) */
                table {
                    width: 100%;
                    border-collapse: collapse;
                }
                th, td {
                    border: 1px solid #999;
                    padding: 4px;
                    text-align: left;
                    font-weight: 600;
                    color: #000;
                    vertical-align: middle;
                }
                /* header cells: original size */
                th {
                    font-size: 9px;
                    background-color: #f0f0f0 !important;

                /* body cells: original size */

                    font-size: 9px;
                }
                thead { display: table-header-group; }
                tr { page-break-inside: avoid; }
                .align-right { text-align: right; }
                .align-center { text-align: center; }

                tr.row td { border-top: 1px solid #d4d4d4; border-bottom: 1px solid #d4d4d4; }

                .fine-split { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 3px; }
                .fine-split > s, .fine-split > span { white-space: nowrap; }
                .fine-split > span { margin-left: auto; }
                /* Grand Total, Fine cell: two small boxes side by side, APL (fine applied) and DISC (fine discount), each with its amount under it */
                /* the waived (discounted) fine amount is not bold: the struck-through original fine in the rows and the DISC box in the Grand Total row */
                .fine-split > s { font-weight: 400; }
                .fine-pair b { font-weight: 400; }   /* both amounts (DISC and APL) are normal weight. old: only DISC was normal, APL was bold (700) */
                td.fine-pair-cell { padding: 0 !important; }
                .fine-pair { display: flex; }
                .fine-pair > div { flex: 1; display: flex; flex-direction: column; align-items: stretch; text-align: center; }
                .fine-pair > div + div { border-left: 1px solid #999; }
                .fine-pair span { font-size: 7px; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid #999; padding: 1px 2px; background: #e6e6e6; }

                .fine-split > s { text-decoration: none; position: relative; }
                .fine-split > s::after { content: ""; position: absolute; left: 0; right: 0; top: 1.5px; bottom: 1px; background: linear-gradient(to bottom right, transparent calc(50% - 0.35px), #000 calc(50% - 0.35px), #000 calc(50% + 0.35px), transparent calc(50% + 0.35px)); }

                tr.subtotal td { background-color: #f3f3f3 !important; font-weight: 700; border-top: 1px solid #666; }
                tr.subtotal td:first-child { text-align: right; text-transform: uppercase; }

                .zero-dash { color: #999; font-size: 9px; font-weight: 400; }

                .dt span + span { margin-left: 8px; }

                .report-bottom { page-break-inside: avoid; break-inside: avoid; display: flow-root; }
                .breakdown-title { font-size: 11px; font-weight: 700; text-transform: uppercase; margin: 0 0 4px; }

                .page-measure { position: absolute; visibility: hidden; height: 281mm; width: 1px; }

    /* preview only */

    @media print { .print-btn { display: none !important; } }
</style>

                    <div class="group-item"><span class="group-label">Overdue (${overdueCountPrint} ${overdueCountPrint === 1 ? 'fee' : 'fees'}) =</span><span class="group-value">${amountOrDash(overdueDuesPrint)}</span></div>
                    <div class="group-item"><span class="group-label">Not Yet Due (${notYetDueCountPrint} ${notYetDueCountPrint === 1 ? 'fee' : 'fees'}) =</span><span class="group-value">${amountOrDash(notYetDueDuesPrint)}</span></div>
                </div>
                </div>

                <!-- Step by step amounts: every line is one column of the Grand Total row, read from top to bottom
                     Fee After Discount, Discount (further + fine), Fine Applied = Net Receivable (= Total column), - Received (= Paid column) = Dues -->
                <div class="summary-grid">
                    <div class="summary-card"><span class="summary-label">Receivable</span><span class="summary-value">${Number(totalFeeAfterDiscountPrint || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Disc (Further Fee + Fine)</span><span class="summary-value">${((totalFurtherDiscountPrint || 0) + (totalFineDiscountPrint || 0)) ? '-' : ''}${Number((totalFurtherDiscountPrint || 0) + (totalFineDiscountPrint || 0)).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Fine Applied</span><span class="summary-value">${(totalFinePrint || 0) ? '+' : ''}${Number(totalFinePrint || 0).toLocaleString()}</span></div>
                    ${clearedWaivedPrint !== 0 ? `<div class="summary-card"><span class="summary-label">Cleared Fee Waived</span><span class="summary-value">${clearedWaivedPrint > 0 ? "-" : "+"}${Math.abs(clearedWaivedPrint).toLocaleString()}</span></div>` : ''}
                    <div class="summary-card result"><span class="summary-label">= Net Receivable</span><span class="summary-value">${Number(totalExpectedFeePrint || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Received</span><span class="summary-value">${Number(totalCollectedFeePrint || 0).toLocaleString()}</span></div>
                    <div class="summary-card dues"><span class="summary-label">= Dues</span><span class="summary-value">${Number(totalPendingFeePrint || 0).toLocaleString()}</span></div>
                    ${'' /* previous version (commented out): + Fine and - Discount (Further + Fine) lines with + / - signs in the labels:
                    <div class="summary-card"><span class="summary-label">Fee After Discount</span><span class="summary-value">${Number(totalFeeAfterDiscountPrint || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">+ Fine</span><span class="summary-value">${Number((totalFinePrint || 0) + (totalFineDiscountPrint || 0)).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">- Discount (Further + Fine)</span><span class="summary-value">${Number((totalFurtherDiscountPrint || 0) + (totalFineDiscountPrint || 0)).toLocaleString()}</span></div>
                    ${clearedWaivedPrint !== 0 ? `<div class="summary-card"><span class="summary-label">- Cleared Fee Waived</span><span class="summary-value">${Number(clearedWaivedPrint).toLocaleString()}</span></div>` : ''}
                    <div class="summary-card result"><span class="summary-label">= Net Receivable</span><span class="summary-value">${Number(totalExpectedFeePrint || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">- Received</span><span class="summary-value">${Number(totalCollectedFeePrint || 0).toLocaleString()}</span></div>
                    <div class="summary-card dues"><span class="summary-label">= Dues</span><span class="summary-value">${Number(totalPendingFeePrint || 0).toLocaleString()}</span></div>
                    */}
                    ${'' /* previous version (commented out): separate lines - Further Discount, = Net Fee, + Fine, - Fine Discount and a Total Discount note under Dues:
                    <div class="summary-card"><span class="summary-label">- Further Discount</span><span class="summary-value">${Number(totalFurtherDiscountPrint || 0).toLocaleString()}</span></div>
                    <div class="summary-card result"><span class="summary-label">= Net Fee</span><span class="summary-value">${Number((totalFeeAfterDiscountPrint || 0) - (totalFurtherDiscountPrint || 0)).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">+ Fine</span><span class="summary-value">${Number((totalFinePrint || 0) + (totalFineDiscountPrint || 0)).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">- Fine Discount</span><span class="summary-value">${Number(totalFineDiscountPrint || 0).toLocaleString()}</span></div>
                    <div class="summary-card note"><span class="summary-label">Total Discount (Further + Fine)</span><span class="summary-value">${Number((totalFurtherDiscountPrint || 0) + (totalFineDiscountPrint || 0)).toLocaleString()}</span></div>
                    */}
                    ${'' /* <div class="summary-card note"><span class="summary-label">Fine Waived (not charged)</span><span class="summary-value">${Number(totalFineDiscountPrint || 0).toLocaleString()}</span></div> */}
                    ${'' /* old cards:
                    <div class="summary-card"><span class="summary-label">Receivable =</span><span class="summary-value">${Number((totalExpectedFeePrint || 0) + (totalDiscountPrint || 0)).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Discount =</span><span class="summary-value">${Number(totalDiscountPrint || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Received =</span><span class="summary-value">${Number(totalCollectedFeePrint || 0).toLocaleString()}</span></div>
                    <div class="summary-card dues"><span class="summary-label">Dues =</span><span class="summary-value">${Number(totalPendingFeePrint || 0).toLocaleString()}</span></div> */}
                    ${'' /* <div class="summary-card"><span class="summary-label">Collection Percentage</span><span class="summary-value">${collectionPercPrint}%</span></div> */}
                </div>
                </div>

                <!-- Summary Section
                <div class="summary-section">
                    <h3>Summary (Calculation Formula)</h3>
                    <ul>
                        <li>Net Receivable = Sum Of All Total (If fee is overdue, fine is included).</li>
                        <li>Received = Sum Of Paid Amount.</li>
                        <li>Dues = Sum Of Dues (Total - Paid).</li>
                        <li>Collection Percentage = (Collected Fee ÷ Expected Fee) x 100.</li>
                    </ul>
                </div>-->

                <!-- Data Table -->
                <div style="overflow: auto; margin-bottom: 11px;">
                    <table class="ledger-table">
                        <colgroup><col style="width:4.5%"><col style="width:16.6%"><col style="width:9.5%"><col style="width:15.9%"><col style="width:6.7%"><col style="width:8.2%"><col style="width:7.2%"><col style="width:9.7%"><col style="width:6.9%"><col style="width:6.9%"><col style="width:7.9%"></colgroup>
                        <thead>
                            <tr>
                                <th class="align-center">Sr #</th>
                                <th>Fee Title</th>
                                ${'' /* <th>Status</th> */}
                                <th>Due Date</th>
                                <th>Paying Date</th>
                                ${'' /* <th>Mode / Source (User)</th> */}
                                ${'' /* <th>Due</th> */}
                                <th class="align-right">Actual Class Fee</th>${'' /* old heading: Actual Fee */}
                                ${'' /* <th>Disc</th> */}
                                <th class="align-right">Fee After Discount</th>${'' /* old heading: After Discount */}
                                <th class="align-right">Further Fee Disc</th>${'' /* old heading: Further Disc */}
                                <th class="align-right">Fine</th>
                                <th class="align-right col-total">Total</th>
                                <th class="align-right col-paid">Paid</th>
                                <th class="align-right col-due">Fee Dues</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${studentFeeData?.length > 0 ? orderedFees.map((item, index) => {
                if (item.__band) {
                    const band = item.__band;
                    return `
                                    <tr class="band">
                                        <td colspan="11">${band.label} - ${band.count} ${band.count === 1 ? 'fee' : 'fees'}</td>
                                    </tr>`;
                }
                if (item.__subtotal) {
                    const sub = item.__subtotal;
                    return `
                                    <tr class="subtotal">
                                        <td colspan="8">${sub.label} Subtotal</td>
                                        <td class="align-right">${sub.total.toLocaleString()}</td>
                                        <td class="align-right">${amountOrDash(sub.paid)}</td>
                                        <td class="align-right">${amountOrDash(sub.dues)}</td>
                                    </tr>`;
                }
                const fdHistory = item.further_discount_history || [];
                const furtherDiscountTotal = fdHistory.reduce((sum, d) => sum + Number(d.amount || 0), 0);
                // Simple report: direct values only (full history with amount + date is commented out)
                // const furtherDiscountHtml = getAmountDateHistoryStr(fdHistory) || '0';
                // const fineHtml = getFinePrintStr(item);
                const furtherDiscountHtml = amountOrDash(furtherDiscountTotal);
                // Fine states: applied (overdue, included in Total) = bold + underlined, waived = struck-through original,
                // not applicable (fee not overdue) = light grey dash
                const currentFine = Number(item.fine || 0);
                const fineDiscountAmount = (item.late_fee_fine_discount_history || []).reduce((sum, d) => sum + Number(d.amount || 0), 0);
                const fineClass = item.due ? 'fine-applied' : 'fine-na fine-zero';   // not overdue: only the dash, kept at the right. old: a not overdue fee with a fine was 'fine-na' (value at the center)   // a zero fine (only the grey dash) stays at the right like the other rows. old: item.due ? 'fine-applied' : 'fine-na'
                // new: applicable = underlined fine + check mark, not applicable = fine + cross mark, zero fine = light grey dash
                // old: applicable = bold underlined, not applicable = light grey dash
                // only the current fine is shown (the struck-through original fine, before the fine discount, is not shown any more).
                // old: fineDiscountAmount > 0 ? `<s>${(currentFine + fineDiscountAmount).toLocaleString()}</s> ${...current fine...}` : ...
                // fine discount given: the original fine is struck through and the remaining (current) fine follows it, like 300 200 (check / cross mark after it)
                // old: only the current fine was shown
                // a fee that is not overdue yet shows only the grey dash in the Fine cell (old: its fine was shown at the center of the cell)
                const fineHtml = (!item.due || (currentFine === 0 && fineDiscountAmount === 0))
                    ? '<span class="zero-dash">-</span>'
                    : `${fineDiscountAmount > 0 ? `<span class="fine-split"><s>${(currentFine + fineDiscountAmount).toLocaleString()}</s><span>${currentFine.toLocaleString()}</span></span>` : `${currentFine.toLocaleString()}`}`;   // old: <s>original</s> current, all at the right side   // check / cross marks removed (old: ${currentFine.toLocaleString()} ${item.due ? '&#10003;' : '&#10007;'}), the position now shows it: right = applied, center = not applied

                return `
                                    <tr class="row">
                                        <td class="align-center">${++srCounter}</td>
                                        <td class="td-fee-title">${item.title}</td>
                                        ${'' /* <td>${item.status}${item.payment_method === 'Online Payment' ? ' (Online)' : ''}</td> */}
                                        <td class="nowrap">${item.due ? `<u>${formatLedgerDate(item.due_date)}</u>` : formatLedgerDate(item.due_date)}</td>   ${'' /* overdue due date = underlined (item.due) */}
                                        <td>${formatLedgerDateTime(item.paying_date)}</td>   <!-- old: class="nowrap", the text could run out of the cell -->
                                        ${'' /* <td class="blue">${getModeSourceStr(item)}</td> */}
                                        ${'' /* <td>${item.due ? 'Yes' : 'No'}</td> */}
                                        <td class="align-right">${Number(item.actual_fee || 0).toLocaleString()}</td>
                                        ${'' /* <td class="blue">${item.discount || 0}%</td> */}
                                        <td class="align-right">${(Number(item.fee_after_discount || 0) + furtherDiscountTotal).toLocaleString()}</td>
                                        <td class="align-right">${furtherDiscountHtml}</td>
                                        <td class="align-right ${fineClass}">${fineHtml}</td>
                                        <td class="align-right col-total">${Number(item.total || 0).toLocaleString()}</td>
                                        <td class="align-right col-paid">${amountOrDash(item.paid_amount)}</td>
                                        <td class="align-right col-due">${amountOrDash(item.dues)}</td>
                                    </tr>
                                `;
            }).join('') : `<tr><td colspan="11" style="text-align: center; padding: 17px; font-size: 9px;">No Records Found!</td></tr>`}
                        </tbody>
                        ${studentFeeData?.length > 0 ? `
                        <tbody class="grand-total-body">
                            <tr class="grand-total">
                                <td colspan="4">Grand Total</td>
                                <td class="align-right">${totalActualFeePrint.toLocaleString()}</td>
                                <td class="align-right">${totalFeeAfterDiscountPrint.toLocaleString()}</td>
                                <td class="align-right">${totalFurtherDiscountPrint.toLocaleString()}</td>
                                ${totalFineDiscountPrint > 0
                                    ? `<td class="fine-pair-cell"><div class="fine-pair"><div><span>Disc</span><b>${totalFineDiscountPrint.toLocaleString()}</b></div><div><span>Apl</span><b>${totalFinePrint.toLocaleString()}</b></div>${'' /* old order: Apl first, then Disc */}</div></td>`
                                    : `<td class="align-right">${totalFinePrint.toLocaleString()}</td>`}
                                ${'' /* old cells: <td class="align-right">apl : X<br/>dis : Y</td> when a fine discount exists, otherwise only the applied fine total */}
                                <td class="align-right col-total">${Number(totalExpectedFeePrint || 0).toLocaleString()}</td>
                                <td class="align-right col-paid">${Number(totalCollectedFeePrint || 0).toLocaleString()}</td>
                                <td class="align-right col-due">${Number(totalPendingFeePrint || 0).toLocaleString()}</td>
                            </tr>
                        </tbody>` : ''}
                    </table>
                </div>
                ${'' /* <div class="fine-legend"><u>Underlined</u> due date = overdue (unpaid and past its due date, or paid after it) &nbsp;|&nbsp; 300 &#10003; = fine applied (fee overdue, included in Total) &nbsp;|&nbsp; 300 &#10007; = fine not applicable (fee not overdue) &nbsp;|&nbsp; - = nothing / zero</div> */}   <!-- legend removed -->
                <div class="bottom-spacer"></div>
                <div class="report-bottom">
                    ${(breakdownDates.length > 0 || undatedReceived > 0 || undatedDiscount > 0) ? `
                    <div class="breakdown-title">Date Wise Breakdown</div>
                    <table class="breakdown-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th class="align-right">Discount</th>
                                <th class="align-right">Paid</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${breakdownDates.map(k => `
                            <tr>
                                <td class="nowrap">${formatLedgerDate(k + 'T12:00:00')}</td>
                                <td class="align-right">${amountOrDash(dateBreakdown[k].discount)}</td>
                                <td class="align-right">${amountOrDash(dateBreakdown[k].received)}</td>
                            </tr>`).join('')}
                            ${(undatedReceived > 0 || undatedDiscount > 0) ? `
                            <tr>
                                <td>Date not recorded</td>
                                <td class="align-right">${amountOrDash(undatedDiscount)}</td>
                                <td class="align-right">${amountOrDash(undatedReceived)}</td>
                            </tr>` : ''}
                            <tr class="grand-total">
                                <td>Total</td>
                                <td class="align-right">${Number(totalDiscountPrint || 0).toLocaleString()}</td>
                                <td class="align-right">${Number(totalCollectedFeePrint || 0).toLocaleString()}</td>
                            </tr>
                        </tbody>
                    </table>` : ''}
                    <!-- Signature lines (removed for now)
                    <div class="sign-row">
                        <div class="sign-box">Prepared By</div>
                        <div class="sign-box">Checked By</div>
                        <div class="sign-box">Parent Signature</div>
                    </div>
                    <div class="fine-legend"><u>Underlined</u> due date = overdue &nbsp;|&nbsp; <u>Underlined</u> fine = included in Total &nbsp;|&nbsp; <s>Struck-through</s> = fine discount &nbsp;|&nbsp; - = fine not applicable (fee not overdue)</div>
                    -->
                    <div class="print-footer">
                        Generated on: ${new Date().toLocaleDateString("pt-PT")} | Powered by Ai Schooling System.com
                    </div>
                </div>
            </div>
            `;
        };


    var pagesWithFees = printPages.filter(function (page) { return page.feeData.length > 0; });
    var pagesToRender = pagesWithFees.length > 0 ? pagesWithFees : printPages;
    document.body.insertAdjacentHTML("beforeend", pagesToRender.map(function (page, index) { return buildStudentReportPage(page.studentData, page.feeData, index === pagesToRender.length - 1); }).join(""));

    /* ================= RUNNING HEADER (student) + PAGE NUMBERS, printed in the page margin ================= */
    // Removed (commented out): the student name at the top of the 2nd page and "Page 1 of 2" at the bottom of every page
    // (function () {
    //     var first = pagesToRender[0] && pagesToRender[0].studentData;
    //     var name = pagesToRender.length === 1 && first ? String(first.student_name || "") + " | " + String(first.general_registration_code || "") : "Student Fee Ledger";
    //     name = name.split('"').join("");
    //     var css = "@page { @top-left { content: \"" + name + "\"; font-size: 8px; color: #444; } @bottom-right { content: \"Page \" counter(page) \" of \" counter(pages); font-size: 8px; color: #444; } }" +
    //               "@page :first { @top-left { content: \"\"; } }";
    //     var st = document.createElement("style");
    //     st.textContent = css;
    //     document.head.appendChild(st);
    // })();

    /* ================= PIN THE FINE NOTE + GENERATED LINE TO THE END OF THE LAST PRINTED PAGE ================= */
    function fitBottomBlocks() {
        var pageH = document.getElementById("pageMeasure").getBoundingClientRect().height;
        var pages = document.querySelectorAll(".student-report-page");
        pages.forEach(function (pg) { pg.querySelector(".bottom-spacer").style.height = "0px"; });
        document.body.classList.add("measuring");
        pages.forEach(function (pg) {
            var spacer = pg.querySelector(".bottom-spacer"), block = pg.querySelector(".report-bottom"), table = pg.querySelector(".ledger-table");
            var pageTop = pg.getBoundingClientRect().top;
            var theadH = table ? table.querySelector("thead").getBoundingClientRect().height : 0;
            var rows = table ? table.querySelectorAll("tbody tr") : [];
            // walk the rows like the printer does: a row that does not fit moves to the next page,
            // and the table header is repeated at the top of that page
            var shift = 0;
            for (var i = 0; i < rows.length; i++) {
                var rect = rows[i].getBoundingClientRect();
                var top = rect.top - pageTop + shift;
                var bottom = rect.bottom - pageTop + shift;
                var page = Math.floor(top / pageH);
                if (bottom > (page + 1) * pageH) { shift += (page + 1) * pageH + theadH - top; }
            }
            var contentEnd = spacer.getBoundingClientRect().top - pageTop + shift;
            var blockH = block.getBoundingClientRect().height;
            var pagesNeeded = Math.max(1, Math.ceil((contentEnd + blockH) / pageH));
            var spare = pagesNeeded * pageH - contentEnd - blockH - 24;   // 24px safety
            spacer.style.height = Math.max(0, spare) + "px";
        });
        document.body.classList.remove("measuring");
    }
    window.addEventListener("beforeprint", fitBottomBlocks);
    window.addEventListener("afterprint", function () {
        document.querySelectorAll(".bottom-spacer").forEach(function (sp) { sp.style.height = "0px"; });
    });
</script>
