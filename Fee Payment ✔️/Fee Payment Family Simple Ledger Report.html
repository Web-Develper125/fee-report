    function toDateCA(v) { return v ? new Date(v).toLocaleDateString("en-CA") : ""; }

        if (o.feeStatus === "Paid") return toDateCA(o.payingDate) > due;
        if (o.feeStatus === "Clear") return toDateCA(o.clearFeeDate) > due;
        return toDateCA(o.compareDate) > due;
    }

            });
        }

        if (segments.length === 0) {
            const mode = i.payment_mode_id ? getModeName(i.payment_mode_id) : '-';
            const source = i.payment_mode_source_id ? getSourceName(i.payment_mode_source_id) : '';
            return `${mode}${source ? ` / ${source}` : ''} ${i.payment_recieved_by ? `(${i.payment_recieved_by})` : ''}`;
        }

        if (segments.length === 1 && segments[0].type === 'quick') {
            const mode = segments[0].mode_id ? getModeName(segments[0].mode_id) : '-';
            const source = segments[0].source_id ? getSourceName(segments[0].source_id) : '';
            return `${mode}${source ? ` / ${source}` : ''} ${segments[0].recieved_by ? `(${segments[0].recieved_by})` : ''}`;
        }

        // every partial payment is its own block: short date and a dot, amount = mode / source, then time | user under it. A line joins the dots.
        return `<div class="hist">${segments.map((seg) => {
            const mode = seg.mode_id ? getModeName(seg.mode_id) : '-';
            const source = seg.source_id ? getSourceName(seg.source_id) : '';
            const sub = [formatTime12(seg.date), seg.recieved_by || ''].filter(Boolean).join(' | ');
            return renderHistoryItem(seg.date, sub, `${seg.amount} = ${mode}${source ? ` / ${source}` : ''}`);
        }).join('')}</div>`;
    };

    // ---------- Further discount / fine discount histories (detailed report) ----------
    const renderDiscountHistory = (history) => {
        return `<div class="hist">${history.map(entry => {
            const by = String(entry.discount_by || '').trim();
            const sub = [formatTime12(entry.date), by].filter(Boolean).join(' | ');
            return renderHistoryItem(entry.date, sub, `dis = ${entry.amount}`);
        }).join('')}</div>`;
    };
    const getAmountDateHistoryStr = (history) => {
        if (!history?.length) return null;
        return renderDiscountHistory(history);
    };
    const getFinePrintStr = (item, markApplied = false) => {
        const fineHistory = item.late_fee_fine_discount_history || [];
        const currentFine = Number(item.fine || 0).toLocaleString();

        if (fineHistory.length > 0) {
            const totalFineDiscount = fineHistory.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
            const initialFine = (item.fine || 0) + totalFineDiscount;   // the fine before the fine discounts
            const startLine = `Initial Fine: ${Number(initialFine).toLocaleString()}`;
            const historyLines = renderDiscountHistory(fineHistory);
            const currentLine = markApplied
                ? `Current Fine: ${currentFine} <span class="fine-ok">&#10003;</span>`
                : `Current Fine: ${currentFine}`;
            return `<div>${startLine}</div>${historyLines}<div>${currentLine}</div>`;
        }

        return currentFine;
    };

    // ---------- totals of a list of fee rows ----------
    const isClearedRow = (item) => item.status === 'Clear';
    const computeStats = (rows) => {
        const st = { expected: 0, collected: 0, pending: 0, discount: 0, actual: 0, afterDiscount: 0, further: 0, fine: 0, fineDiscount: 0, clearedWaived: 0 };
        rows.forEach(item => {
            const collected = item.paid_amount || 0;
            // a cleared fee waives the remaining amount: expected = collected, pending = 0 (same rule as the footer cards of the page)
            st.expected += isClearedRow(item) ? collected : (item.total || 0);
            st.collected += collected;
            st.pending += isClearedRow(item) ? 0 : (item.dues || 0);
            if (isClearedRow(item)) st.clearedWaived += Number(item.total || 0) - Number(collected);   // amount waived by Clear Fee (shown in the stat box)
            const furtherDiscountAmount = sumHistory(item.further_discount_history);
            const fineDiscountAmount = item.due ? sumHistory(item.late_fee_fine_discount_history) : 0;   // a fine discount counts only when that fine is inside Total (overdue fee)
            st.discount += furtherDiscountAmount + fineDiscountAmount;
            st.fineDiscount += fineDiscountAmount;
            st.actual += Number(item.actual_fee || 0);
            st.afterDiscount += Number(item.fee_after_discount || 0) + furtherDiscountAmount;
            st.further += furtherDiscountAmount;
            st.fine += item.due ? Number(item.fine || 0) : 0;
        });
        return st;
    };
    // Overdue / Not Yet Due: dues of the unpaid (not cleared) fees
    const computeGroupTotals = (rows) => {
        const g = { overdueDues: 0, overdueCount: 0, notYetDueDues: 0, notYetDueCount: 0 };
        rows.forEach(item => {
            if (isClearedRow(item)) return;
            if (Number(item.dues || 0) > 0) {
                if (item.due) { g.overdueDues += Number(item.dues || 0); g.overdueCount++; }
                else { g.notYetDueDues += Number(item.dues || 0); g.notYetDueCount++; }
            }
        });
        return g;
    };

    // ---------- order of the rows: Overdue, Not Yet Due, then Paid (newest paying date first) ----------
    const monthOrder = (i) => (i.fee_month && i.fee_year ? Number(i.fee_year) * 12 + MONTH_NAMES.indexOf(i.fee_month) : 0);
    const byDueDate = (a, b) => (new Date(a.due_date) - new Date(b.due_date)) || (monthOrder(a) - monthOrder(b)) || (new Date(a.fee_generation_date) - new Date(b.fee_generation_date)) || String(a.title).localeCompare(String(b.title));
    const sortFees = (rows) => [
        ...rows.filter(i => !isClearedRow(i) && Number(i.dues || 0) > 0 && i.due).sort(byDueDate),
        ...rows.filter(i => !isClearedRow(i) && Number(i.dues || 0) > 0 && !i.due).sort(byDueDate),
        ...rows.filter(i => isClearedRow(i) || Number(i.dues || 0) <= 0).sort((a, b) => (new Date(b.paying_date || 0) - new Date(a.paying_date || 0)) || byDueDate(a, b)),
    ];

    // ---------- Date wise breakdown ----------
    const buildDateBreakdown = (rows, stats) => {
        const byDate = {};
        const addToDate = (value, field, amount) => {
            const n = Number(amount || 0);
            if (!value || !n) return;
            const key = new Date(value).toLocaleDateString('en-CA');
            byDate[key] = byDate[key] || { received: 0, discount: 0 };
            byDate[key][field] += n;
        };
        rows.forEach(item => {
            const partials = item.partial_payment_history || [];
            const partialSum = partials.reduce((sum, p) => sum + Number(p.amount || 0), 0);
            partials.forEach(p => addToDate(p.date, 'received', p.amount));
            addToDate(item.paying_date, 'received', Number(item.paid_amount || 0) - partialSum);   // full / quick payment
            (item.further_discount_history || []).forEach(d => addToDate(d.date, 'discount', d.amount));
            if (item.due) (item.late_fee_fine_discount_history || []).forEach(d => addToDate(d.date, 'discount', d.amount));
        });
        const dates = Object.keys(byDate).sort();
        const datedReceived = dates.reduce((sum, k) => sum + byDate[k].received, 0);
        const datedDiscount = dates.reduce((sum, k) => sum + byDate[k].discount, 0);
        return {
            byDate,
            dates,
            // amounts that have no date (for example the discount given when the fee was generated)
            undatedReceived: Math.max(0, stats.collected - datedReceived),
            undatedDiscount: Math.max(0, stats.discount - datedDiscount),
        };
    };
    const renderBreakdown = (title, rows, stats) => {
        const bd = buildDateBreakdown(rows, stats);
        if (!(bd.dates.length > 0 || bd.undatedReceived > 0 || bd.undatedDiscount > 0)) return '';
        return `
                    <div class="breakdown-title">${title}</div>
                    <table class="breakdown-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th class="align-right">Discount</th>
                                <th class="align-right">Paid</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${bd.dates.map(k => `
                            <tr>
                                <td class="nowrap">${formatLedgerDate(k + 'T12:00:00')}</td>
                                <td class="align-right">${amountOrDash(bd.byDate[k].discount)}</td>
                                <td class="align-right">${amountOrDash(bd.byDate[k].received)}</td>
                            </tr>`).join('')}
                            ${(bd.undatedReceived > 0 || bd.undatedDiscount > 0) ? `
                            <tr>
                                <td>Date not recorded</td>
                                <td class="align-right">${amountOrDash(bd.undatedDiscount)}</td>
                                <td class="align-right">${amountOrDash(bd.undatedReceived)}</td>
                            </tr>` : ''}
                            <tr class="grand-total">
                                <td>Total</td>
                                <td class="align-right">${Number(stats.discount || 0).toLocaleString()}</td>
                                <td class="align-right">${Number(stats.collected || 0).toLocaleString()}</td>
                            </tr>
                        </tbody>
                    </table>`;
    };

    // ---------- page parts ----------
    const renderHeader = () => `
                <div class="header-section">
                    <div>
                        ${systemSettings?.school_logo ? `<img src="${systemSettings.school_logo}" class="header-logo" alt="Logo" />` : ''}
                    </div>
                    <div style="text-align: center; flex: 1;">
                        <h1>${systemSettings?.school_name || 'School Management System'}</h1>
                        <h2>${reportTitle}</h2>
                    </div>
                    <div style="opacity: 0; width: ${isFamily && detailed ? 44 : 56}px;"></div>
                </div>`;

    const renderGroupSummary = (g) => `
                <div class="group-summary" style='border-top-width:1.5px;'>
                    <div class="group-item"><span class="group-label">Overdue (${g.overdueCount} ${g.overdueCount === 1 ? 'fee' : 'fees'}) =</span><span class="group-value" style='font-size:15px;'>${amountOrDash(g.overdueDues)}</span></div>
                    <div class="group-item"><span class="group-label">Not Yet Due (${g.notYetDueCount} ${g.notYetDueCount === 1 ? 'fee' : 'fees'}) =</span><span class="group-value" style='font-size:15px;'>${amountOrDash(g.notYetDueDues)}</span></div>
                </div>`;

    const renderLegend = () => `
                <div class="fine-legend"><u>Underlined</u> due date = overdue (unpaid and past its due date, or paid after it) &nbsp;|&nbsp; 300 &#10003; = fine applied (fee overdue, included in Total) &nbsp;|&nbsp; 300 &#10007; = fine not applicable (fee not overdue) &nbsp;|&nbsp; - = nothing / zero</div>`;

    const renderBottom = (breakdownHtml) => `
                <div class="bottom-spacer"></div>
                <div class="report-bottom">
                    ${breakdownHtml}
                    ${detailed ? `<div class="sign-row">
                        <div class="sign-box">Prepared By</div>
                        <div class="sign-box">Checked By</div>
                        <div class="sign-box">Parent Signature</div>
                    </div>` : ''}
                    <div class="print-footer">
                        Generated on: ${new Date().toLocaleDateString("pt-PT")} | Powered by Ai Schooling System.com
                    </div>
                </div>`;

    // ---------- one fee row ----------
    const renderFeeRow = (item, srNo) => {
        const fdHistory = item.further_discount_history || [];
        const furtherDiscountTotal = sumHistory(fdHistory);
        const currentFine = Number(item.fine || 0);
        const cleared = isClearedRow(item);
        // a cleared fee waives the remaining amount: its Total is what was collected and nothing is due
        const rowTotal = cleared ? (item.paid_amount || 0) : (item.total || 0);
        const rowDues = cleared ? 0 : (item.dues || 0);
        const dueDateHtml = item.due_date ? (item.due ? `<u>${formatLedgerDate(item.due_date)}</u>` : formatLedgerDate(item.due_date)) : dash;

        if (!detailed) {
            // Simple report: direct values only. Fine: a fee that is not overdue shows only the grey dash. An overdue fee shows its current fine at the right;
            // when part of the fine was waived the original fine is struck through at the left. No check / cross marks.
            const fineClass = item.due ? 'fine-applied' : 'fine-na fine-zero';
            const fineDiscountAmount = sumHistory(item.late_fee_fine_discount_history);
            const fineHtml = (!item.due || (currentFine === 0 && fineDiscountAmount === 0))
                ? '<span class="zero-dash">-</span>'
                : (fineDiscountAmount > 0
                    ? `<span class="fine-split"><s>${(currentFine + fineDiscountAmount).toLocaleString()}</s><span>${currentFine.toLocaleString()}</span></span>`
                    : `${currentFine.toLocaleString()}`);
            // old fine cell (commented out): fine + check mark (overdue) or fine + cross mark (not overdue), struck-through original fine when a discount was given
            // // Simple report: direct values only. Fine: the original fine is struck through when a fine discount was given, then the current fine
            // // with a check mark (overdue, included in Total) or a cross mark (not overdue); a zero fine without a discount = dash
            // const fineClass = item.due ? 'fine-applied' : 'fine-na';
            // const fineDiscountAmount = sumHistory(item.late_fee_fine_discount_history);
            // const fineHtml = (currentFine === 0 && fineDiscountAmount === 0)
            // ? '<span class="zero-dash">-</span>'
            // : (fineDiscountAmount > 0
            // ? `<span class="fine-split"><s>${(currentFine + fineDiscountAmount).toLocaleString()}</s><span>${currentFine.toLocaleString()} ${item.due ? '&#10003;' : '&#10007;'}</span></span>`
            // : `${currentFine.toLocaleString()} ${item.due ? '&#10003;' : '&#10007;'}`);
            return `
                                    <tr class="row">
                                        <td class="align-center">${srNo}</td>
                                        <td class="td-fee-title">${item.title}</td>
                                        <td class="nowrap">${item.due ? `<u>${formatLedgerDate(item.due_date)}</u>` : formatLedgerDate(item.due_date)}</td>
                                        <td>${formatPayingDate(item.paying_date)}</td>
                                        <td class="align-right">${Number(item.actual_fee || 0).toLocaleString()}</td>
                                        <td class="align-right">${(Number(item.fee_after_discount || 0) + furtherDiscountTotal).toLocaleString()}</td>
                                        <td class="align-right">${amountOrDash(furtherDiscountTotal)}</td>
                                        <td class="align-right ${fineClass}">${fineHtml}</td>
                                        <td class="align-right col-total">${Number(rowTotal).toLocaleString()}</td>
                                        <td class="align-right col-paid">${amountOrDash(item.paid_amount)}</td>
                                        <td class="align-right col-due">${amountOrDash(rowDues)}</td>
                                    </tr>`;
        }

        // Detailed report
        const furtherDiscountHtml = getAmountDateHistoryStr(fdHistory) || dash;
        // Fine: a fee that is not overdue shows only the grey dash. An overdue fee shows its fine (with the initial fine and the discount history
        // when a fine discount was given). No check / cross marks.
        const hasFineHistory = (item.late_fee_fine_discount_history || []).length > 0;
        const fineHtml = (!item.due || (currentFine === 0 && !hasFineHistory)) ? dash : getFinePrintStr(item);
        // old fine cell (commented out): cross mark for a fee that is not overdue, check mark for an overdue one
        // const hasFineHistory = (item.late_fee_fine_discount_history || []).length > 0;
        // let fineHtml;
        // if (currentFine === 0 && !hasFineHistory) {
        // fineHtml = dash;
        // } else if (!item.due && !hasFineHistory) {
        // fineHtml = `<span class="fine-na">${currentFine.toLocaleString()} &#10007;</span>`;   // fine amount + cross mark
        // } else if (item.due) {
        // fineHtml = hasFineHistory ? getFinePrintStr(item, true) : `${getFinePrintStr(item)} <span class="fine-ok">&#10003;</span>`;
        // } else {
        // fineHtml = getFinePrintStr(item);
        // }
        const modeSourceHtml = getModeSourceStr(item).trim();
        return `
                                    <tr class="row">
                                        <td class="align-center">${srNo}</td>
                                        <td class="td-fee-title">${item.title}</td>
                                        <td class="nowrap">${dueDateHtml}</td>
                                        <td>${formatPayingDate(item.paying_date)}</td>
                                        <td>${modeSourceHtml === '-' || modeSourceHtml === '' ? dash : modeSourceHtml}</td>
                                        <td class="align-right">${Number(item.actual_fee || 0).toLocaleString()}</td>
                                        <td class="align-right">${(Number(item.fee_after_discount || 0) + furtherDiscountTotal).toLocaleString()}</td>
                                        <td class="${fdHistory.length > 0 ? 'align-left' : 'align-right'}">${furtherDiscountHtml}</td>
                                        <td class="${(item.due && hasFineHistory) ? 'align-left' : 'align-right'}">${fineHtml}</td>
                                        <td class="align-right col-total">${Number(rowTotal).toLocaleString()}</td>
                                        <td class="align-right col-paid">${amountOrDash(item.paid_amount)}</td>
                                        <td class="align-right col-due">${amountOrDash(rowDues)}</td>
                                    </tr>`;
    };

    // ---------- one ledger table (rows + total row) ----------
    const LEDGER_COLS = detailed
        ? [3, 11, 7, 11, 16.5, 4.5, 5.5, 13, 12.5, 5, 5, 5.5]
        : [4.5, 16.6, 9.5, 15.9, 6.7, 8.2, 7.2, 9.7, 6.9, 6.9, 7.9];
    const renderLedgerTable = (rows, totalLabel) => {
        const st = computeStats(rows);
        const ordered = sortFees(rows);
        const colCount = LEDGER_COLS.length;
        return `
                    <table class="ledger-table">
                        <colgroup>${LEDGER_COLS.map(w => `<col style="width:${w}%">`).join('')}</colgroup>
                        <thead>
                            <tr>
                                <th class="align-center">Sr #</th>
                                <th>Fee Title</th>
                                <th>Due Date</th>
                                <th>Paying Date</th>
                                ${detailed ? '<th>Mode / Source (User)</th>' : ''}
                                <th class="align-right">Actual Class Fee</th>
                                <th class="align-right">Fee After Discount</th>
                                <th class="align-right">Further Fee Disc</th>
                                <th class="align-right">Fine</th>
                                <th class="align-right col-total">Total</th>
                                <th class="align-right col-paid">Paid</th>
                                <th class="align-right col-due">Fee Dues</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${ordered.length > 0 ? ordered.map((item, index) => renderFeeRow(item, index + 1)).join('') : `<tr><td colspan="${colCount}" style="text-align: center; padding: 17px; font-size: 9px;">No Records Found!</td></tr>`}
                        </tbody>
                        ${ordered.length > 0 ? `
                        <tbody class="grand-total-body">
                            <tr class="grand-total">
                                <td colspan="${detailed ? 5 : 4}">${totalLabel}</td>
                                <td class="align-right">${st.actual.toLocaleString()}</td>
                                <td class="align-right">${st.afterDiscount.toLocaleString()}</td>
                                <td class="align-right">${detailed ? amountOrDash(st.further) : st.further.toLocaleString()}</td>
                                <td class="fine-pair-cell"><div class="fine-pair"><div><span>Disc</span><b>${st.fineDiscount.toLocaleString()}</b></div><div><span>Apl</span><b>${st.fine.toLocaleString()}</b></div></div></td>
                                ${'' /* old: the DISC / APL boxes were only shown when a fine discount existed (st.fineDiscount > 0), otherwise only the applied fine total */}
                                <td class="align-right col-total">${Number(st.expected || 0).toLocaleString()}</td>
                                <td class="align-right col-paid">${Number(st.collected || 0).toLocaleString()}</td>
                                <td class="align-right col-due">${Number(st.pending || 0).toLocaleString()}</td>
                            </tr>
                        </tbody>` : ''}
                    </table>`;
    };

    // ---------- Student report (one student) ----------
    const buildStudentPage = () => {
        const st = computeStats(feeData);
        const g = computeGroupTotals(feeData);
        return `
            <div class="student-report-page last-page">
                ${renderHeader()}

                <\!-- Student Details + Fee Summary (one row) -->
                <div class="top-band" style='gap:0px;'>
                <div class="top-left" style='gap:0px;'>
                <div class="info-grid">
                    <div class="info-item"><span class="info-label">Student Name</span><span class="info-value">${studentData?.student_name || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Father Name</span><span class="info-value">${studentData?.student_father_name || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Reg #</span><span class="info-value">${studentData?.general_registration_code || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Status</span><span class="info-value">${studentData?.student_status || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Class / Section</span><span class="info-value">${studentData?.student_class_name || '-'} / ${studentData?.student_section_name || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Campus</span><span class="info-value">${studentData?.student_campus_name || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Phone</span><span class="info-value">${studentData?.student_father_phone || '-'}</span></div>
                    <div class="info-item info-highlight"><span class="info-label">Family Advance${siblingCount !== null && siblingCount !== undefined ? ` (Sibling: ${Number(siblingCount)})` : ''}</span><span class="info-value">Rs. ${Number(studentData?.family_credit || 0).toLocaleString()}</span></div>
                </div>
                ${renderGroupSummary(g)}
                </div>

                <div class="summary-grid">
                    <div class="summary-card"><span class="summary-label">Receivable</span><span class="summary-value">${Number((st.afterDiscount || 0) + (st.fineDiscount || 0)).toLocaleString()}</span></div>${'' /* old value: only the Fee After Discount total, without the fine discount */}
                    <div class="summary-card"><span class="summary-label">Disc (Further Fee + Fine)</span><span class="summary-value">${(st.discount || 0) ? '-' : ''}${Number(st.discount || 0).toLocaleString()}</span></div>
                    ${st.clearedWaived !== 0 ? `<div class="summary-card"><span class="summary-label">Cleared Fee Waived</span><span class="summary-value">${st.clearedWaived > 0 ? "-" : "+"}${Math.abs(st.clearedWaived).toLocaleString()}</span></div>` : ''}
                    <div class="summary-card"><span class="summary-label">Fine Applied</span><span class="summary-value">${(st.fine || 0) ? '+' : ''}${Number(st.fine || 0).toLocaleString()}</span></div>
                    <div class="summary-card result"><span class="summary-label">= Net Receivable</span><span class="summary-value">${Number(st.expected || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Received</span><span class="summary-value">${Number(st.collected || 0).toLocaleString()}</span></div>
                    <div class="summary-card dues"><span class="summary-label">= Dues</span><span class="summary-value">${Number(st.pending || 0).toLocaleString()}</span></div>
                </div>
                </div>

                <\!-- Data Table -->
                <div style="overflow: auto; margin-bottom: 11px;">
                    ${renderLedgerTable(feeData, 'Grand Total')}
                </div>
                ${renderBottom(renderBreakdown('Date Wise Breakdown', feeData, st))}
            </div>
            `;
    };

    // ---------- Family report (father details, siblings, one ledger per sibling) ----------
    const buildFamilyPage = () => {
        const allFees = familyPages.reduce((all, p) => all.concat(p.feeData), []);
        const familyStats = computeStats(allFees);
        const g = computeGroupTotals(allFees);

        // Family advance is subtracted from the dues. If the advance is bigger than the dues, what is left of the advance is shown instead.
        const familyAdvance = Number(family.family_credit || 0);
        const duesAfterAdvance = Number(familyStats.pending || 0) - familyAdvance;
        const advanceCoversDues = duesAfterAdvance < 0;

        return `
            <div class="student-report-page last-page">
                ${renderHeader()}

                <\!-- Father details + family fee summary (one row) -->
                <div class="top-band">
                <div class="top-left">
                <div class="info-grid family-info-grid">
                    <div class="info-item"><span class="info-label">Family Code</span><span class="info-value">${family.family_code || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Account Name</span><span class="info-value">${family.father_name || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Phone</span><span class="info-value">${family.phone || '-'}</span></div>
                    <div class="info-item"><span class="info-label">CNIC</span><span class="info-value">${family.cnic || '-'}</span></div>
                    <div class="info-item"><span class="info-label">Siblings</span><span class="info-value">${family.students.length}</span></div>
                    <div class="info-item info-highlight"><span class="info-label">Family Advance</span><span class="info-value">Rs. ${familyAdvance.toLocaleString()}</span></div>
                </div>
                ${renderGroupSummary(g)}
                </div>

                <div class="summary-grid">
                    <div class="summary-card"><span class="summary-label">Receivable</span><span class="summary-value">${Number((familyStats.afterDiscount || 0) + (familyStats.fineDiscount || 0)).toLocaleString()}</span></div>${'' /* old value: only the Fee After Discount total, without the fine discount */}
                    <div class="summary-card"><span class="summary-label">Disc (Further Fee + Fine)</span><span class="summary-value">${(familyStats.discount || 0) ? '-' : ''}${Number(familyStats.discount || 0).toLocaleString()}</span></div>
                    ${familyStats.clearedWaived !== 0 ? `<div class="summary-card"><span class="summary-label">Cleared Fee Waived</span><span class="summary-value">${familyStats.clearedWaived > 0 ? "-" : "+"}${Math.abs(familyStats.clearedWaived).toLocaleString()}</span></div>` : ''}
                    <div class="summary-card"><span class="summary-label">Fine Applied</span><span class="summary-value">${(familyStats.fine || 0) ? '+' : ''}${Number(familyStats.fine || 0).toLocaleString()}</span></div>
                    <div class="summary-card result"><span class="summary-label">= Net Receivable</span><span class="summary-value">${Number(familyStats.expected || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Received</span><span class="summary-value">${Number(familyStats.collected || 0).toLocaleString()}</span></div>
                    <div class="summary-card result"><span class="summary-label">= Remaining</span><span class="summary-value">${Number(familyStats.pending || 0).toLocaleString()}</span></div>
                    <div class="summary-card"><span class="summary-label">Family Advance</span><span class="summary-value">- ${familyAdvance.toLocaleString()}</span></div>
                    <div class="summary-card dues"><span class="summary-label">${advanceCoversDues ? '= Advance Left' : '= Net Dues'}</span><span class="summary-value">${Math.abs(duesAfterAdvance).toLocaleString()}</span></div>
                </div>
                </div>

                <\!-- Siblings -->
                <div class="section-heading">Siblings (${family.students.length})</div>
                <table class="children-table">
                    <thead>
                        <tr>
                            <th class="align-center">Sr #</th>
                            <th>Reg #</th>
                            <th>Student Name</th>
                            <th>Class / Section</th>
                            <th>Campus</th>
                            <th>Status</th>
                            <th class="align-right">Net Receivable</th>
                            <th class="align-right">Received</th>
                            <th class="align-right">Dues</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${familyPages.map((p, index) => {
            const st = computeStats(p.feeData);
            return `
                        <tr class="row">
                            <td class="align-center">${index + 1}</td>
                            <td class="nowrap">${p.studentData?.general_registration_code || '-'}</td>
                            <td>${p.studentData?.student_name || '-'}</td>
                            <td class="nowrap">${p.studentData?.student_class_name || '-'} / ${p.studentData?.student_section_name || '-'}</td>
                            <td>${p.studentData?.student_campus_name || '-'}</td>
                            <td>${p.studentData?.student_status || '-'}</td>
                            <td class="align-right">${Number(st.expected || 0).toLocaleString()}</td>
                            <td class="align-right">${amountOrDash(st.collected)}</td>
                            <td class="align-right col-due">${amountOrDash(st.pending)}</td>
                        </tr>`;
        }).join('')}
                        <tr class="grand-total">
                            <td colspan="6">Family Total</td>
                            <td class="align-right">${Number(familyStats.expected || 0).toLocaleString()}</td>
                            <td class="align-right">${Number(familyStats.collected || 0).toLocaleString()}</td>
                            <td class="align-right col-due">${Number(familyStats.pending || 0).toLocaleString()}</td>
                        </tr>
                    </tbody>
                </table>

                <\!-- One ledger for each sibling -->
                ${familyPages.map(p => `
                <div class="student-section">
                    <div class="student-title">
                        <span>${p.studentData?.student_name || '-'} (${p.studentData?.general_registration_code || '-'})</span>
                        <span class="r">${p.studentData?.student_class_name || '-'} / ${p.studentData?.student_section_name || '-'}</span>
                    </div>
                    ${renderLedgerTable(p.feeData, 'Student Total')}
                </div>`).join('')}

                ${renderBottom(renderBreakdown('Date Wise Breakdown (All Siblings)', allFees, familyStats))}
            </div>
            `;
    };

    const pageHtml = isFamily ? buildFamilyPage() : buildStudentPage();

    // running header (top-left) and page numbers (bottom-right), printed in the page margin. The family detailed report prints without them.
    const showRunningHeader = false;   // the student / family name at the top of the 2nd page and "Page 1 of 2" are removed. old: !(isFamily && detailed)
    const runningHeader = isFamily
        ? `Family ${family.family_code || '-'} | ${family.father_name || '-'}`
        : `${studentData?.student_name || '-'} | ${studentData?.general_registration_code || '-'}`;
    const runningHeaderJson = JSON.stringify(String(runningHeader).split('<').join(''));
    const safetyPx = isLandscapePage ? 80 : 24;   // landscape needs more spare room than portrait

    return `<!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <title>${reportTitle}</title>
            <style>
${reportCss}
            </style>
        </head>
        <body>
            <div class="page-measure" id="pageMeasure"></div>
            ${pageHtml}
            <script>
                ${showRunningHeader ? `(function () {
                    var reportName = ${runningHeaderJson};
                    var css = '@page { @top-left { content: ' + JSON.stringify(reportName) + '; font-size: 8px; color: #444; } @bottom-right { content: "Page " counter(page) " of " counter(pages); font-size: 8px; color: #444; } } @page :first { @top-left { content: ""; } }';
                    var st = document.createElement('style');
                    st.textContent = css;
                    document.head.appendChild(st);
                })();` : ''}

                // pin the date wise breakdown (and the signature lines / generated line) to the end of the last printed page
                function fitBottomBlocks() {
                    var pageH = document.getElementById('pageMeasure').getBoundingClientRect().height;
                    var pages = document.querySelectorAll('.student-report-page');
                    pages.forEach(function (pg) { pg.querySelector('.bottom-spacer').style.height = '0px'; });
                    document.body.classList.add('measuring');
                    pages.forEach(function (pg) {
                        var spacer = pg.querySelector('.bottom-spacer'), block = pg.querySelector('.report-bottom');
                        var pageTop = pg.getBoundingClientRect().top;
                        // walk the rows of every table like the printer does: a row that does not fit moves to the next page,
                        // and the header of its table is repeated at the top of that page
                        var rows = pg.querySelectorAll('.children-table tbody tr, .ledger-table tbody tr');
                        var shift = 0;
                        for (var i = 0; i < rows.length; i++) {
                            var rect = rows[i].getBoundingClientRect();
                            var theadH = rows[i].closest('table').querySelector('thead').getBoundingClientRect().height;
                            var top = rect.top - pageTop + shift;
                            var bottom = rect.bottom - pageTop + shift;
                            var page = Math.floor(top / pageH);
                            if (bottom > (page + 1) * pageH) { shift += (page + 1) * pageH + theadH - top; }
                        }
                        var contentEnd = spacer.getBoundingClientRect().top - pageTop + shift;
                        var blockH = block.getBoundingClientRect().height;
                        var pagesNeeded = Math.max(1, Math.ceil((contentEnd + blockH) / pageH));
                        var spare = pagesNeeded * pageH - contentEnd - blockH - ${safetyPx};
                        spacer.style.height = Math.max(0, spare) + 'px';
                    });
                    document.body.classList.remove('measuring');
                }
                window.addEventListener('beforeprint', fitBottomBlocks);
                window.addEventListener('afterprint', function () {
                    document.querySelectorAll('.bottom-spacer').forEach(function (sp) { sp.style.height = '0px'; });
                });
            <\/script>
        </body>
        </html>
    `;
};

    var familyPages = familyInfo.students.map(function (st, i) { return { studentData: st, feeData: buildFeeRows(i === 0 ? studentDues1 : studentDues2) }; });
    var reportArgs = { variant: "simple", isFamily: true, systemSettings: systemSettings, getModeName: getModeName, getSourceName: getSourceName, family: familyInfo, familyPages: familyPages };

    /* ================= RENDER: the report is built by the same function the software uses and written as the whole page ================= */
    window.addEventListener("load", function () {
        var html = buildFeeLedgerReportHtml(reportArgs);
        document.open();
        document.write(html);
        document.close();
        // preview only
        var st = document.createElement("style");
        st.textContent = ".print-btn { position: fixed; top: 12px; right: 16px; background: #000; color: #fff; border: 1px solid #000; padding: 7px 16px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: Poppins, sans-serif; } @media print { .print-btn { display: none !important; } }";
        document.head.appendChild(st);
        var b = document.createElement("button");
        b.className = "print-btn"; b.textContent = "Print"; b.onclick = function () { window.print(); };
        document.body.appendChild(b);
    });
</script>
</body>
</html>
